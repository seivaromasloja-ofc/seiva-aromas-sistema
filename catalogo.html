const SINGLE_SIZE = 'Único';
function variantLabel(color, size) { return size && size !== SINGLE_SIZE ? `${color}/${size}` : color; }

function WelcomeBanner({ storeName, logoUrl, welcomeMessage, onClose }) {
  return (
    <div
      className="fixed inset-0 z-50 flex items-center justify-center px-5"
      style={{ backgroundColor: 'rgba(30,29,26,0.75)', backdropFilter: 'blur(3px)' }}
      onClick={onClose}
    >
      <div
        className="relative w-full max-w-sm welcome-card rounded-2xl"
        style={{ backgroundColor: '#314A3A' }}
        onClick={(e) => e.stopPropagation()}
      >
        <button
          onClick={onClose}
          aria-label="Fechar"
          className="absolute top-4 right-4 text-xl leading-none transition-colors"
          style={{ color: '#6E6558' }}
        >✕</button>
        <div className="px-8 pt-10 pb-9 text-center">
          <img src={BRAND_LOGO_GOLD} alt={BRAND_NAME} className="h-16 w-auto mx-auto mb-6" />
          <h2 className="f-display font-bold leading-tight" style={{ fontSize: '30px', color: '#C89A3D' }}>
            Boas-vindas!
          </h2>
          <p className="f-body text-[14px] leading-relaxed mt-4" style={{ color: '#C9D3C6' }}>
            {welcomeMessage || 'Aproveite nosso catálogo com as últimas novidades.'}
          </p>
          <button onClick={onClose} className="btn-primary w-full mt-8">
            Ver catálogo
          </button>
        </div>
      </div>
    </div>
  );
}

function Lightbox({ photos, index, onClose, onNav }) {
  useEffect(() => {
    if (index === null || index === undefined) return;
    const handleKey = (e) => {
      if (e.key === 'ArrowLeft') onNav(-1);
      else if (e.key === 'ArrowRight') onNav(1);
      else if (e.key === 'Escape') onClose();
    };
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  }, [index, onNav, onClose]);

  if (index === null || index === undefined) return null;
  return (
    <div
      className="fixed inset-0 bg-slate-900/95 z-50 flex items-center justify-center px-4"
      style={{ backdropFilter: 'blur(2px)' }}
      onClick={onClose}
    >
      <button onClick={onClose} className="lightbox-icon-btn absolute top-6 right-6" style={{ fontSize: '16px' }}>✕</button>
      {photos.length > 1 && (
        <button
          onClick={(e) => { e.stopPropagation(); onNav(-1); }}
          className="lightbox-icon-btn absolute left-3 sm:left-8"
          style={{ fontSize: '20px' }}
        >‹</button>
      )}
      <img
        src={photos[index]}
        alt=""
        onClick={(e) => { e.stopPropagation(); if (photos.length > 1) onNav(1); }}
        className="max-h-[85vh] max-w-full object-contain cursor-pointer"
        style={{ viewTransitionName: 'active-photo' }}
      />
      {photos.length > 1 && (
        <button
          onClick={(e) => { e.stopPropagation(); onNav(1); }}
          className="lightbox-icon-btn absolute right-3 sm:right-8"
          style={{ fontSize: '20px' }}
        >›</button>
      )}
    </div>
  );
}

function LookCard({ product, onAddToCart, onOpenLightbox, activeSourceKey }) {
  const photos = product.photos || [];
  const variants = product.variants || [];
  const allOutOfStock = variants.length > 0 && variants.every(v => !v.inStock);
  const availableColors = [...new Set(variants.filter(v => v.inStock).map(v => v.color))];
  const [selectedColor, setSelectedColor] = useState(availableColors[0] || null);
  const singleSizeFor = (color) => { const s = variants.filter(v => v.color === color && v.inStock).map(v => v.size); return s.length === 1 ? s[0] : null; };
  const [selectedSize, setSelectedSize] = useState(() => singleSizeFor(availableColors[0]));
  const [qty, setQty] = useState(1);
  const [showDetails, setShowDetails] = useState(false);

  const sizesForColor = variants.filter(v => v.color === selectedColor && v.inStock);
  const canAdd = selectedColor && selectedSize && !allOutOfStock;
  const sourceKey = `${product.id}-0`;

  const add = () => {
    if (!canAdd) return;
    onAddToCart({ productId: product.id, name: product.name, color: selectedColor, size: selectedSize, price: product.price, qty });
    setQty(1);
  };

  return (
    <div className="look-card h-full flex flex-col">
      <div
        className="look-photo relative overflow-hidden bg-[#EFE6D2] cursor-pointer"
        style={{ aspectRatio: '4 / 5' }}
        onClick={() => photos.length && onOpenLightbox(photos, 0, sourceKey)}
      >
        {photos[0] ? (
          <img
            src={photos[0]} alt={product.name}
            className="w-full h-full object-cover"
            style={{
              ...(allOutOfStock ? { filter: 'grayscale(1)', opacity: 0.45 } : {}),
              viewTransitionName: activeSourceKey === sourceKey ? 'active-photo' : 'none',
            }}
          />
        ) : (
          <div className="w-full h-full flex items-center justify-center">
            <span className="eyebrow">sem foto</span>
          </div>
        )}
        {allOutOfStock && (
          <div className="absolute inset-0 flex items-center justify-center">
            <span className="eyebrow border-t border-b py-2.5" style={{ letterSpacing: '0.3em', paddingLeft: '4px', paddingRight: '4px', color: '#1E1D1A', borderColor: 'rgba(30,29,26,0.5)' }}>ESGOTADO</span>
          </div>
        )}
      </div>

      {photos.length > 1 && (
        <div className="flex gap-1.5 mt-2">
          {photos.map((ph, i) => (
            <img
              key={i} src={ph} alt=""
              onClick={() => onOpenLightbox(photos, i, `${product.id}-${i}`)}
              className="w-11 h-11 object-cover cursor-pointer opacity-70 hover:opacity-100 transition-opacity"
              style={{ viewTransitionName: activeSourceKey === `${product.id}-${i}` ? 'active-photo' : 'none' }}
            />
          ))}
        </div>
      )}

      <div className="pt-4 flex flex-col flex-1">
        {product.category && <div className="eyebrow mb-1.5">{product.category}</div>}
        <div className="f-display text-[22px] leading-snug font-semibold" style={{ color: '#1E1D1A' }}>{product.name}</div>
        {(product.description || product.notes) && (
          <div className="mt-1.5">
            <button
              onClick={() => setShowDetails(s => !s)}
              className="details-toggle"
            >Detalhes do produto</button>
            {showDetails && (
              <div className="mt-2">
                {product.description && <div className="f-body text-[13px] text-[#6E6558] leading-relaxed">{product.description}</div>}
                {product.notes && <div className="f-body text-[12px] text-[#6E6558] italic mt-1">{product.notes}</div>}
              </div>
            )}
          </div>
        )}

        {availableColors.length > 0 && (
          <div className="flex flex-wrap gap-1.5 mt-4">
            {availableColors.map(c => (
              <button
                key={c}
                onClick={() => { setSelectedColor(c); setSelectedSize(singleSizeFor(c)); }}
                className={`size-pill ${selectedColor === c ? 'selected' : ''}`}
              >{c}</button>
            ))}
          </div>
        )}

        {selectedColor && sizesForColor.length > 0 && !(sizesForColor.length === 1 && sizesForColor[0].size === SINGLE_SIZE) && (
          <div className="flex flex-wrap gap-1.5 mt-2">
            {sizesForColor.map(v => (
              <button
                key={v.size}
                onClick={() => setSelectedSize(v.size)}
                className={`size-pill ${selectedSize === v.size ? 'selected' : ''}`}
              >{v.size}</button>
            ))}
          </div>
        )}

        <div className="flex items-center justify-between gap-4 mt-5 pt-4 border-t border-[#E4D9C4]">
          <span className="f-mono text-[17px]" style={{ color: '#1E1D1A' }}>{formatBRL(product.price)}</span>
          <div className="flex items-center gap-2 shrink-0">
            <span className="eyebrow" style={{ letterSpacing: '0.08em' }}>qtd</span>
            <input
              type="number" min="1" value={qty}
              onChange={e => setQty(Math.max(1, Number(e.target.value) || 1))}
              className="fw-input w-11 text-center"
              style={{ padding: '5px 4px', fontSize: '13px' }}
            />
          </div>
        </div>

        <button onClick={add} disabled={!canAdd} className="btn-primary w-full mt-3">
          {allOutOfStock ? 'Esgotado' : !selectedColor ? 'Escolha o aroma' : !selectedSize ? 'Escolha o tamanho' : 'Adicionar à sacola'}
        </button>
      </div>
    </div>
  );
}

function App() {
  const [catalog, setCatalog] = useState(undefined);
  const [cart, setCart] = useState([]);
  const [payment, setPayment] = useState('pix');
  const [clientName, setClientName] = useState('');
  const [lightbox, setLightbox] = useState(null);
  const [cartCollapsed, setCartCollapsed] = useState(false);
  const [search, setSearch] = useState('');
  const [activeCategory, setActiveCategory] = useState(null);
  const [showWelcome, setShowWelcome] = useState(() => {
    try { return sessionStorage.getItem('seiva_welcome_seen') !== '1'; } catch (e) { return true; }
  });
  const closeWelcome = () => {
    setShowWelcome(false);
    try { sessionStorage.setItem('seiva_welcome_seen', '1'); } catch (e) { /* ignore */ }
  };

  useEffect(() => {
    (async () => {
      try {
        const { data, error } = await sb.from('catalog_public').select('*').eq('user_id', SHARED_STORE_ID).maybeSingle();
        if (error) throw error;
        setCatalog(data || null);
      } catch (e) {
        console.error('Erro ao carregar catálogo:', e);
        setCatalog(null);
      }
    })();
  }, []);

  const addToCart = (item) => {
    setCart(c => {
      const existing = c.find(i => i.productId === item.productId && i.color === item.color && i.size === item.size);
      if (existing) return c.map(i => i === existing ? { ...i, qty: i.qty + item.qty } : i);
      return [...c, item];
    });
  };

  const removeFromCart = (idx) => setCart(c => c.filter((_, i) => i !== idx));
  const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const itemCount = cart.reduce((s, i) => s + i.qty, 0);

  const [couponCode, setCouponCode] = useState('');
  const [appliedCoupon, setAppliedCoupon] = useState(null); // { code, discount_type, discount_value }
  const [couponMessage, setCouponMessage] = useState('');
  const [couponLoading, setCouponLoading] = useState(false);
  const [sendingOrder, setSendingOrder] = useState(false);

  const applyCoupon = async () => {
    if (!couponCode.trim()) return;
    setCouponLoading(true);
    setCouponMessage('');
    try {
      const { data, error } = await sb.from('coupons').select('*').ilike('code', couponCode.trim()).maybeSingle();
      if (error) throw error;
      if (!data) {
        setAppliedCoupon(null);
        setCouponMessage('Cupom não encontrado');
        return;
      }
      if (!data.active) {
        setAppliedCoupon(null);
        setCouponMessage('Cupom inativo');
        return;
      }
      const today = new Date().toISOString().slice(0, 10);
      if (data.valid_until && data.valid_until < today) {
        setAppliedCoupon(null);
        setCouponMessage('Cupom expirado');
        return;
      }
      if (data.max_uses != null && data.current_uses >= data.max_uses) {
        setAppliedCoupon(null);
        setCouponMessage('Cupom esgotado');
        return;
      }
      // Só valida aqui — o uso só é contabilizado no banco quando o pedido é de fato enviado.
      setAppliedCoupon({ code: data.code, discount_type: data.discount_type, discount_value: data.discount_value });
      setCouponMessage('Cupom válido! Será aplicado ao enviar o pedido.');
    } catch (e) {
      console.error('Erro ao validar cupom:', e);
      setAppliedCoupon(null);
      setCouponMessage('Erro ao validar cupom. Tente novamente.');
    } finally {
      setCouponLoading(false);
    }
  };

  const removeCoupon = () => {
    setAppliedCoupon(null);
    setCouponCode('');
    setCouponMessage('');
  };

  const discountAmount = appliedCoupon
    ? (appliedCoupon.discount_type === 'percent'
        ? subtotal * (Number(appliedCoupon.discount_value) / 100)
        : Math.min(subtotal, Number(appliedCoupon.discount_value)))
    : 0;
  const total = Math.max(0, subtotal - discountAmount);

  const openLightbox = (photos, index, sourceKey) => {
    const apply = () => setLightbox({ photos, index, sourceKey });
    if (document.startViewTransition) document.startViewTransition(() => flushSync(apply));
    else apply();
  };
  const closeLightbox = () => {
    const apply = () => setLightbox(null);
    if (document.startViewTransition) document.startViewTransition(() => flushSync(apply));
    else apply();
  };
  const navLightbox = (delta) => {
    const apply = () => setLightbox(lb => lb ? { ...lb, index: (lb.index + delta + lb.photos.length) % lb.photos.length } : lb);
    if (document.startViewTransition) document.startViewTransition(() => flushSync(apply));
    else apply();
  };

  const buildMessage = () => {
    const storeName = (catalog && catalog.store_name) || 'Loja';
    const lines = [];
    lines.push(`Novo pedido - ${storeName}`);
    if (clientName.trim()) lines.push(`Cliente: ${clientName.trim()}`);
    lines.push('');
    cart.forEach(item => {
      lines.push(`${item.qty}x ${item.name} (${variantLabel(item.color, item.size)}) - ${formatBRL(item.price)} un. = ${formatBRL(item.price * item.qty)}`);
    });
    lines.push('');
    lines.push(`Subtotal: ${formatBRL(subtotal)}`);
    if (appliedCoupon) {
      const discountLabel = appliedCoupon.discount_type === 'percent' ? `${appliedCoupon.discount_value}%` : formatBRL(appliedCoupon.discount_value);
      lines.push(`Cupom ${appliedCoupon.code} (-${discountLabel}): -${formatBRL(discountAmount)}`);
    }
    lines.push(`Total: ${formatBRL(total)}`);
    const paymentLabel = (PAYMENT_METHODS.find(p => p.value === payment) || {}).label || payment;
    lines.push(`Forma de pagamento: ${paymentLabel}`);
    return lines.join('\n');
  };

  const sendOrder = async () => {
    if (cart.length === 0 || !catalog || !catalog.whatsapp_number || sendingOrder) return;
    setSendingOrder(true);
    try {
      if (appliedCoupon) {
        // Só aqui, no exato momento do envio, o uso do cupom é de fato contabilizado no banco.
        const { data, error } = await sb.rpc('redeem_coupon', { p_code: appliedCoupon.code });
        if (error) throw error;
        const result = Array.isArray(data) ? data[0] : data;
        if (!result || !result.success) {
          setCouponMessage((result && result.message) || 'Cupom não pôde ser aplicado. Revise antes de enviar.');
          setAppliedCoupon(null);
          return;
        }
      }
      const msg = encodeURIComponent(buildMessage());
      const phone = catalog.whatsapp_number.replace(/\D/g, '');
      window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
    } catch (e) {
      console.error('Erro ao enviar pedido:', e);
      setCouponMessage('Erro ao processar o pedido. Tente novamente.');
    } finally {
      setSendingOrder(false);
    }
  };

  if (catalog === undefined) {
    return (
      <div className="min-h-screen bg-[#F7F2E8] flex items-center justify-center f-body">
        <Fonts />
        <span className="eyebrow">carregando catálogo</span>
      </div>
    );
  }

  if (!catalog || !catalog.products || catalog.products.length === 0) {
    return (
      <div className="min-h-screen bg-[#F7F2E8] flex items-center justify-center f-body text-sm px-4 text-center">
        <Fonts />
        <span className="text-[#9A9081]">Catálogo ainda não publicado ou sem produtos disponíveis no momento.</span>
      </div>
    );
  }

  const categories = [...new Set(catalog.products.map(p => p.category).filter(Boolean))];
  const filteredProducts = catalog.products.filter(p => {
    const matchesCategory = !activeCategory || p.category === activeCategory;
    const q = search.trim().toLowerCase();
    const matchesSearch = !q || p.name.toLowerCase().includes(q) || (p.variants || []).some(v => String(v.color).toLowerCase().includes(q));
    return matchesCategory && matchesSearch;
  });

  return (
    <div className="min-h-screen f-body pb-40" style={{ backgroundColor: '#F7F2E8' }}>
      <Fonts />

      {showWelcome && <WelcomeBanner storeName={catalog.store_name} logoUrl={catalog.logo_url} welcomeMessage={catalog.welcome_message} onClose={closeWelcome} />}

      <div className="max-w-6xl mx-auto px-6 pt-10 pb-8">
        {(catalog.logo_url || BRAND_LOGO_LIGHT) ? (
          <img src={catalog.logo_url || BRAND_LOGO_LIGHT} alt={catalog.store_name || BRAND_NAME} className="h-16 sm:h-20 w-auto mb-8" />
        ) : (
          <div className="f-display font-bold mb-9" style={{ fontSize: '28px', color: '#1E1D1A' }}>{catalog.store_name || 'Catálogo'}</div>
        )}

        <div className="flex items-center gap-2 mb-4">
          <span style={{ width: '5px', height: '5px', borderRadius: '50%', background: '#C89A3D', display: 'inline-block' }}></span>
          <span className="eyebrow">catálogo digital</span>
        </div>
        <h1 className="f-display font-bold leading-[1.15]" style={{ fontSize: 'clamp(28px, 5vw, 42px)', color: '#1E1D1A' }}>
          Mais vida<br /><span style={{ color: '#7A4B2A', fontStyle: 'italic' }}>em cada aroma.</span>
        </h1>
        <p className="f-body text-[14px] text-[#6E6558] mt-4 max-w-md leading-relaxed">
          Navegue por todas as velas e aromas da loja — fotos, aromas e tamanhos de cada produto, tudo em um só lugar.
        </p>

        {catalog.tagline && (
          <div
            className="relative w-full flex items-center justify-center overflow-hidden mt-8"
            style={{ height: '52px', backgroundColor: '#EFE6D2', borderTop: '1px solid #C89A3D', borderBottom: '1px solid #C89A3D' }}
          >
            {(catalog.logo_url || BRAND_LOGO_LIGHT) ? (
              <img
                src={catalog.logo_url || BRAND_LOGO_LIGHT} alt={catalog.store_name || BRAND_NAME}
                className="brand-fade absolute"
                style={{ height: '36px', width: 'auto' }}
              />
            ) : (
              <span className="brand-fade absolute f-display font-bold" style={{ fontSize: '18px', color: '#1E1D1A' }}>{catalog.store_name || ''}</span>
            )}
            <span
              className="slogan-fade absolute f-display font-bold text-center px-6"
              style={{ color: '#314A3A', fontStyle: 'italic', fontSize: 'clamp(17px, 3.4vw, 23px)' }}
            >{catalog.tagline}</span>
          </div>
        )}

        <div className="flex flex-wrap items-center gap-2.5 mt-7">
          <input
            className="search-input flex-1 min-w-[180px]"
            placeholder="Buscar vela ou aroma..."
            value={search}
            onChange={e => setSearch(e.target.value)}
          />
          <button onClick={() => setActiveCategory(null)} className={`pill ${!activeCategory ? 'selected' : ''}`}>Todas</button>
          {categories.map(c => (
            <button key={c} onClick={() => setActiveCategory(c)} className={`pill ${activeCategory === c ? 'selected' : ''}`}>{c}</button>
          ))}
        </div>
      </div>

      <div className="border-t border-[#E4D9C4]" />

      <main className="max-w-6xl mx-auto px-6 py-10">
        {filteredProducts.length === 0 ? (
          <div className="text-center text-[#6E6558] text-sm py-16">Nenhum produto encontrado.</div>
        ) : (
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-16">
            {filteredProducts.map((p) => (
              <LookCard
                key={p.id} product={p} onAddToCart={addToCart} onOpenLightbox={openLightbox}
                activeSourceKey={lightbox ? lightbox.sourceKey : null}
              />
            ))}
          </div>
        )}
      </main>

      <Lightbox
        photos={lightbox ? lightbox.photos : []}
        index={lightbox ? lightbox.index : null}
        onClose={closeLightbox}
        onNav={navLightbox}
      />

      {cart.length > 0 && cartCollapsed && (
        <button
          onClick={() => setCartCollapsed(false)}
          className="fixed bottom-5 right-5 z-20 flex items-center gap-2 shadow-lg"
          style={{ backgroundColor: '#314A3A', color: '#fff', borderRadius: '999px', padding: '12px 18px', border: 'none' }}
        >
          <span className="f-body text-[13px] font-medium">Sacola</span>
          <span
            className="fw-mono"
            style={{ backgroundColor: '#e11d2e', color: '#fff', borderRadius: '999px', minWidth: '20px', height: '20px', fontSize: '11px', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', padding: '0 5px', fontWeight: 700 }}
          >{itemCount}</span>
          <span style={{ fontSize: '14px' }}>▲</span>
        </button>
      )}

      {cart.length > 0 && !cartCollapsed && (
        <div className="cart-drawer fixed bottom-0 left-0 right-0 z-20 border-t border-[#E4D9C4]" style={{ backgroundColor: 'rgba(255,255,255,0.97)', backdropFilter: 'blur(8px)', position: 'fixed' }}>
          <button
            onClick={() => setCartCollapsed(true)}
            aria-label="Recolher sacola"
            className="absolute flex items-center justify-center gap-1.5 hover:brightness-110 transition-all"
            style={{
              top: '-34px', right: '24px', width: '84px', height: '34px',
              backgroundColor: '#314A3A', color: '#fff', border: 'none', cursor: 'pointer',
              borderRadius: '10px 10px 0 0', boxShadow: '0 -3px 8px rgba(0,0,0,0.12)',
            }}
          >
            <span className="f-body text-[12px] font-medium">Recolher</span>
            <span style={{ fontSize: '13px' }}>▼</span>
          </button>
          <div className="max-w-6xl mx-auto p-5 sm:p-6">
            <div className="eyebrow mb-3">sacola · {itemCount} {itemCount === 1 ? 'item' : 'itens'}</div>
            <div className="max-h-28 overflow-y-auto mb-4 space-y-1.5">
              {cart.map((item, idx) => (
                <div key={idx} className="flex items-center justify-between text-[13px] text-[#6E6558]">
                  <span className="f-body">{item.qty}x {item.name} <span className="text-[#6E6558]">({variantLabel(item.color, item.size)})</span></span>
                  <span className="flex items-center gap-3">
                    <span className="f-mono">{formatBRL(item.price * item.qty)}</span>
                    <button onClick={() => removeFromCart(idx)} className="text-[#6E6558] hover:text-[#1E1D1A] transition-colors">✕</button>
                  </span>
                </div>
              ))}
            </div>

            <div className="flex items-center gap-2 mb-3">
              {appliedCoupon ? (
                <div className="flex items-center justify-between w-full bg-[#EFE6D2] border border-[#E4D9C4] px-3 py-2">
                  <span className="f-body text-[13px] text-[#6E6558]">
                    Cupom <strong className="fw-mono">{appliedCoupon.code}</strong> aplicado
                    ({appliedCoupon.discount_type === 'percent' ? `${appliedCoupon.discount_value}%` : formatBRL(appliedCoupon.discount_value)} off)
                  </span>
                  <button onClick={removeCoupon} className="text-[#6E6558] hover:text-[#1E1D1A] transition-colors text-[13px] underline">remover</button>
                </div>
              ) : (
                <>
                  <input
                    className="fw-input flex-1" placeholder="Código do cupom (opcional)"
                    value={couponCode} onChange={e => setCouponCode(e.target.value.toUpperCase().replace(/\s+/g, ''))}
                    style={{ textTransform: 'uppercase' }}
                  />
                  <button onClick={applyCoupon} disabled={couponLoading || !couponCode.trim()} className="fw-btn-ghost" style={{ borderColor: '#314A3A', color: '#314A3A' }}>
                    {couponLoading ? 'Validando...' : 'Aplicar'}
                  </button>
                </>
              )}
            </div>
            {couponMessage && !appliedCoupon && (
              <div className="text-[12px] text-[#6E6558] mb-3">{couponMessage}</div>
            )}

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
              <input className="fw-input" placeholder="Seu nome (opcional)" value={clientName} onChange={e => setClientName(e.target.value)} />
              <select className="fw-input" value={payment} onChange={e => setPayment(e.target.value)}>
                {PAYMENT_METHODS.map(p => <option key={p.value} value={p.value}>{p.label}</option>)}
              </select>
              <div className="text-right">
                {appliedCoupon && (
                  <div className="f-body text-[12px] text-[#9A9081] line-through">{formatBRL(subtotal)}</div>
                )}
                <div className="f-mono text-lg" style={{ color: '#1E1D1A' }}>
                  {formatBRL(total)}
                </div>
              </div>
            </div>
            <button onClick={sendOrder} disabled={sendingOrder} className="btn-primary w-full">
              {sendingOrder ? 'Enviando...' : 'Enviar pedido pelo WhatsApp'}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
