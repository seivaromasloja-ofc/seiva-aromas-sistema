      .pill { font-family: 'Montserrat', sans-serif; font-size: 12.5px; font-weight: 500; padding: 9px 16px; border-radius: 999px; border: 1px solid #E4D9C4; color: #6E6558; background: #FFFCF6; white-space: nowrap; transition: all .15s ease; }
      .pill.selected { background: #314A3A; color: #FFFCF6; border-color: #314A3A; font-weight: 600; }
      .pill:hover:not(.selected) { border-color: #314A3A; color: #314A3A; }

      /* cards */
      .product-card { animation: fadeUp .6s cubic-bezier(0.16,1,0.3,1) both; }
      .product-photo { aspect-ratio: 4 / 5; overflow: hidden; border-radius: 6px; background: #EFE6D2; }
      .product-photo img { transition: transform 1.1s cubic-bezier(0.16,1,0.3,1); }
      @media (hover: hover) { .product-card:hover .product-photo img { transform: scale(1.04); } }
      .fav-btn { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 999px; background: rgba(255,252,246,0.92); display: flex; align-items: center; justify-content: center; }
      .sold-tag { position: absolute; left: 8px; bottom: 8px; background: #1E1D1A; color: #F7F2E8; font-family: 'Montserrat', sans-serif; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; padding: 5px 9px; border-radius: 3px; }
      .product-name { font-size: 19px; font-weight: 600; color: #1E1D1A; line-height: 1.12; text-transform: uppercase; letter-spacing: 0.03em; }
      @media (min-width: 640px) { .product-name { font-size: 21px; } }
      .price { font-size: 15px; font-weight: 600; color: #1E1D1A; }
      .btn-card { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; border-radius: 4px; border: 1px solid #314A3A; color: #314A3A; background: transparent; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; transition: all .15s ease; }
      .btn-card:hover:not(:disabled), .btn-card:active:not(:disabled) { background: #314A3A; color: #FFFCF6; }
      .btn-card:disabled { border-color: #E4D9C4; color: #9A9081; }

      /* página do produto */
      .product-sheet { background: #F7F2E8; height: 100%; animation: sheetIn .3s cubic-bezier(0.16,1,0.3,1) backwards; }
      @media (min-width: 768px) { .product-sheet { height: auto; max-height: 92vh; } }
      @keyframes sheetIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
      .sheet-bar { height: calc(56px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top); background: rgba(247,242,232,0.95); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
      .main-photo { aspect-ratio: 1 / 1; background: #EFE6D2; overflow: hidden; cursor: zoom-in; }
      @media (min-width: 768px) { .main-photo { border-radius: 8px; aspect-ratio: 4 / 5; } }
      .thumb { width: 64px; height: 64px; border-radius: 6px; overflow: hidden; background: #EFE6D2; outline-offset: 2px; }
      .pp-name { font-size: clamp(30px, 8vw, 36px); font-weight: 600; color: #1E1D1A; text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.05; }
      .pp-price { font-size: 24px; font-weight: 600; color: #1E1D1A; }
      .opt-pill { font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 500; padding: 10px 16px; min-height: 42px; border-radius: 999px; border: 1px solid #E4D9C4; color: #3B3A35; background: #FFFCF6; }
      .opt-pill.selected { background: #314A3A; color: #FFFCF6; border-color: #314A3A; }
      .opt-pill:disabled { opacity: .4; text-decoration: line-through; }
      .stepper { display: inline-flex; align-items: center; border: 1px solid #E4D9C4; border-radius: 4px; background: #FFFCF6; height: 48px; }
      .stepper button { width: 42px; height: 100%; font-size: 18px; color: #314A3A; }
      .stepper span { min-width: 26px; text-align: center; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 14px; color: #1E1D1A; }
      .stepper-sm { height: 34px; } .stepper-sm button { width: 32px; font-size: 16px; }
      .facts { border-left: 1px solid #E4D9C4; }
      @media (max-width: 767px) { .facts { border-left: none; border-top: 1px solid #E4D9C4; padding-top: 6px; } }
      .fact { display: flex; gap: 14px; padding: 12px 0 12px 16px; border-bottom: 1px dashed #E4D9C4; }
      @media (max-width: 767px) { .fact { padding-left: 0; } }
      .fact:last-child { border-bottom: none; }
      .fact-icon { color: #9C6F2B; flex-shrink: 0; margin-top: 2px; }
      .fact-title { font-size: 18px; font-weight: 600; color: #1E1D1A; line-height: 1.2; }
      .int-dot { width: 12px; height: 12px; border-radius: 999px; border: 1.5px solid #7A4B2A; display: inline-block; }
      .warn { display: flex; gap: 10px; align-items: center; background: #EFE6D2; border: 1px solid #E4D9C4; border-radius: 6px; padding: 12px 14px; color: #5E3A1F; font-family: 'Montserrat', sans-serif; font-size: 13px; }
      .buy-bar .btn-primary { font-size: 12px; letter-spacing: 0.05em; }
      .buy-bar { background: rgba(247,242,232,0.97); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid #E4D9C4; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }

      .btn-primary { background: #314A3A; color: #FFFCF6; font-weight: 600; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; padding: 14px 18px; min-height: 48px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; transition: background .2s ease; font-family: 'Montserrat', sans-serif; }
      .btn-primary:hover:not(:disabled) { background: #24382B; }
      .btn-primary:disabled { opacity: .45; }

      /* história e cuidados */
      .story { background: #EFE6D2; border-top: 1px solid #E4D9C4; border-bottom: 1px solid #E4D9C4; }
      .essence-tag { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 600; color: #314A3A; border: 1px solid #C89A3D; border-radius: 999px; padding: 6px 16px; background: #F7F2E8; }
      .care-card { display: flex; gap: 14px; background: #FFFCF6; border: 1px solid #E4D9C4; border-radius: 6px; padding: 18px; }
      .care-icon { color: #9C6F2B; flex-shrink: 0; margin-top: 3px; }

      /* sacola */
      .bag-fab { bottom: calc(14px + env(safe-area-inset-bottom)); background: #314A3A; color: #FFFCF6; border-radius: 6px; padding: 15px 18px; box-shadow: 0 10px 30px rgba(30,29,26,0.25); animation: fadeUp .35s ease both; }
      .cart-sheet { background: #F7F2E8; border-radius: 16px 16px 0 0; animation: slideUp .3s cubic-bezier(0.16,1,0.3,1) both; max-height: 92vh; display: flex; flex-direction: column; }
      .fw-input { background: #FFFCF6; border: 1px solid #E4D9C4; color: #1E1D1A; padding: 11px 12px; font-size: 14px; outline: none; width: 100%; font-family: 'Montserrat', sans-serif; border-radius: 4px; min-height: 46px; }
      .fw-input:focus { border-color: #314A3A; box-shadow: 0 0 0 3px rgba(200,154,61,0.25); }
      .fw-btn-ghost { background: #FFFCF6; border: 1px solid #E4D9C4; color: #6E6558; padding: 9px 16px; border-radius: 4px; font-size: 13px; font-weight: 600; font-family: 'Montserrat', sans-serif; display: inline-flex; align-items: center; justify-content: center; }
      .fw-btn-ghost:disabled { opacity: .5; }

      .lightbox-icon-btn { width: 44px; height: 44px; border-radius: 999px; border: none; background: rgba(255,252,246,0.92); color: #1E1D1A; display: flex; align-items: center; justify-content: center; line-height: 1; }

      @media (max-width: 639px) {
        .fw-input, .search-input { font-size: 16px !important; }
      }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
      .welcome-card { animation: welcomeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
      @keyframes welcomeIn { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    `}</style>
  );
}

function WelcomeBanner({ storeName, logoUrl, welcomeMessage, onClose }) {
  return (
    <div
      className="fixed inset-0 z-50 flex items-center justify-center px-5"
      style={{ backgroundColor: 'rgba(30,29,26,0.75)', backdropFilter: 'blur(3px)' }}
      onClick={onClose}
    >
      <div
        className="relative w-full max-w-sm welcome-card rounded-2xl"
        style={{ backgroundColor: '#314A3A' }}
        onClick={(e) => e.stopPropagation()}
      >
        <button
          onClick={onClose}
          aria-label="Fechar"
          className="absolute top-4 right-4 text-xl leading-none transition-colors"
          style={{ color: '#6E6558' }}
        >✕</button>
        <div className="px-8 pt-10 pb-9 text-center">
          <img src={BRAND_LOGO_GOLD} alt={BRAND_NAME} className="h-16 w-auto mx-auto mb-6" />
          <h2 className="f-display font-bold leading-tight" style={{ fontSize: '30px', color: '#C89A3D' }}>
            Boas-vindas!
          </h2>
          <p className="f-body text-[14px] leading-relaxed mt-4" style={{ color: '#C9D3C6' }}>
            {welcomeMessage || 'Aproveite nosso catálogo com as últimas novidades.'}
          </p>
          <button onClick={onClose} className="btn-primary w-full mt-8">
            Ver catálogo
          </button>
        </div>
      </div>
    </div>
  );
}

function Lightbox({ photos, index, onClose, onNav }) {
  useEffect(() => {
    if (index === null || index === undefined) return;
    const handleKey = (e) => {
      if (e.key === 'ArrowLeft') onNav(-1);
      else if (e.key === 'ArrowRight') onNav(1);
      else if (e.key === 'Escape') onClose();
    };
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  }, [index, onNav, onClose]);

  if (index === null || index === undefined) return null;
  return (
    <div
      className="fixed inset-0 bg-[#1E1D1A]/95 z-50 flex items-center justify-center px-4"
      onTouchStart={e => { window.__lbX = e.touches[0].clientX; }}
      onTouchEnd={e => { const dx = e.changedTouches[0].clientX - (window.__lbX || 0); if (Math.abs(dx) > 50) onNav(dx < 0 ? 1 : -1); }}
      style={{ backdropFilter: 'blur(2px)' }}
      onClick={onClose}
    >
      <button onClick={onClose} className="lightbox-icon-btn absolute top-6 right-6" style={{ fontSize: '16px' }}>✕</button>
      {photos.length > 1 && (
        <button
          onClick={(e) => { e.stopPropagation(); onNav(-1); }}
          className="lightbox-icon-btn absolute left-3 sm:left-8"
          style={{ fontSize: '20px' }}
        >‹</button>
      )}
      <img
        src={photos[index]}
        alt=""
        onClick={(e) => { e.stopPropagation(); if (photos.length > 1) onNav(1); }}
        className="max-h-[85vh] max-w-full object-contain cursor-pointer"
        style={{ viewTransitionName: 'active-photo' }}
      />
      {photos.length > 1 && (
        <button
          onClick={(e) => { e.stopPropagation(); onNav(1); }}
          className="lightbox-icon-btn absolute right-3 sm:right-8"
          style={{ fontSize: '20px' }}
        >›</button>
      )}
    </div>
  );
}

  'magia da floresta': 'Narrativa, mística e lúdica.',

  'home spray': 'Rústicos, elegantes e em vidro âmbar.',

};

// ---------- Favoritos (ficam só neste aparelho) ----------
function useFavorites() {
  const [favs, setFavs] = useState(() => {
    try { return JSON.parse(localStorage.getItem('seiva_favs') || '[]'); } catch (e) { return []; }
  });
  const toggle = (id) => setFavs(f => {
    const next = f.includes(id) ? f.filter(x => x !== id) : [...f, id];
    try { localStorage.setItem('seiva_favs', JSON.stringify(next)); } catch (e) { /* ignore */ }
    return next;
  });
  return [favs, toggle];
}

function productSizes(product) {
  return [...new Set((product.variants || []).map(v => v.size))].filter(s => s && s !== SINGLE_SIZE);
}
function needsChoice(product) {
  const inStock = (product.variants || []).filter(v => v.inStock);
  return inStock.length > 1;
}

// ---------- Banner principal ----------
function Hero({ slides, onCta }) {
  const [i, setI] = useState(0);
  const n = slides.length;
  useEffect(() => {
    if (n < 2) return;
    const t = setInterval(() => setI(x => (x + 1) % n), 6500);
    return () => clearInterval(t);
  }, [n]);
  const touch = React.useRef(0);
  const slide = slides[i] || null;
  return (
    <section className="hero relative overflow-hidden"
      onTouchStart={e => { touch.current = e.touches[0].clientX; }}
      onTouchEnd={e => { const dx = e.changedTouches[0].clientX - touch.current; if (n > 1 && Math.abs(dx) > 50) setI(x => (x + (dx < 0 ? 1 : -1) + n) % n); }}>
      {slide ? (
        <img key={slide.photo} src={slide.photo} alt={slide.name} className="hero-img absolute inset-0 w-full h-full object-cover" />
      ) : (
        <div className="absolute inset-0 hero-fallback">
          <img src={BRAND_TREE} alt="" aria-hidden="true" className="hero-tree" />
        </div>
      )}
      <div className="hero-veil absolute inset-0" />
      <div className="relative max-w-6xl mx-auto px-5 sm:px-10 h-full flex items-center">
        <div className="hero-copy text-center md:text-left">
          <div className="flex items-center justify-center md:justify-start gap-2 mb-3"><Star8 size={12} /><span className="eyebrow">velas e aromas artesanais</span></div>
          <h1 className="f-display hero-title">
            <span className="block hero-t1">Acenda um caminho</span>
            <span className="block hero-t2">para a magia</span>
          </h1>
          <p className="f-body hero-sub">Velas e aromas artesanais que transformam pequenos momentos.</p>
          <button onClick={onCta} className="btn-cta mt-6">Conheça a coleção</button>
        </div>
      </div>
      {n > 1 && (
        <>
          <button className="hero-arrow left-3 sm:left-5 hidden sm:flex" onClick={() => setI((i - 1 + n) % n)} aria-label="Anterior"><IconChevronL size={22} /></button>
          <button className="hero-arrow right-3 sm:right-5 hidden sm:flex" onClick={() => setI((i + 1) % n)} aria-label="Próximo"><IconChevronR size={22} /></button>
          <div className="absolute bottom-4 left-0 right-0 flex justify-center gap-2">
            {slides.map((_, k) => <button key={k} onClick={() => setI(k)} aria-label={`Slide ${k + 1}`} className="hero-dot" style={{ background: k === i ? '#314A3A' : 'rgba(49,74,58,0.25)', width: k === i ? '22px' : '8px' }} />)}
          </div>
        </>
      )}
    </section>
  );
}

// ---------- Card de produto ----------
function ProductCard({ product, isFav, onToggleFav, onOpen, onQuickAdd }) {
  const photos = product.photos || [];
  const variants = product.variants || [];
  const out = variants.length > 0 && variants.every(v => !v.inStock);
  const sizes = productSizes(product);
  const choose = needsChoice(product);
  return (
    <article className="product-card flex flex-col">
      <div className="product-photo relative cursor-pointer" onClick={onOpen}>
        {photos[0] ? (
          <img src={photos[0]} alt={product.name} loading="lazy" className="w-full h-full object-cover" style={out ? { filter: 'grayscale(1)', opacity: 0.5 } : {}} />
        ) : (
          <div className="w-full h-full flex items-center justify-center" style={{ color: '#C89A3D' }}><IconLeaf size={30} /></div>
        )}
        {out && <span className="sold-tag">Esgotado</span>}
        <button className="fav-btn" onClick={e => { e.stopPropagation(); onToggleFav(); }} aria-label={isFav ? 'Remover dos favoritos' : 'Adicionar aos favoritos'} style={{ color: isFav ? '#7A4B2A' : '#6E6558' }}>
          <IconHeart size={18} filled={isFav} />
        </button>
      </div>
      <div className="pt-3 flex flex-col flex-1">
        {product.category && <div className="eyebrow mb-1 truncate">{product.category}</div>}
        <button onClick={onOpen} className="text-left">
          <h3 className="f-display product-name">{product.name}</h3>
        </button>
        {(product.aromaNotes || product.subtitle) && <div className="f-display italic text-[15px] leading-tight" style={{ color: '#7A4B2A' }}>{product.aromaNotes || product.subtitle}</div>}
        {sizes.length > 0 && <div className="f-body text-[11px] mt-1" style={{ color: '#9A9081' }}>{sizes.join(' · ')}</div>}
        <div className="mt-auto pt-3 flex items-center justify-between gap-2">
          <span className="f-body price">{formatBRL(product.price)}</span>
        </div>
        <button onClick={choose || out ? onOpen : onQuickAdd} disabled={out} className="btn-card mt-2.5">
          {out ? 'Esgotado' : choose ? 'Escolher' : <><IconBag size={16} /> Adicionar</>}
        </button>
      </div>
    </article>
  );
}

// ---------- Página do produto ----------
function ProductPage({ product, isFav, onToggleFav, onClose, onAddToCart, onOpenLightbox }) {
  const photos = product.photos || [];
  const variants = product.variants || [];
  const allOut = variants.length > 0 && variants.every(v => !v.inStock);
  const aromas = [...new Set(variants.map(v => v.color))];
  const inStockAromas = new Set(variants.filter(v => v.inStock).map(v => v.color));
  const [photoIdx, setPhotoIdx] = useState(0);
  const [aroma, setAroma] = useState(() => (variants.find(v => v.inStock) || {}).color || null);
  const sizesFor = (a) => variants.filter(v => v.color === a);
  const autoSize = (a) => { const s = sizesFor(a).filter(v => v.inStock); return s.length === 1 ? s[0].size : null; };
  const [size, setSize] = useState(() => autoSize((variants.find(v => v.inStock) || {}).color));
  const [qty, setQty] = useState(1);
  const [added, setAdded] = useState(false);
  const [shared, setShared] = useState(false);
  const touch = React.useRef(0);
  const sizeOptions = aroma ? sizesFor(aroma) : [];
  const showSizes = sizeOptions.length > 0 && !(sizeOptions.length === 1 && sizeOptions[0].size === SINGLE_SIZE);
  const canAdd = !allOut && aroma && size;

  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => { document.body.style.overflow = prev; window.removeEventListener('keydown', onKey); };
  }, []);

  const add = () => {
    if (!canAdd) return;
    onAddToCart({ productId: product.id, name: product.name, color: aroma, size, price: product.price, qty });
    setAdded(true); setQty(1);
    setTimeout(() => setAdded(false), 1800);
  };
  const share = async () => {
    const url = location.href.split('#')[0] + '#produto=' + encodeURIComponent(product.id);
    const text = `${product.name} — ${BRAND_NAME}`;
    try {
      if (navigator.share) { await navigator.share({ title: text, text, url }); return; }
      await navigator.clipboard.writeText(url);
      setShared(true); setTimeout(() => setShared(false), 1800);
    } catch (e) { /* cancelado */ }
  };
  const label = !aroma ? 'Escolha o aroma' : !size ? 'Escolha o tamanho' : added ? 'Adicionado ✓' : 'Adicionar à sacola';
  const sizeText = productSizes(product).join(' · ');
  const facts = [
    product.family && { icon: <IconFlower size={22} />, title: 'Família olfativa', body: product.family },
    product.intensity > 0 && { icon: <IconSprig size={22} />, title: 'Intensidade', body: <span className="flex gap-1 mt-1" aria-label={`${product.intensity} de 5`}>{[1, 2, 3, 4, 5].map(k => <span key={k} className="int-dot" style={{ background: k <= product.intensity ? '#7A4B2A' : 'transparent' }} />)}</span> },
    product.burnTime && { icon: <IconClock size={22} />, title: 'Tempo de queima', body: product.burnTime },
    product.usage && { icon: <IconHand size={22} />, title: 'Modo de uso', body: product.usage },
    product.story && { icon: <IconLeaf size={22} />, title: 'História da vela', body: product.story },
    product.description && { icon: <IconSprig size={22} />, title: 'Composição', body: product.description },
    product.notes && { icon: <IconLeaf size={22} />, title: 'Observações', body: product.notes },
  ].filter(Boolean);

  return (
    <div className="fixed inset-0 z-40 flex md:items-center md:justify-center" role="dialog" aria-modal="true" aria-label={product.name}>
      <div className="absolute inset-0 hidden md:block" style={{ background: 'rgba(30,29,26,0.55)' }} onClick={onClose} />
      <div className="product-sheet relative w-full md:max-w-5xl md:mx-6 md:rounded-2xl overflow-y-auto">
        {/* barra superior */}
        <div className="sheet-bar sticky top-0 z-10 flex items-center justify-between px-2 md:px-4">
          <button className="icon-btn" onClick={onClose} aria-label="Voltar"><IconChevronL size={24} /></button>
          <img src={BRAND_LOGO_LIGHT} alt={BRAND_NAME} className="h-8 w-auto md:hidden" />
          <div className="flex items-center">
            <button className="icon-btn" onClick={share} aria-label="Compartilhar"><IconShare size={20} /></button>
            <button className="icon-btn" onClick={onToggleFav} aria-label="Favoritar" style={{ color: isFav ? '#7A4B2A' : undefined }}><IconHeart size={21} filled={isFav} /></button>
            <span className="hidden md:inline-flex"><button className="icon-btn" onClick={onClose} aria-label="Fechar"><IconX size={22} /></button></span>
          </div>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-[1.05fr_1fr] lg:grid-cols-[1fr_0.9fr_0.9fr] gap-0 md:gap-6 md:px-6 md:pb-8">
          {/* galeria */}
          <div className="md:flex md:gap-3">
            {photos.length > 1 && (
              <div className="hidden md:flex flex-col gap-2 w-16 shrink-0">
                {photos.map((ph, k) => (
                  <button key={k} onClick={() => setPhotoIdx(k)} className="thumb" style={{ outline: k === photoIdx ? '2px solid #C89A3D' : 'none' }}><img src={ph} alt="" className="w-full h-full object-cover" /></button>
                ))}
              </div>
            )}
            <div className="flex-1">
              <div className="main-photo relative"
                onTouchStart={e => { touch.current = e.touches[0].clientX; }}
                onTouchEnd={e => { const dx = e.changedTouches[0].clientX - touch.current; if (photos.length > 1 && Math.abs(dx) > 40) setPhotoIdx(x => (x + (dx < 0 ? 1 : -1) + photos.length) % photos.length); }}
                onClick={() => photos.length && onOpenLightbox(photos, photoIdx, `${product.id}-${photoIdx}`)}>
                {photos[photoIdx] ? <img src={photos[photoIdx]} alt={product.name} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center" style={{ color: '#C89A3D' }}><IconLeaf size={40} /></div>}
                {photos.length > 1 && (
                  <div className="md:hidden absolute bottom-3 left-0 right-0 flex justify-center gap-1.5">
                    {photos.map((_, k) => <span key={k} className="rounded-full" style={{ width: k === photoIdx ? '18px' : '6px', height: '6px', background: k === photoIdx ? '#FFFCF6' : 'rgba(255,252,246,0.6)', transition: 'width .2s' }} />)}
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* compra */}
          <div className="px-5 md:px-0 pt-5 md:pt-2">
            {product.category && <div className="eyebrow mb-2">{product.category}</div>}
            <h2 className="f-display pp-name">{product.name}</h2>
            {product.subtitle && <div className="f-display italic text-[19px]" style={{ color: '#1E1D1A' }}>{product.subtitle}</div>}
            {product.aromaNotes && <div className="f-display italic text-[17px] mt-2" style={{ color: '#7A4B2A' }}>{product.aromaNotes}</div>}
            {sizeText && <div className="f-body text-[13px] mt-0.5" style={{ color: '#6E6558' }}>{sizeText}</div>}
            <div className="f-body pp-price mt-3">{formatBRL(product.price)}</div>
            {product.phrase && <p className="f-display italic text-[17px] mt-2" style={{ color: '#314A3A' }}>{product.phrase}</p>}

            {aromas.length > 0 && (
              <div className="mt-5">
                <div className="eyebrow mb-2" style={{ color: '#6E6558' }}>Aroma</div>
                <div className="flex flex-wrap gap-2">
                  {aromas.map(a => (
                    <button key={a} disabled={!inStockAromas.has(a)} onClick={() => { setAroma(a); setSize(autoSize(a)); }} className={`opt-pill ${aroma === a ? 'selected' : ''}`}>{a}</button>
                  ))}
                </div>
              </div>
            )}
            {showSizes && (
              <div className="mt-4">
                <div className="eyebrow mb-2" style={{ color: '#6E6558' }}>Tamanho</div>
                <div className="flex flex-wrap gap-2">
                  {sizeOptions.map(v => <button key={v.size} disabled={!v.inStock} onClick={() => setSize(v.size)} className={`opt-pill ${size === v.size ? 'selected' : ''}`}>{v.size}</button>)}
                </div>
              </div>
            )}

            <div className="hidden md:flex items-center gap-3 mt-5">
              <div className="stepper"><button onClick={() => setQty(q => Math.max(1, q - 1))} aria-label="Diminuir">−</button><span>{qty}</span><button onClick={() => setQty(q => q + 1)} aria-label="Aumentar">+</button></div>
            </div>
            <button onClick={add} disabled={!canAdd} className="btn-primary w-full mt-3 hidden md:flex"><IconBag size={18} />{allOut ? 'Esgotado' : label}</button>
            <div className="hidden md:flex items-center gap-5 mt-4 f-body text-[12px]" style={{ color: '#6E6558' }}>
              <button onClick={onToggleFav} className="flex items-center gap-1.5"><IconHeart size={17} filled={isFav} /> {isFav ? 'Nos favoritos' : 'Adicionar aos favoritos'}</button>
              <button onClick={share} className="flex items-center gap-1.5"><IconShare size={16} /> {shared ? 'Link copiado' : 'Compartilhar'}</button>
            </div>
          </div>

          {/* ficha */}
          <div className="px-5 md:px-0 pt-6 md:pt-2 pb-36 md:pb-0 md:col-span-2 lg:col-span-1">
            {facts.length > 0 && (
              <div className="facts">
                {facts.map((f, k) => (
                  <div key={k} className="fact">
                    <span className="fact-icon">{f.icon}</span>
                    <div className="min-w-0">
                      <div className="f-display fact-title">{f.title}</div>
                      <div className="f-body text-[13px] leading-relaxed" style={{ color: '#6E6558' }}>{f.body}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
            {product.warning && (
              <div className="warn mt-4"><IconAlert size={18} /><span>{product.warning}</span></div>
            )}
          </div>
        </div>

      </div>
      {/* barra de compra fixa (celular) */}
        <div className="buy-bar md:hidden fixed bottom-0 left-0 right-0 z-20 px-4 pt-3 flex items-center gap-3">
          <div className="stepper"><button onClick={() => setQty(q => Math.max(1, q - 1))} aria-label="Diminuir">−</button><span>{qty}</span><button onClick={() => setQty(q => q + 1)} aria-label="Aumentar">+</button></div>
          <button onClick={add} disabled={!canAdd} className="btn-primary flex-1"><IconBag size={18} />{allOut ? 'Esgotado' : label}</button>
        </div>
    </div>
  );
}

// ---------- Rodapé ----------
function SiteFooter({ whatsapp }) {
  return (
    <footer style={{ background: '#314A3A', color: '#E9E1CF' }}>
      <div className="max-w-6xl mx-auto px-6 py-12 text-center">
        <img src={BRAND_LOGO_GOLD} alt={BRAND_NAME} className="h-16 w-auto mx-auto" />
        <p className="f-display italic text-[22px] mt-5" style={{ color: '#C89A3D' }}>Mais vida em cada aroma.</p>
        <p className="f-body text-[11px] tracking-[0.3em] uppercase mt-3" style={{ color: '#C9D3C6' }}>Pequenos rituais · grandes transformações</p>
        {whatsapp && (
          <a href={`https://wa.me/${String(whatsapp).replace(/\D/g, '')}`} target="_blank" rel="noopener" className="btn-cta-gold mt-7 inline-flex"><IconWhats size={18} /> Fale com a gente</a>
        )}
      </div>
      <div className="text-center f-body text-[11px] py-4" style={{ borderTop: '1px solid rgba(255,255,255,0.1)', color: '#9FB0A2', paddingBottom: 'calc(16px + env(safe-area-inset-bottom))' }}>
        © {new Date().getFullYear()} {BRAND_NAME}
      </div>
    </footer>
  );
}

function App() {
  const [catalog, setCatalog] = useState(undefined);
  const [cart, setCart] = useState([]);
  const [payment, setPayment] = useState('pix');
  const [clientName, setClientName] = useState('');
  const [lightbox, setLightbox] = useState(null);
  const [cartCollapsed, setCartCollapsed] = useState(true);
  const [search, setSearch] = useState('');
  const [activeCategory, setActiveCategory] = useState(null);
  const [showWelcome, setShowWelcome] = useState(() => {
    try { return sessionStorage.getItem('seiva_welcome_seen') !== '1'; } catch (e) { return true; }
  });
  const closeWelcome = () => {
    setShowWelcome(false);
    try { sessionStorage.setItem('seiva_welcome_seen', '1'); } catch (e) { /* ignore */ }
  };

  useEffect(() => {
    (async () => {
      try {
        const { data, error } = await sb.from('catalog_public').select('*').eq('user_id', SHARED_STORE_ID).maybeSingle();
        if (error) throw error;
        setCatalog(data || null);
      } catch (e) {
        console.error('Erro ao carregar catálogo:', e);
        setCatalog(null);
      }
    })();
  }, []);

  const addToCart = (item) => {
    setCart(c => {
      const existing = c.find(i => i.productId === item.productId && i.color === item.color && i.size === item.size);
      if (existing) return c.map(i => i === existing ? { ...i, qty: i.qty + item.qty } : i);
      return [...c, item];
    });
  };

  const removeFromCart = (idx) => setCart(c => c.filter((_, i) => i !== idx));
  const changeQty = (idx, d) => setCart(c => c.map((it, i) => i === idx ? { ...it, qty: it.qty + d } : it).filter(it => it.qty > 0));
  const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const itemCount = cart.reduce((s, i) => s + i.qty, 0);

  const [couponCode, setCouponCode] = useState('');
  const [appliedCoupon, setAppliedCoupon] = useState(null); // { code, discount_type, discount_value }
  const [couponMessage, setCouponMessage] = useState('');
  const [couponLoading, setCouponLoading] = useState(false);
  const [sendingOrder, setSendingOrder] = useState(false);

  const applyCoupon = async () => {
    if (!couponCode.trim()) return;
    setCouponLoading(true);
    setCouponMessage('');
    try {
      const { data, error } = await sb.from('coupons').select('*').ilike('code', couponCode.trim()).maybeSingle();
      if (error) throw error;
      if (!data) {
        setAppliedCoupon(null);
        setCouponMessage('Cupom não encontrado');
        return;
      }
      if (!data.active) {
        setAppliedCoupon(null);
        setCouponMessage('Cupom inativo');
        return;
      }
      const today = new Date().toISOString().slice(0, 10);
      if (data.valid_until && data.valid_until < today) {
        setAppliedCoupon(null);
        setCouponMessage('Cupom expirado');
        return;
      }
      if (data.max_uses != null && data.current_uses >= data.max_uses) {
        setAppliedCoupon(null);
        setCouponMessage('Cupom esgotado');
        return;
      }
      // Só valida aqui — o uso só é contabilizado no banco quando o pedido é de fato enviado.
      setAppliedCoupon({ code: data.code, discount_type: data.discount_type, discount_value: data.discount_value });
      setCouponMessage('Cupom válido! Será aplicado ao enviar o pedido.');
    } catch (e) {
      console.error('Erro ao validar cupom:', e);
      setAppliedCoupon(null);
      setCouponMessage('Erro ao validar cupom. Tente novamente.');
    } finally {
      setCouponLoading(false);
    }
  };

  const removeCoupon = () => {
    setAppliedCoupon(null);
    setCouponCode('');
    setCouponMessage('');
  };

  const discountAmount = appliedCoupon
    ? (appliedCoupon.discount_type === 'percent'
        ? subtotal * (Number(appliedCoupon.discount_value) / 100)
        : Math.min(subtotal, Number(appliedCoupon.discount_value)))
    : 0;
  const total = Math.max(0, subtotal - discountAmount);

  const openLightbox = (photos, index, sourceKey) => {
    const apply = () => setLightbox({ photos, index, sourceKey });
    if (document.startViewTransition) document.startViewTransition(() => flushSync(apply));
    else apply();
  };
  const closeLightbox = () => {
    const apply = () => setLightbox(null);
    if (document.startViewTransition) document.startViewTransition(() => flushSync(apply));
    else apply();
  };
  const navLightbox = (delta) => {
    const apply = () => setLightbox(lb => lb ? { ...lb, index: (lb.index + delta + lb.photos.length) % lb.photos.length } : lb);
    if (document.startViewTransition) document.startViewTransition(() => flushSync(apply));
    else apply();
  };

  const buildMessage = () => {
    const storeName = (catalog && catalog.store_name) || 'Loja';
    const lines = [];
    lines.push(`Novo pedido - ${storeName}`);
    if (clientName.trim()) lines.push(`Cliente: ${clientName.trim()}`);
    lines.push('');
    cart.forEach(item => {
      lines.push(`${item.qty}x ${item.name} (${variantLabel(item.color, item.size)}) - ${formatBRL(item.price)} un. = ${formatBRL(item.price * item.qty)}`);
    });
    lines.push('');
    lines.push(`Subtotal: ${formatBRL(subtotal)}`);
    if (appliedCoupon) {
      const discountLabel = appliedCoupon.discount_type === 'percent' ? `${appliedCoupon.discount_value}%` : formatBRL(appliedCoupon.discount_value);
      lines.push(`Cupom ${appliedCoupon.code} (-${discountLabel}): -${formatBRL(discountAmount)}`);
    }
    lines.push(`Total: ${formatBRL(total)}`);
    const paymentLabel = (PAYMENT_METHODS.find(p => p.value === payment) || {}).label || payment;
    lines.push(`Forma de pagamento: ${paymentLabel}`);
    return lines.join('\n');
  };

  const sendOrder = async () => {
    if (cart.length === 0 || !catalog || !catalog.whatsapp_number || sendingOrder) return;
    setSendingOrder(true);
    try {
      if (appliedCoupon) {
        // Só aqui, no exato momento do envio, o uso do cupom é de fato contabilizado no banco.
        const { data, error } = await sb.rpc('redeem_coupon', { p_code: appliedCoupon.code });
        if (error) throw error;
        const result = Array.isArray(data) ? data[0] : data;
        if (!result || !result.success) {
          setCouponMessage((result && result.message) || 'Cupom não pôde ser aplicado. Revise antes de enviar.');
          setAppliedCoupon(null);
          return;
        }
      }
      const msg = encodeURIComponent(buildMessage());
      const phone = catalog.whatsapp_number.replace(/\D/g, '');
      window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
    } catch (e) {
      console.error('Erro ao enviar pedido:', e);
      setCouponMessage('Erro ao processar o pedido. Tente novamente.');
    } finally {
      setSendingOrder(false);
    }
  };

  // ---------- navegação, favoritos e página de produto ----------
  const [favs, toggleFav] = useFavorites();
  const [menuOpen, setMenuOpen] = useState(false);
  const [showFavs, setShowFavs] = useState(false);
  const readHash = () => { const m = location.hash.match(/produto=([^&]+)/); return m ? decodeURIComponent(m[1]) : null; };
  const [openId, setOpenId] = useState(readHash);
  const openedByClick = React.useRef(false);
  useEffect(() => {
    const onHash = () => setOpenId(readHash());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  const openProduct = (id) => { openedByClick.current = true; location.hash = 'produto=' + encodeURIComponent(id); setOpenId(id); };
  const closeProduct = () => {
    if (openedByClick.current) { openedByClick.current = false; history.back(); }
    else { history.replaceState(null, '', location.pathname + location.search); }
    setOpenId(null);
  };
  const scrollToCatalog = (focusSearch) => {
    const el = document.getElementById('colecao');
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' });
    if (focusSearch) setTimeout(() => { const s = document.getElementById('busca'); if (s) s.focus({ preventScroll: true }); }, 450);
  };
  const goCategory = (c) => { setActiveCategory(c); setShowFavs(false); scrollToCatalog(false); };
  const goHome = () => { setActiveCategory(null); setShowFavs(false); setSearch(''); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const quickAdd = (p) => {
    const v = (p.variants || []).find(x => x.inStock);
    if (!v) return;
    addToCart({ productId: p.id, name: p.name, color: v.color, size: v.size, price: p.price, qty: 1 });
  };

  if (catalog === undefined) {
    return (
      <div className="min-h-screen bg-[#F7F2E8] flex flex-col items-center justify-center gap-4 f-body">
        <Fonts />
        <img src={BRAND_TREE} alt="" className="w-20 h-auto opacity-80" />
        <span className="eyebrow">carregando catálogo</span>
      </div>
    );
  }

  if (!catalog || !catalog.products || catalog.products.length === 0) {
    return (
      <div className="min-h-screen bg-[#F7F2E8] flex flex-col items-center justify-center gap-4 f-body text-sm px-6 text-center">
        <Fonts />
        <img src={BRAND_LOGO_LIGHT} alt={BRAND_NAME} className="h-14 w-auto" />
        <span className="text-[#6E6558]">Catálogo ainda não publicado ou sem produtos disponíveis no momento.</span>
      </div>
    );
  }

  const products = catalog.products;
  const categories = [...new Set(products.map(p => p.category).filter(Boolean))];
  const filteredProducts = products.filter(p => {
    if (showFavs && !favs.includes(p.id)) return false;
    const matchesCategory = !activeCategory || p.category === activeCategory;
    const q = search.trim().toLowerCase();
    const matchesSearch = !q || p.name.toLowerCase().includes(q)
      || (p.variants || []).some(v => String(v.color).toLowerCase().includes(q))
      || String(p.aromaNotes || '').toLowerCase().includes(q) || String(p.family || '').toLowerCase().includes(q);
    return matchesCategory && matchesSearch;
  });
  const withPhoto = products.filter(p => (p.photos || [])[0]);
  const featured = withPhoto.filter(p => p.featured);
  const slides = (featured.length ? featured : withPhoto).slice(0, 4).map(p => ({ photo: p.photos[0], name: p.name }));
  const collectionItems = categories.map(c => ({ name: c, blurb: blurbFor(c), photo: (products.find(p => p.category === c && (p.photos || [])[0]) || {}).photos?.[0] || '' }));
  const openProductData = openId ? products.find(p => p.id === openId) : null;

  return (
    <div className="min-h-screen f-body" style={{ backgroundColor: '#F7F2E8' }}>
      <Fonts />

      {showWelcome && !openProductData && <WelcomeBanner storeName={catalog.store_name} logoUrl={catalog.logo_url} welcomeMessage={catalog.welcome_message} onClose={closeWelcome} />}

      <SiteHeader
        categories={categories} itemCount={itemCount}
        onOpenCart={() => cart.length > 0 && setCartCollapsed(false)}
        onOpenMenu={() => setMenuOpen(true)} onGoCategory={goCategory}
        onSearch={() => scrollToCatalog(true)} onHome={goHome}
      />
      <MobileMenu open={menuOpen} categories={categories} onClose={() => setMenuOpen(false)} onGoCategory={goCategory} onHome={goHome} />

      <Hero slides={slides} onCta={() => scrollToCatalog(false)} />
      <Collections items={collectionItems} onPick={goCategory} />

      {catalog.tagline && (
        <div className="max-w-6xl mx-auto px-6 pt-10 text-center">
          <p className="f-display italic text-[22px] sm:text-[26px]" style={{ color: '#314A3A' }}>{catalog.tagline}</p>
        </div>
      )}

      {/* ---------- Coleção ---------- */}
      <section id="colecao" className="pt-10 sm:pt-14">
        <div className="max-w-6xl mx-auto px-4 sm:px-6 text-center">
          <div className="eyebrow">Nossa coleção</div>
          <h2 className="f-display section-title mt-2">{showFavs ? 'Seus favoritos' : activeCategory || 'Encontre o seu ritual'}</h2>
          {activeCategory && blurbFor(activeCategory) && <p className="f-body text-[13px] mt-1" style={{ color: '#6E6558' }}>{blurbFor(activeCategory)}</p>}
          <Ornament className="mt-4" />
        </div>

        <div className="filter-wrap mt-6">
          <div className="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex flex-col sm:flex-row sm:items-center gap-2.5">
            <div className="relative sm:w-72 shrink-0">
              <span className="absolute left-4 top-1/2 -translate-y-1/2" style={{ color: '#9A9081' }}><IconSearch size={17} /></span>
              <input id="busca" className="search-input w-full" style={{ paddingLeft: '42px' }} placeholder="Buscar vela ou aroma" value={search} onChange={e => setSearch(e.target.value)} />
            </div>
            <div className="chip-row flex gap-2 overflow-x-auto -mx-4 px-4 sm:mx-0 sm:px-0 sm:flex-wrap">
              <button onClick={() => { setActiveCategory(null); setShowFavs(false); }} className={`pill shrink-0 ${!activeCategory && !showFavs ? 'selected' : ''}`}>Todos</button>
              {categories.map(c => (
                <button key={c} onClick={() => { setActiveCategory(c); setShowFavs(false); }} className={`pill shrink-0 ${activeCategory === c && !showFavs ? 'selected' : ''}`}>{c}</button>
              ))}
              {favs.length > 0 && (
                <button onClick={() => { setShowFavs(true); setActiveCategory(null); }} className={`pill shrink-0 flex items-center gap-1.5 ${showFavs ? 'selected' : ''}`}><IconHeart size={14} filled /> Favoritos ({favs.length})</button>
              )}
            </div>
          </div>
        </div>

        <div className="max-w-6xl mx-auto px-4 sm:px-6 pt-6 pb-16">
          {filteredProducts.length === 0 ? (
            <div className="text-center py-16">
              <p className="f-display italic text-[20px]" style={{ color: '#7A4B2A' }}>Nenhum produto encontrado.</p>
              <button onClick={goHome} className="f-body text-[13px] underline mt-2" style={{ color: '#314A3A' }}>Ver todos os produtos</button>
            </div>
          ) : (
            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-3 sm:gap-x-6 gap-y-9 sm:gap-y-12">
              {filteredProducts.map(p => (
                <ProductCard key={p.id} product={p} isFav={favs.includes(p.id)} onToggleFav={() => toggleFav(p.id)} onOpen={() => openProduct(p.id)} onQuickAdd={() => quickAdd(p)} />
              ))}
            </div>
          )}
        </div>
      </section>

      {/* ---------- Nossa história ---------- */}
      <section id="historia" className="story">
        <div className="max-w-4xl mx-auto px-6 py-14 sm:py-20 text-center">
          <img src={BRAND_TREE} alt="" aria-hidden="true" className="w-16 sm:w-20 h-auto mx-auto mb-5" />
          <div className="eyebrow">Nossa história</div>
          <h2 className="f-display section-title mt-2">Da natureza para a sua essência</h2>
          <p className="f-display italic text-[21px] sm:text-[24px] leading-snug mt-5" style={{ color: '#314A3A' }}>
            Transformar pequenos momentos em rituais de presença, aroma e encantamento.
          </p>
          <div className="flex flex-wrap justify-center gap-2 mt-7">
            {['Rústica chique', 'Mística', 'Lúdica', 'Botânica', 'Acolhedora', 'Artesanal premium'].map(t => <span key={t} className="essence-tag">{t}</span>)}
          </div>
          <Ornament className="mt-8" />
          <p className="f-body text-[13px] mt-4" style={{ color: '#7A4B2A' }}>Cada aroma abre um caminho para a magia.</p>
        </div>
      </section>

      {/* ---------- Cuidados ---------- */}
      <section id="cuidados" className="max-w-6xl mx-auto px-4 sm:px-6 py-14 sm:py-16">
        <div className="text-center">
          <div className="eyebrow">Cuidados</div>
          <h2 className="f-display section-title mt-2">Para sua vela durar mais</h2>
          <Ornament className="mt-4" />
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4 mt-8">
          {[
            ['Primeira queima', 'Deixe acesa até derreter toda a superfície (cerca de 2 a 3 horas). Isso evita que a cera afunde só no meio.'],
            ['Pavio aparado', 'Antes de cada uso, apare o pavio para cerca de 5 mm. A chama fica mais limpa e sem fuligem.'],
            ['Tempo de queima', 'Não deixe acesa por mais de 4 horas seguidas.'],
            ['Sempre por perto', 'Nunca deixe a vela acesa sem supervisão. Mantenha longe de crianças, animais, cortinas e correntes de ar.'],
            ['Elementos decorativos', 'Retire cristais, flores secas e outros enfeites antes de acender.'],
            ['Hora de parar', 'Apague quando restar cerca de 1 cm de cera no fundo do recipiente.'],
          ].map(([t, d]) => (
            <div key={t} className="care-card">
              <span className="care-icon"><IconSprig size={20} /></span>
              <div>
                <div className="f-display text-[19px] font-semibold" style={{ color: '#1E1D1A' }}>{t}</div>
                <div className="f-body text-[13px] leading-relaxed mt-1" style={{ color: '#6E6558' }}>{d}</div>
              </div>
            </div>
          ))}
        </div>
      </section>

      <SiteFooter whatsapp={catalog.whatsapp_number} />

      <Lightbox
        photos={lightbox ? lightbox.photos : []}
        index={lightbox ? lightbox.index : null}
        onClose={closeLightbox}
        onNav={navLightbox}
      />

      {openProductData && (
        <ProductPage
          key={openProductData.id} product={openProductData}
          isFav={favs.includes(openProductData.id)} onToggleFav={() => toggleFav(openProductData.id)}
          onClose={closeProduct} onAddToCart={addToCart} onOpenLightbox={openLightbox}
        />
      )}

      {cart.length > 0 && cartCollapsed && !openProductData && (
        <button onClick={() => setCartCollapsed(false)} className="bag-fab fixed z-20 flex items-center justify-between gap-3 left-4 right-4 sm:left-auto sm:right-6 sm:w-80">
          <span className="flex items-center gap-2.5"><span className="relative"><IconBag size={20} /><span className="badge-count" style={{ top: '-7px', right: '-9px' }}>{itemCount}</span></span><span className="f-body text-[14px] font-semibold">Ver sacola</span></span>
          <span className="f-body text-[14px] font-semibold">{formatBRL(subtotal)}</span>
        </button>
      )}

      {cart.length > 0 && !cartCollapsed && (
        <div className="fixed inset-0 z-[45] flex items-end sm:items-center sm:justify-center">
          <div className="absolute inset-0" style={{ background: 'rgba(30,29,26,0.5)' }} onClick={() => setCartCollapsed(true)} />
          <div className="cart-sheet relative w-full sm:max-w-lg sm:rounded-2xl">
            <div className="flex items-center justify-between px-5 pt-4 pb-3" style={{ borderBottom: '1px solid #E4D9C4' }}>
              <div>
                <h3 className="f-display text-[24px] font-semibold leading-none" style={{ color: '#1E1D1A' }}>Sua sacola</h3>
                <div className="f-body text-[12px] mt-1" style={{ color: '#9A9081' }}>{itemCount} {itemCount === 1 ? 'item' : 'itens'}</div>
              </div>
              <button className="icon-btn" onClick={() => setCartCollapsed(true)} aria-label="Fechar sacola"><IconX size={22} /></button>
            </div>
            <div className="px-5 py-4 overflow-y-auto" style={{ maxHeight: 'calc(88vh - 80px)' }}>
              <div className="space-y-3 mb-5">
                {cart.map((item, idx) => {
                  const prod = products.find(p => p.id === item.productId) || {};
                  return (
                    <div key={idx} className="flex items-center gap-3">
                      <div className="w-14 h-14 rounded-lg overflow-hidden shrink-0" style={{ background: '#EFE6D2' }}>{(prod.photos || [])[0] && <img src={prod.photos[0]} alt="" className="w-full h-full object-cover" />}</div>
                      <div className="flex-1 min-w-0">
                        <div className="f-display text-[17px] font-semibold leading-tight truncate" style={{ color: '#1E1D1A' }}>{item.name}</div>
                        <div className="f-body text-[12px]" style={{ color: '#7A4B2A' }}>{variantLabel(item.color, item.size)}</div>
                        <div className="flex items-center justify-between mt-1.5">
                          <div className="stepper stepper-sm"><button onClick={() => changeQty(idx, -1)} aria-label="Diminuir">−</button><span>{item.qty}</span><button onClick={() => changeQty(idx, 1)} aria-label="Aumentar">+</button></div>
                          <span className="f-body text-[14px] font-semibold" style={{ color: '#1E1D1A' }}>{formatBRL(item.price * item.qty)}</span>
                        </div>
                      </div>
                      <button onClick={() => removeFromCart(idx)} aria-label="Remover" className="icon-btn" style={{ color: '#9A9081' }}><IconX size={18} /></button>
                    </div>
                  );
                })}
              </div>

              <div className="flex items-center gap-2 mb-2">
                {appliedCoupon ? (
                  <div className="flex items-center justify-between w-full rounded-lg px-3 py-2.5" style={{ background: '#EFE6D2' }}>
                    <span className="f-body text-[13px] text-[#6E6558]">
                      Cupom <strong>{appliedCoupon.code}</strong> aplicado ({appliedCoupon.discount_type === 'percent' ? `${appliedCoupon.discount_value}%` : formatBRL(appliedCoupon.discount_value)} off)
                    </span>
                    <button onClick={removeCoupon} className="text-[#6E6558] text-[13px] underline">remover</button>
                  </div>
                ) : (
                  <>
                    <input className="fw-input flex-1" placeholder="Cupom de desconto" value={couponCode} onChange={e => setCouponCode(e.target.value.toUpperCase().replace(/\s+/g, ''))} style={{ textTransform: 'uppercase' }} />
                    <button onClick={applyCoupon} disabled={couponLoading || !couponCode.trim()} className="fw-btn-ghost" style={{ borderColor: '#314A3A', color: '#314A3A', minHeight: '46px' }}>{couponLoading ? 'Validando...' : 'Aplicar'}</button>
                  </>
                )}
              </div>
              {couponMessage && !appliedCoupon && <div className="text-[12px] text-[#6E6558] mb-2">{couponMessage}</div>}

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-3">
                <input className="fw-input" placeholder="Seu nome (opcional)" value={clientName} onChange={e => setClientName(e.target.value)} />
                <select className="fw-input" value={payment} onChange={e => setPayment(e.target.value)}>
                  {PAYMENT_METHODS.map(p => <option key={p.value} value={p.value}>{p.label}</option>)}
                </select>
              </div>

              <div className="flex items-end justify-between mt-5">
                <span className="f-body text-[13px]" style={{ color: '#6E6558' }}>Total</span>
                <div className="text-right">
                  {appliedCoupon && <div className="f-body text-[12px] text-[#9A9081] line-through">{formatBRL(subtotal)}</div>}
                  <div className="f-body text-[22px] font-semibold" style={{ color: '#1E1D1A' }}>{formatBRL(total)}</div>
                </div>
              </div>
              <button onClick={sendOrder} disabled={sendingOrder} className="btn-primary w-full mt-4"><IconWhats size={19} />{sendingOrder ? 'Enviando...' : 'Enviar pedido pelo WhatsApp'}</button>
              <div style={{ height: 'env(safe-area-inset-bottom)' }} />
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
