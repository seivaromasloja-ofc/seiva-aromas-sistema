  return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function monthKey(dateStr) { return (dateStr || '').slice(0, 7); }
function monthLabel(mk) {
  if (!mk) return '';
  const [y, m] = mk.split('-');
  return MONTHS[parseInt(m, 10) - 1] + '/' + y.slice(2);
}
function emptyData() {

}

function Fonts() {
  return (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600;700&display=swap');
      .fw-display { font-family: 'Cormorant Garamond', serif; }
      .fw-logo { font-family: 'Cormorant Garamond', serif; font-weight: 700; letter-spacing: 0.02em; }
      .fw-mono { font-family: 'Montserrat', sans-serif; font-variant-numeric: tabular-nums; }
      .fw-body { font-family: 'Montserrat', sans-serif; }
      .fw-input {
        background: #ffffff; border: 1px solid #E4D9C4; color: #1E1D1A;
        border-radius: 8px; padding: 8px 11px; font-size: 13px; outline: none;
      }
      .fw-input:focus { border-color: #656149; box-shadow: 0 0 0 3px rgba(200,154,61,0.25); }
      .fw-input option { color: #1E1D1A; background: #ffffff; }
      .fw-btn {
        background: #656149; color: #ffffff; font-weight: 500; font-size: 13px;
        padding: 8px 16px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px;
        border: none;
      }
      .fw-btn:hover { background: #4F4C38; }
      .fw-btn-ghost {
        background: transparent; border: 1px solid #E4D9C4; color: #475569;
        padding: 7px 14px; border-radius: 8px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
      }
      .fw-btn-ghost:hover { border-color: #656149; color: #656149; }
      .fw-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #9A9081; padding: 9px 10px; border-bottom: 1px solid #EEF0F5; }
      .fw-table td { padding: 9px 10px; border-bottom: 1px solid #F3F4F8; font-size: 13px; color: #1E293B; }
      .fw-table tr:hover td { background: #F8F9FC; }

      .seiva-details { border: 1px solid #E4D9C4; border-radius: 10px; padding: 12px 14px; background: #FFFCF6; }
      .seiva-details > summary { cursor: pointer; font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 600; color: #656149; list-style: none; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
      .seiva-details > summary::before { content: '+'; font-family: 'Montserrat', sans-serif; color: #C89A3D; font-weight: 600; width: 14px; }
      .seiva-details[open] > summary::before { content: '−'; }
      textarea.fw-input { resize: vertical; }
      .banner-ctl { width: 32px; height: 32px; border-radius: 999px; background: rgba(255,252,246,0.92); color: #1E1D1A; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1; }
      .banner-ctl:disabled { opacity: 0.35; }
      .qty-field { display: inline-flex; align-items: stretch; border: 1px solid #E4D9C4; border-radius: 10px; background: #FFFCF6; overflow: hidden; height: 44px; flex-shrink: 0; }
      .qty-field.is-focused { border-color: #656149; box-shadow: 0 0 0 3px rgba(200,154,61,0.25); }
      .qty-field.is-low { border-color: #DC2626; background: #FEF2F2; }
      .qty-field.is-low .qty-input { color: #B91C1C; }
      .qty-step { width: 44px; font-size: 20px; line-height: 1; color: #656149; background: transparent; }
      .qty-step:active { background: #EFE6D2; }
      .qty-step:disabled { color: #CFC6B4; }
      .qty-input { width: 56px; text-align: center; font-family: 'Montserrat', sans-serif; font-size: 17px; font-weight: 600; color: #1E1D1A; background: transparent; border: 0; outline: none; border-left: 1px solid #EFE6D2; border-right: 1px solid #EFE6D2; }
      .stock-row + .stock-row { border-top: 1px dashed #EFE6D2; }
      @media (max-width: 767px) { .qty-input { font-size: 18px !important; width: 60px; } .qty-step { width: 48px; } .qty-field { height: 48px; } }
      @media (max-width: 767px) {
        .seiva-main { padding-bottom: calc(96px + env(safe-area-inset-bottom)) !important; }
        .fw-input { font-size: 16px !important; min-height: 44px; }
        .fw-btn, .fw-btn-ghost { min-height: 44px; justify-content: center; }
        .fw-table thead { display: none; }
        .fw-table, .fw-table tbody, .fw-table tr, .fw-table td { display: block; width: 100%; }
        .fw-table tr { background: #ffffff; border: 1px solid #E4D9C4; border-radius: 12px; padding: 4px 14px; margin-bottom: 10px; }
        .fw-table td { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px dashed #EFE6D2; text-align: right; font-size: 14px; min-height: 40px; }
        .fw-table td:last-child { border-bottom: none; }
        .fw-table td:empty { display: none; }
        .fw-table td[data-label]::before { content: attr(data-label); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #9A9081; text-align: left; flex-shrink: 0; }
        .fw-table td[colspan] { justify-content: center; text-align: center; }
        .fw-table tr:hover td { background: transparent; }
        .fw-table td .fw-input { max-width: 120px; }
        .recharts-responsive-container { min-height: 200px; }
      }
      @keyframes seivaSlideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
      .seiva-slide-in { animation: seivaSlideIn 0.22s ease-out; }
    `}</style>
  );
}

const SINGLE_SIZE = 'Único';  // tamanho usado quando o produto não tem tamanhos

function BrandMark({ variant = 'dark', height = 'h-6', fontSize = 18 }) {
  const src = variant === 'dark' ? BRAND_LOGO_DARK : BRAND_LOGO_LIGHT;
  if (src) return <img src={src} alt={BRAND_NAME} className={`${height} w-auto`} />;
  return <span style={{ fontFamily: "'Cormorant Garamond', serif", fontWeight: 700, fontSize: (fontSize + 4) + 'px', letterSpacing: '0.04em', textTransform: 'uppercase', color: variant === 'dark' ? '#C89A3D' : '#7A4B2A' }}>{BRAND_NAME}</span>;
}
function variantLabel(color, size) { return size && size !== SINGLE_SIZE ? `${color}/${size}` : color; }


// ---------- Celular: rótulos das tabelas (as linhas viram cartões) ----------
(function () {
  const label = () => {
    document.querySelectorAll('table.fw-table').forEach(t => {
      const ths = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
      t.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td, i) => {
        if (td.hasAttribute('colspan')) return;
        const l = ths[i] || '';
        if (l && td.getAttribute('data-label') !== l) td.setAttribute('data-label', l);
      }));
    });
  };
  let pending = false;
  const obs = new MutationObserver(() => { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; label(); }); } });
  const start = () => { const r = document.getElementById('root'); if (r) { obs.observe(r, { childList: true, subtree: true }); label(); } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

// ---------- Reusable small components ----------
function Field({ label, children }) {
  return (
    <label className="flex flex-col gap-1 text-xs text-slate-500">
      {label}
      {children}
    </label>
  );
}

function StatCard({ label, value, sub, tone = 'default', alert = false }) {
  return (
    <div className={`bg-white rounded-[10px] border px-4 py-3.5 flex-1 min-w-[160px] ${alert ? 'border-red-200' : 'border-slate-200'}`}>
      <div className="text-[11.5px] text-slate-500 fw-body mb-1.5 flex items-center gap-1">
        {alert && <AlertTriangle size={12} className="text-red-500" />} {label}
      </div>
      <div className={`fw-mono text-[19px] font-semibold ${alert ? 'text-red-600' : 'text-slate-900'}`}>{value}</div>
      {sub && <div className="text-[11px] text-slate-400 mt-1">{sub}</div>}
    </div>
  );
}

function Section({ title, action, children }) {
  return (
    <div className="mb-7">
      <div className="flex items-center justify-between mb-3">
        <h2 className="fw-display text-[22px] md:text-[23px] font-semibold leading-tight" style={{ color: '#1E1D1A' }}>{title}</h2>
        {action}
      </div>
      {children}
    </div>
  );
}

      try {
        const { data: row, error } = await sb
          .from('store_data')
          .select('data')
          .eq('user_id', SHARED_STORE_ID)
          .maybeSingle();
        if (error) throw error;
        setData(row && row.data && Object.keys(row.data).length ? { ...emptyData(), ...row.data } : emptyData());
      } catch (e) {
        console.error('Erro ao carregar dados:', e);
        setData(emptyData());
      }
    })();
  }, []);

  useEffect(() => {
    if (data === null) return;
    setSaveState('saving');
    const t = setTimeout(async () => {
      try {
        const { error } = await sb
          .from('store_data')
          .upsert({ user_id: SHARED_STORE_ID, data, updated_at: new Date().toISOString() });
        if (error) throw error;
        setSaveState('saved');
      } catch (e) {
        console.error('Erro ao salvar dados:', e);
        setSaveState('error');
      }
    }, 500);
    return () => clearTimeout(t);
  }, [data]);

  // ---- derived (must run on every render, even while data is still loading) ----
  const safeData = data || emptyData();
  const lowStock = useMemo(() => {
    const list = [];
    safeData.products.forEach(p => {
      p.variants.forEach(v => {
        if (v.stock <= (p.minStock ?? 3)) list.push({ product: p.name, color: v.color, size: v.size, stock: v.stock, min: p.minStock ?? 3, productId: p.id });
      });
    });
    return list;
  }, [safeData.products]);

  const thisMonth = monthKey(todayISO());
  const salesThisMonth = useMemo(() => safeData.sales.filter(s => monthKey(s.date) === thisMonth), [safeData.sales, thisMonth]);
  const revenueThisMonth = salesThisMonth.reduce((s, x) => s + x.total, 0);
  const profitThisMonth = salesThisMonth.reduce((s, x) => s + x.profit, 0);
  const pendingOrders = safeData.orders.filter(o => o.status === 'pendente').length;

  const revenueByMonth = useMemo(() => {
    const map = {};
    safeData.sales.forEach(s => { const mk = monthKey(s.date); map[mk] = (map[mk] || 0) + s.total; });
    return Object.entries(map).sort(([a], [b]) => a.localeCompare(b)).slice(-6).map(([mk, v]) => ({ month: monthLabel(mk), receita: Math.round(v * 100) / 100 }));
  }, [safeData.sales]);

  const salesByType = useMemo(() => {
    const varejo = safeData.sales.filter(s => s.type === 'varejo').reduce((s, x) => s + x.total, 0);
    const atacado = safeData.sales.filter(s => s.type === 'atacado').reduce((s, x) => s + x.total, 0);
    return [{ name: 'Varejo', value: varejo }, { name: 'Atacado', value: atacado }].filter(x => x.value > 0);
  }, [safeData.sales]);

  const cashFlow = useMemo(() => {
    const sorted = [...safeData.finance].sort((a, b) => a.date.localeCompare(b.date));
    let bal = 0;
    return sorted.map(f => { bal += f.type === 'entrada' ? f.value : -f.value; return { date: f.date.slice(5), saldo: Math.round(bal * 100) / 100 }; });
  }, [safeData.finance]);

  const prevMonthKey = (() => {
    const [y, m] = thisMonth.split('-').map(Number);
    const d = new Date(y, m - 2, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  })();
  const salesPrevMonth = useMemo(() => safeData.sales.filter(s => monthKey(s.date) === prevMonthKey), [safeData.sales, prevMonthKey]);
  const revenuePrevMonth = salesPrevMonth.reduce((s, x) => s + x.total, 0);
  const profitPrevMonth = salesPrevMonth.reduce((s, x) => s + x.profit, 0);
  const pctChange = (curr, prev) => (prev ? Math.round(((curr - prev) / Math.abs(prev)) * 100) : null);
  const revenueChangePct = pctChange(revenueThisMonth, revenuePrevMonth);
  const profitChangePct = pctChange(profitThisMonth, profitPrevMonth);

  const salesByCategory = useMemo(() => {
    const map = {};
    safeData.sales.forEach(sale => {
      (sale.items || []).forEach(item => {
        const product = safeData.products.find(p => p.id === item.productId);
        const cat = (product && product.category) || 'Outros';
        map[cat] = (map[cat] || 0) + item.price * item.qty;
      });
    });
    const total = Object.values(map).reduce((a, b) => a + b, 0);
    return Object.entries(map)
      .sort((a, b) => b[1] - a[1]).slice(0, 4)
      .map(([name, value]) => ({ name, value, pct: total ? Math.round((value / total) * 100) : 0 }));
  }, [safeData.sales, safeData.products]);

  const recentSales = useMemo(() => (
    [...safeData.sales].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 4)
  ), [safeData.sales]);

  if (data === null) {
    return (
      <div className="min-h-screen flex items-center justify-center fw-mono text-sm" style={{ backgroundColor: '#656149', color: '#E9E3D0' }}>
        carregando sistema...
      </div>
    );
  }

  // ---- mutations ----
  const addProduct = (p) => setData(d => ({ ...d, products: [...d.products, p] }));
  const updateProduct = (id, patch) => setData(d => ({ ...d, products: d.products.map(p => p.id === id ? { ...p, ...patch } : p) }));
  const deleteProduct = (id) => setData(d => ({ ...d, products: d.products.filter(p => p.id !== id) }));
  const setVariantStock = (productId, color, size, stock) => setData(d => ({
    ...d,
    products: d.products.map(p => p.id !== productId ? p : {
      ...p, variants: p.variants.map(v => v.color === color && v.size === size ? { ...v, stock: Math.max(0, Number(stock) || 0) } : v)
    })
  }));

  const addClient = (c) => setData(d => ({ ...d, clients: [...d.clients, c] }));
  const deleteClient = (id) => setData(d => ({ ...d, clients: d.clients.filter(c => c.id !== id) }));

  const registerSale = (sale) => {
    setData(d => {
      const products = d.products.map(p => ({ ...p, variants: p.variants.map(v => ({ ...v })) }));
      let costTotal = 0;
      sale.items.forEach(item => {
        const prod = products.find(p => p.id === item.productId);
        if (prod) {
          const variant = prod.variants.find(v => v.color === item.color && v.size === item.size);
          if (variant) variant.stock = Math.max(0, variant.stock - item.qty);
          costTotal += (prod.cost || 0) * item.qty;
        }
      });
      const total = sale.items.reduce((s, i) => s + i.price * i.qty, 0);
      const financeId = uid('fin');
      const client = d.clients.find(c => c.id === sale.clientId);
      const newSale = { ...sale, id: uid('sale'), total, costTotal, profit: total - costTotal, financeId };
      const financeEntry = {
        id: financeId, date: sale.date, type: 'entrada', category: 'venda',
        desc: `Venda${client ? ' - ' + client.name : ''} (${sale.type})`, value: total, auto: true
      };
      return { ...d, products, sales: [...d.sales, newSale], finance: [...d.finance, financeEntry] };
    });
  };
  const deleteSale = (id) => setData(d => {
    const sale = d.sales.find(s => s.id === id);
    if (!sale) return d;
    const products = d.products.map(p => ({ ...p, variants: p.variants.map(v => ({ ...v })) }));
    sale.items.forEach(item => {
      const prod = products.find(p => p.id === item.productId);
      if (prod) {
        const variant = prod.variants.find(v => v.color === item.color && v.size === item.size);
        if (variant) variant.stock += item.qty;
      }
    });
    return { ...d, products, sales: d.sales.filter(s => s.id !== id), finance: d.finance.filter(f => f.id !== sale.financeId) };
  });

  const registerPurchase = (purchase) => {
    setData(d => {
      const products = d.products.map(p => ({ ...p, variants: p.variants.map(v => ({ ...v })) }));
      purchase.items.forEach(item => {
        const prod = products.find(p => p.id === item.productId);
        if (prod) {
          const variant = prod.variants.find(v => v.color === item.color && v.size === item.size);
          if (variant) variant.stock += item.qty;
        }
      });
      const total = purchase.items.reduce((s, i) => s + i.cost * i.qty, 0);
      const financeId = uid('fin');
      const newPurchase = { ...purchase, id: uid('purch'), total, financeId };
      const financeEntry = { id: financeId, date: purchase.date, type: 'saida', category: 'compra', desc: `Compra - ${purchase.supplier}`, value: total, auto: true };
      return { ...d, products, purchases: [...d.purchases, newPurchase], finance: [...d.finance, financeEntry] };
    });
  };
  const deletePurchase = (id) => setData(d => {
    const purchase = d.purchases.find(p => p.id === id);
    if (!purchase) return d;
    const products = d.products.map(p => ({ ...p, variants: p.variants.map(v => ({ ...v })) }));
    purchase.items.forEach(item => {
      const prod = products.find(p => p.id === item.productId);
      if (prod) {
        const variant = prod.variants.find(v => v.color === item.color && v.size === item.size);
        if (variant) variant.stock = Math.max(0, variant.stock - item.qty);
      }
    });
    return { ...d, products, purchases: d.purchases.filter(p => p.id !== id), finance: d.finance.filter(f => f.id !== purchase.financeId) };
  });

  const addFinance = (entry) => setData(d => ({ ...d, finance: [...d.finance, { ...entry, id: uid('fin'), auto: false }] }));
  const deleteFinance = (id) => setData(d => ({ ...d, finance: d.finance.filter(f => f.id !== id) }));

  const addOrder = (order) => setData(d => ({ ...d, orders: [...d.orders, { ...order, id: uid('order') }] }));
  const updateOrderStatus = (id, status) => setData(d => ({ ...d, orders: d.orders.map(o => o.id === id ? { ...o, status } : o) }));
  const deleteOrder = (id) => setData(d => ({ ...d, orders: d.orders.filter(o => o.id !== id) }));

  const addPricingCost = (cost) => setData(d => ({ ...d, pricingCosts: [...d.pricingCosts, { ...cost, id: uid('cost') }] }));
  const deletePricingCost = (id) => setData(d => ({ ...d, pricingCosts: d.pricingCosts.filter(c => c.id !== id) }));
  const setPricingMargin = (value) => setData(d => ({ ...d, pricingMargin: value }));
  const applyPrice = (productId, field, price) => updateProduct(productId, { [field]: Math.round(price * 100) / 100 });

  const updateCatalogSettings = (patch) => setData(d => ({ ...d, catalogSettings: { ...d.catalogSettings, ...patch } }));
  const publishCatalog = async () => {
    setPublishState('publishing');
    try {
      const snapshot = data.products.map(p => ({
        id: p.id, name: p.name, category: p.category,
        photos: p.photos || [], price: p.retail || 0,
        description: p.description || '', notes: p.notes || '',
        subtitle: p.subtitle || '', aromaNotes: p.aromaNotes || '', family: p.family || '', intensity: Number(p.intensity) || 0,
        burnTime: p.burnTime || '', usage: p.usage || '', story: p.story || '', warning: p.warning || '', phrase: p.phrase || '', featured: !!p.featured,
        variants: (p.variants || []).map(v => ({ color: v.color, size: v.size, inStock: v.stock > 0 })),
      }));
      const row = {
        user_id: SHARED_STORE_ID,
        whatsapp_number: (data.catalogSettings && data.catalogSettings.whatsappNumber) || '',
        store_name: (data.catalogSettings && data.catalogSettings.storeName) || 'Minha Loja',
        logo_url: (data.catalogSettings && data.catalogSettings.logoUrl) || '',
        tagline: (data.catalogSettings && data.catalogSettings.tagline) || '',
        welcome_message: (data.catalogSettings && data.catalogSettings.welcomeMessage) || '',
        products: snapshot,
        updated_at: new Date().toISOString(),
      };
      const cs = data.catalogSettings || {};
      const extras = {
        banners: (cs.banners || []).filter(b => b && b.url),
        music_url: cs.musicOff ? 'off' : (cs.musicUrl || ''),
      };
      // Tenta publicar com tudo; se alguma coluna nova ainda não existir no banco, publica sem ela e avisa.
      const missing = [];
      let payload = { ...row, ...extras };
      let { error } = await sb.from('catalog_public').upsert(payload);
      for (let tries = 0; error && tries < 2; tries++) {
        const col = Object.keys(extras).find(k => (error.message || '').includes(k) && k in payload);
        if (!col) break;
        missing.push(col); delete payload[col];
        ({ error } = await sb.from('catalog_public').upsert(payload));
      }
      if (error) throw error;
      setMissingCols(missing);
      setPublishState(missing.length ? 'published-partial' : 'published');
      // Faxina: apaga do Supabase fotos e músicas que não são mais usadas (só depois de publicar,
      // para o catálogo no ar nunca ficar apontando para um arquivo apagado).
      cleanupUnusedFiles(sb, data).catch(err => console.warn('Faxina de arquivos não concluída:', err));
    } catch (e) {
      console.error('Erro ao publicar cat\u00e1logo:', e);
      setPublishState('error');
    }
  };

  // ---- derived (moved above the loading-state early return, see top of App) ----

  return (
    <div className="min-h-screen fw-body md:flex" style={{ backgroundColor: '#F7F2E8' }}>
      <Fonts />
      {/* Sidebar (computador) */}
      <aside className="hidden md:flex w-56 shrink-0 flex-col" style={{ backgroundColor: '#656149' }}>
        <div className="px-4 pt-6 pb-5 flex items-center justify-center">
          <BrandMark variant="dark" height="h-28" fontSize={17} />
        </div>
        <nav className="flex-1 py-2 px-2.5 flex flex-col gap-0.5">
          {NAV.map(item => {
            const Icon = item.icon;
            const active = tab === item.key;
            return (
              <button
                key={item.key}
                onClick={() => { setTab(item.key); setMenuOpen(false); window.scrollTo(0, 0); }}
                className="w-full flex items-center gap-2.5 px-2.5 py-2.5 md:py-2 text-[14px] md:text-[13px] rounded-lg transition-colors"
                style={active
                  ? { backgroundColor: '#C89A3D', color: '#1E1D1A', fontWeight: 600 }
                  : { color: '#E9E3D0' }}
              >
                <Icon size={15} />
                {item.label}
                {item.key === 'stock' && lowStock.length > 0 && !active && (
                  <span className="ml-auto fw-mono text-[10px] px-1.5 rounded-full font-semibold" style={{ backgroundColor: '#EF4444', color: '#fff' }}>{lowStock.length}</span>
                )}
                {item.key === 'orders' && pendingOrders > 0 && !active && (
                  <span className="ml-auto fw-mono text-[10px] px-1.5 rounded-full font-semibold" style={{ backgroundColor: '#EF4444', color: '#fff' }}>{pendingOrders}</span>
                )}
              </button>
            );
          })}
        </nav>
        <div className="px-3 py-3" style={{ borderTop: '1px solid rgba(255,255,255,0.08)' }}>
          <div className="fw-mono text-[10px] mb-2" style={{ color: '#E9E3D0' }}>
            {saveState === 'saving' ? 'salvando...' : saveState === 'error' ? 'erro ao salvar' : 'dados salvos'}
          </div>
          <div className="flex items-center gap-2">
            <div className="rounded-full flex items-center justify-center shrink-0" style={{ width: '26px', height: '26px', backgroundColor: '#C89A3D', color: '#1E1D1A', fontSize: '11px', fontWeight: 600 }}>
              {(session.user.email || '?')[0].toUpperCase()}
            </div>
            <div className="min-w-0 flex-1">
              <div className="text-[11px] text-white truncate" title={session.user.email}>{session.user.email}</div>
              <button onClick={onSignOut} className="text-[12px] md:text-[10.5px] py-1 md:py-0 hover:underline" style={{ color: '#F2EBDA' }}>Sair</button>
            </div>
          </div>
        </div>
      </aside>

      {/* Barra superior (celular) */}
      <header className="md:hidden sticky top-0 z-30 flex items-center justify-between px-4" style={{ backgroundColor: '#656149', height: 'calc(64px + env(safe-area-inset-top))', paddingTop: 'env(safe-area-inset-top)' }}>
        <BrandMark variant="dark" height="h-12" fontSize={15} />
        <div className="flex items-center gap-2">
          <span className="fw-mono text-[10px]" style={{ color: '#E9E3D0' }}>{saveState === 'saving' ? 'salvando...' : saveState === 'error' ? 'erro ao salvar' : ''}</span>
          <button onClick={() => setMenuOpen(true)} aria-label="Abrir menu" className="flex items-center justify-center rounded-lg" style={{ width: '44px', height: '44px', color: '#C89A3D' }}><MenuIcon size={24} /></button>
        </div>
      </header>

      {/* Menu deslizante (celular) */}
      {menuOpen && (
        <div className="md:hidden fixed inset-0 z-50 flex">
          <div className="absolute inset-0" style={{ backgroundColor: 'rgba(30,29,26,0.55)' }} onClick={() => setMenuOpen(false)} />
          <aside className="relative w-72 max-w-[85vw] h-full flex flex-col overflow-y-auto seiva-slide-in" style={{ backgroundColor: '#656149', paddingTop: 'env(safe-area-inset-top)', paddingBottom: 'env(safe-area-inset-bottom)' }}>
            <button onClick={() => setMenuOpen(false)} aria-label="Fechar menu" className="absolute top-3 right-3 flex items-center justify-center" style={{ width: '44px', height: '44px', color: '#E9E3D0' }}><X size={22} /></button>
        <div className="px-4 pt-6 pb-5 flex items-center justify-center">
          <BrandMark variant="dark" height="h-28" fontSize={17} />
        </div>
        <nav className="flex-1 py-2 px-2.5 flex flex-col gap-0.5">
          {NAV.map(item => {
            const Icon = item.icon;
            const active = tab === item.key;
            return (
              <button
                key={item.key}
                onClick={() => { setTab(item.key); setMenuOpen(false); window.scrollTo(0, 0); }}
                className="w-full flex items-center gap-2.5 px-2.5 py-2.5 md:py-2 text-[14px] md:text-[13px] rounded-lg transition-colors"
                style={active
                  ? { backgroundColor: '#C89A3D', color: '#1E1D1A', fontWeight: 600 }
                  : { color: '#E9E3D0' }}
              >
                <Icon size={15} />
                {item.label}
                {item.key === 'stock' && lowStock.length > 0 && !active && (
                  <span className="ml-auto fw-mono text-[10px] px-1.5 rounded-full font-semibold" style={{ backgroundColor: '#EF4444', color: '#fff' }}>{lowStock.length}</span>
                )}
                {item.key === 'orders' && pendingOrders > 0 && !active && (
                  <span className="ml-auto fw-mono text-[10px] px-1.5 rounded-full font-semibold" style={{ backgroundColor: '#EF4444', color: '#fff' }}>{pendingOrders}</span>
                )}
              </button>
            );
          })}
        </nav>
        <div className="px-3 py-3" style={{ borderTop: '1px solid rgba(255,255,255,0.08)' }}>
          <div className="fw-mono text-[10px] mb-2" style={{ color: '#E9E3D0' }}>
            {saveState === 'saving' ? 'salvando...' : saveState === 'error' ? 'erro ao salvar' : 'dados salvos'}
          </div>
          <div className="flex items-center gap-2">
            <div className="rounded-full flex items-center justify-center shrink-0" style={{ width: '26px', height: '26px', backgroundColor: '#C89A3D', color: '#1E1D1A', fontSize: '11px', fontWeight: 600 }}>
              {(session.user.email || '?')[0].toUpperCase()}
            </div>
            <div className="min-w-0 flex-1">
              <div className="text-[11px] text-white truncate" title={session.user.email}>{session.user.email}</div>
              <button onClick={onSignOut} className="text-[12px] md:text-[10.5px] py-1 md:py-0 hover:underline" style={{ color: '#F2EBDA' }}>Sair</button>
            </div>
          </div>
        </div>
          </aside>
        </div>
      )}

      {/* Barra de atalhos inferior (celular) */}
      <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 flex border-t" style={{ backgroundColor: '#FFFCF6', borderColor: '#E4D9C4', paddingBottom: 'env(safe-area-inset-bottom)' }}>
        {[{ key: 'dashboard', label: 'Painel', icon: LayoutDashboard }, { key: 'sales', label: 'Vendas', icon: ShoppingCart }, { key: 'orders', label: 'Pedidos', icon: ClipboardList }, { key: 'stock', label: 'Estoque', icon: Boxes }].map(item => {
          const Icon = item.icon; const active = tab === item.key;
          const badge = item.key === 'stock' ? lowStock.length : item.key === 'orders' ? pendingOrders : 0;
          return (
            <button key={item.key} onClick={() => { setTab(item.key); window.scrollTo(0, 0); }} className="flex-1 flex flex-col items-center justify-center gap-0.5 relative" style={{ height: '62px', color: active ? '#656149' : '#9A9081', fontWeight: active ? 600 : 500 }}>
              {active && <span className="absolute top-0 left-1/2 -translate-x-1/2 rounded-b" style={{ width: '28px', height: '3px', backgroundColor: '#C89A3D' }} />}
              <Icon size={21} />
              <span className="text-[11px]">{item.label}</span>
              {badge > 0 && <span className="absolute fw-mono text-[10px] px-1.5 rounded-full font-semibold" style={{ top: '8px', left: 'calc(50% + 6px)', backgroundColor: '#EF4444', color: '#fff' }}>{badge}</span>}
            </button>
          );
        })}
        <button onClick={() => setMenuOpen(true)} className="flex-1 flex flex-col items-center justify-center gap-0.5" style={{ height: '62px', color: ['dashboard','sales','orders','stock'].includes(tab) ? '#9A9081' : '#656149', fontWeight: 500 }}>
          <MenuIcon size={21} />
          <span className="text-[11px]">Mais</span>
        </button>
      </nav>

      {/* Main */}
      <main className="flex-1 min-w-0 px-4 pt-5 md:p-8 max-w-6xl seiva-main">
        {tab === 'dashboard' && (
          <DashboardTab
            revenueThisMonth={revenueThisMonth} profitThisMonth={profitThisMonth}
            pendingOrders={pendingOrders} lowStock={lowStock}
            revenueByMonth={revenueByMonth} salesByType={salesByType}
            revenueChangePct={revenueChangePct} profitChangePct={profitChangePct}
            salesByCategory={salesByCategory} recentSales={recentSales}
            totalProducts={data.products.length}
          />
        )}
        {tab === 'products' && (
          <ProductsTab sb={sb} products={data.products} onAdd={addProduct} onUpdate={updateProduct} onDelete={deleteProduct} />
        )}
        {tab === 'clients' && (
          <ClientsTab clients={data.clients} onAdd={addClient} onDelete={deleteClient} />
        )}
        {tab === 'stock' && (
          <StockTab products={data.products} onSetStock={setVariantStock} onUpdateProduct={updateProduct} />
        )}
        {tab === 'sales' && (
          <SalesTab products={data.products} clients={data.clients} sales={data.sales} onRegister={registerSale} onDelete={deleteSale} />
        )}
        {tab === 'purchases' && (
          <PurchasesTab products={data.products} purchases={data.purchases} onRegister={registerPurchase} onDelete={deletePurchase} />
        )}
        {tab === 'pricing' && (
          <PricingTab
            products={data.products}
            costs={data.pricingCosts}
            margin={data.pricingMargin}
            onAddCost={addPricingCost}
            onDeleteCost={deletePricingCost}
            onSetMargin={setPricingMargin}
            onApplyPrice={applyPrice}
          />
        )}
        {tab === 'finance' && (
          <FinanceTab finance={data.finance} onAdd={addFinance} onDelete={deleteFinance} cashFlow={cashFlow} />
        )}
        {tab === 'expenses' && (
          <ExpensesTab finance={data.finance} sales={data.sales} onAdd={addFinance} onDelete={deleteFinance} />
        )}
        {tab === 'orders' && (
          <OrdersTab products={data.products} clients={data.clients} orders={data.orders} onAdd={addOrder} onUpdateStatus={updateOrderStatus} onDelete={deleteOrder} />
        )}
        {tab === 'catalog' && (
          <CatalogTab
            sb={sb}
            products={data.products}
            settings={data.catalogSettings}
            onSaveSettings={updateCatalogSettings}
            onPublish={publishCatalog}
            publishState={publishState}
            missingCols={missingCols}
          />
        )}
        {tab === 'coupons' && (
          <CouponsTab sb={sb} />
        )}
        {tab === 'reports' && (
          <ReportsTab sales={data.sales} purchases={data.purchases} finance={data.finance} products={data.products} />
        )}
      </main>
    </div>
  );
}

// ---------- Faxina de arquivos não usados ----------
// Apaga do bucket "product-photos" os arquivos que não aparecem em nenhum lugar dos dados
// (fotos de produto, fotos do banner, logo, música). Só mexe em arquivos com mais de 1 hora,
// para nunca apagar algo que acabou de ser enviado e ainda não foi salvo.
async function cleanupUnusedFiles(sb, data) {
  const used = JSON.stringify(data || {});
  const bucket = sb.storage.from('product-photos');
  const cutoff = Date.now() - 60 * 60 * 1000;
  const toDelete = [];
  for (let offset = 0; offset < 20000; offset += 1000) {
    const { data: files, error } = await bucket.list('', { limit: 1000, offset, sortBy: { column: 'name', order: 'asc' } });
    if (error) throw error;
    if (!files || files.length === 0) break;
    for (const f of files) {
      if (!f || !f.id || !f.name) continue;            // pastas não entram
      const created = Date.parse(f.created_at || f.updated_at || '') || 0;
      if (created > cutoff) continue;                  // muito recente: deixa quieto
      if (used.includes(f.name)) continue;             // ainda em uso
      toDelete.push(f.name);
    }
    if (files.length < 1000) break;
  }
  for (let i = 0; i < toDelete.length; i += 100) {
    const { error } = await bucket.remove(toDelete.slice(i, i + 100));
    if (error) throw error;
  }
  return toDelete.length;
}

// ---------- Products ----------
function PhotoUploader({ sb, value, onChange }) {
  const [uploading, setUploading] = useState(false);
  const [error, setError] = useState('');

  const handleFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setError('');
    setUploading(true);
    try {
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${uid('photo')}.${ext}`;
      const { error: upErr } = await sb.storage.from('product-photos').upload(path, file, { upsert: true, contentType: file.type });
      if (upErr) throw upErr;
      const { data } = sb.storage.from('product-photos').getPublicUrl(path);
      onChange(data.publicUrl);
    } catch (err) {
      setError('Erro ao enviar: ' + (err.message || 'tente novamente'));
    } finally {
      setUploading(false);
    }
  };

  return (
    <div className="flex flex-col gap-2">
      <div className="flex items-center gap-2">
        {value ? (
          <img src={value} alt="" className="w-10 h-10 object-cover rounded border border-slate-200" />
        ) : (
          <div className="w-10 h-10 rounded border border-slate-200 flex items-center justify-center text-slate-600"><ImageIcon size={16} /></div>
        )}
        <input type="file" accept="image/*" onChange={handleFile} className="text-[11px] text-slate-500 max-w-[160px]" />
        {uploading && <span className="text-[11px] text-slate-500">enviando...</span>}
      </div>
      <input className="fw-input" placeholder="ou cole o link de uma foto (https://...)" value={value || ''} onChange={e => onChange(e.target.value)} />
      {error && <span className="text-[11px] text-red-600">{error}</span>}
    </div>
  );
}

function MultiPhotoUploader({ sb, photos, onChange }) {
  const arr = photos || [];
  const setAt = (i, url) => {
    const next = [...arr];
    if (url) next[i] = url; else next.splice(i, 1);
    onChange(next.filter(Boolean));
  };
  return (
    <div className="flex flex-col gap-2">
      {arr.map((url, i) => (
        <div key={i} className="flex items-center gap-2">
          <div className="flex-1"><PhotoUploader sb={sb} value={url} onChange={u => setAt(i, u)} /></div>
          <button type="button" onClick={() => setAt(i, '')} className="fw-btn-ghost"><X size={12} /></button>
        </div>
      ))}
      {arr.length < 5 && (
        <PhotoUploader sb={sb} value="" onChange={u => onChange([...arr, u].filter(Boolean))} />
      )}
      <div className="text-[11px] text-slate-400">{arr.length}/5 fotos</div>
    </div>
  );
}

const EMPTY_PRODUCT_FORM = { name: '', category: '', cost: '', retail: '', wholesale: '', minStock: 3, colors: '', sizes: '', photos: [], description: '', notes: '', subtitle: '', aromaNotes: '', family: '', intensity: '', burnTime: '', usage: '', story: '', warning: '', phrase: '', featured: false };

function ProductsTab({ sb, products, onAdd, onUpdate, onDelete }) {
  const [form, setForm] = useState(EMPTY_PRODUCT_FORM);
  const [editingId, setEditingId] = useState(null);

  const startEdit = (p) => {
    setEditingId(p.id);
    setForm({
      name: p.name, category: p.category, cost: p.cost, retail: p.retail, wholesale: p.wholesale,
      minStock: p.minStock, colors: [...new Set(p.variants.map(v => v.color))].join(', '),
      sizes: [...new Set(p.variants.map(v => v.size))].filter(s => s !== SINGLE_SIZE).join(', '),
      photos: p.photos || [], description: p.description || '', notes: p.notes || '',
      subtitle: p.subtitle || '', aromaNotes: p.aromaNotes || '', family: p.family || '', intensity: p.intensity || '', burnTime: p.burnTime || '', usage: p.usage || '', story: p.story || '', warning: p.warning || '', phrase: p.phrase || '', featured: !!p.featured,
    });
  };
  const cancelEdit = () => { setEditingId(null); setForm(EMPTY_PRODUCT_FORM); };


  const submit = (e) => {
    e.preventDefault();
    if (!form.name.trim()) return;
    const colors = form.colors.split(',').map(c => c.trim()).filter(Boolean);
    if (colors.length === 0) colors.push('Sem aroma');
    const sizes = [...new Set(String(form.sizes || '').split(',').map(s => s.trim()).filter(Boolean))];
    if (sizes.length === 0) sizes.push(SINGLE_SIZE);

    const patch = {
      name: form.name, category: form.category || 'Geral',
      cost: Number(form.cost) || 0, retail: Number(form.retail) || 0, wholesale: Number(form.wholesale) || 0,
      minStock: Number(form.minStock) || 3, photos: form.photos || [],
      description: form.description || '', notes: form.notes || '',
      subtitle: form.subtitle || '', aromaNotes: form.aromaNotes || '', family: form.family || '', intensity: Number(form.intensity) || 0,
      burnTime: form.burnTime || '', usage: form.usage || '', story: form.story || '', warning: form.warning || '', phrase: form.phrase || '', featured: !!form.featured,
    };

    if (editingId) {
      // Preserva o estoque já lançado para aromas/tamanhos que continuam existindo;
      // só zera estoque para aromas/tamanhos novos adicionados na edição.
      const current = products.find(p => p.id === editingId);
      const existingVariants = (current && current.variants) || [];
      const variants = colors.flatMap(color => sizes.map(size => {
        const found = existingVariants.find(v => v.color === color && v.size === size);
        return found || { color, size, stock: 0 };
      }));
      onUpdate(editingId, { ...patch, variants });
      cancelEdit();
    } else {
      const variants = colors.flatMap(color => sizes.map(size => ({ color, size, stock: 0 })));
      onAdd({ id: uid('prod'), ...patch, variants });
      setForm(EMPTY_PRODUCT_FORM);
    }
  };

  return (

// Reduz a foto no próprio aparelho antes de enviar (fotos de celular costumam ter vários MB).
async function shrinkImage(file, maxSide = 1800, quality = 0.82) {
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
    return blob || file;
  } catch (e) { return file; }
}

function BannerManager({ sb, banners, onChange }) {
  const [uploading, setUploading] = useState(false);
  const [error, setError] = useState('');
  const list = banners || [];
  const MAX = 8;
  const addFiles = async (e) => {
    const files = [...e.target.files].slice(0, MAX - list.length);
    e.target.value = '';
    if (!files.length) return;
    setError(''); setUploading(true);
    const added = [];
    try {
      for (const f of files) {
        const blob = await shrinkImage(f);
        const path = `banner_${uid('b')}.jpg`;
        const { error: upErr } = await sb.storage.from('product-photos').upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
        if (upErr) throw upErr;
        added.push({ url: sb.storage.from('product-photos').getPublicUrl(path).data.publicUrl });
      }
    } catch (err) {
      setError('Erro ao enviar: ' + (err.message || 'tente novamente'));
    } finally {
      if (added.length) onChange([...list, ...added]);
      setUploading(false);
    }
  };
  const move = (i, d) => { const n = [...list]; const j = i + d; if (j < 0 || j >= n.length) return; [n[i], n[j]] = [n[j], n[i]]; onChange(n); };
  const remove = (i) => onChange(list.filter((_, k) => k !== i));
  return (
    <div className="bg-white border border-slate-200 rounded-xl p-4">
      <p className="text-[13px] text-slate-600 mb-3 leading-relaxed">
        Essas fotos passam no banner principal do catálogo, na ordem abaixo. Prefira fotos com o produto no centro.
        Se não houver nenhuma, o catálogo usa as fotos-padrão da Seiva. Depois de mudar, clique em <strong>Publicar catálogo agora</strong>.
      </p>
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
        {list.map((b, i) => (
          <div key={b.url + i} className="relative rounded-lg overflow-hidden border border-slate-200" style={{ aspectRatio: '4 / 3', background: '#EFE6D2' }}>
            <img src={b.url} alt="" className="w-full h-full object-cover" />
            <span className="absolute top-1.5 left-1.5 fw-mono text-[11px] font-semibold px-2 py-0.5 rounded-full" style={{ background: '#656149', color: '#fff' }}>{i + 1}</span>
            <div className="absolute bottom-0 left-0 right-0 flex justify-between p-1.5" style={{ background: 'linear-gradient(transparent, rgba(30,29,26,0.55))' }}>
              <div className="flex gap-1">
                <button type="button" onClick={() => move(i, -1)} disabled={i === 0} className="banner-ctl" aria-label="Mover para a esquerda">‹</button>
                <button type="button" onClick={() => move(i, 1)} disabled={i === list.length - 1} className="banner-ctl" aria-label="Mover para a direita">›</button>
              </div>
              <button type="button" onClick={() => remove(i)} className="banner-ctl" aria-label="Remover"><X size={14} /></button>
            </div>
          </div>
        ))}
        {list.length < MAX && (
          <label className="rounded-lg border-2 border-dashed flex flex-col items-center justify-center gap-1 cursor-pointer text-[12px] text-center px-2" style={{ aspectRatio: '4 / 3', borderColor: '#E4D9C4', color: '#6E6558' }}>
            <input type="file" accept="image/*" multiple className="hidden" onChange={addFiles} disabled={uploading} />
            {uploading ? 'Enviando...' : <><Plus size={20} /><span>Adicionar fotos</span></>}
          </label>
        )}
      </div>
      {error && <div className="text-[12px] text-red-700 mt-2">{error}</div>}
      <div className="text-[11px] text-slate-400 mt-2">{list.length}/{MAX} fotos</div>
    </div>
  );
}

function MusicManager({ sb, settings, onChange }) {
  const [uploading, setUploading] = useState(false);
  const [error, setError] = useState('');
  const custom = settings.musicUrl || '';
  const off = !!settings.musicOff;
  const current = custom || 'musica.mp3';
  const previewSrc = custom || new URL('../musica.mp3', window.location.href.split('#')[0]).toString();
  const pick = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    setError('');
    if (!/^audio\//.test(f.type) && !/\.(mp3|m4a|aac|ogg|wav)$/i.test(f.name)) { setError('Escolha um arquivo de áudio (de preferência MP3).'); return; }
    if (f.size > 15 * 1024 * 1024) { setError('Arquivo muito grande (' + (f.size / 1048576).toFixed(1) + ' MB). Use uma música de até 15 MB — o ideal é até 5 MB, para carregar rápido no celular.'); return; }
    setUploading(true);
    try {
      const ext = (f.name.split('.').pop() || 'mp3').toLowerCase();
      const path = `musica_${uid('m')}.${ext}`;
      const { error: upErr } = await sb.storage.from('product-photos').upload(path, f, { upsert: true, contentType: f.type || 'audio/mpeg' });
      if (upErr) throw upErr;
      const url = sb.storage.from('product-photos').getPublicUrl(path).data.publicUrl;
      onChange({ musicUrl: url, musicName: f.name, musicOff: false });
    } catch (err) {
      setError('Erro ao enviar: ' + (err.message || 'tente novamente'));
    } finally { setUploading(false); }
  };
  return (
    <div className="bg-white border border-slate-200 rounded-xl p-4">
      <p className="text-[13px] text-slate-600 mb-3 leading-relaxed">
        A música toca baixinho no catálogo a partir do primeiro toque do cliente na página. Use uma faixa calma, em MP3, liberada para uso comercial.
        Depois de mudar, clique em <strong>Publicar catálogo agora</strong> — a música antiga é apagada do Supabase automaticamente.
      </p>
      <div className="flex flex-col sm:flex-row sm:items-center gap-3 p-3 rounded-lg mb-3" style={{ background: '#F7F2E8', border: '1px solid #EFE6D2' }}>
        <div className="min-w-0 flex-1">
          <div className="text-[11px] uppercase tracking-wide text-slate-500">{off ? 'Música desligada' : 'Tocando no catálogo'}</div>
          <div className="text-[14px] font-medium text-slate-800 truncate">{off ? '—' : (custom ? (settings.musicName || 'Música enviada') : 'Música padrão (musica.mp3)')}</div>
        </div>
        {!off && <audio controls preload="none" src={previewSrc} className="w-full sm:w-64" style={{ height: '40px' }} />}
      </div>
      <div className="flex flex-wrap gap-2">
        <label className="fw-btn cursor-pointer" style={uploading ? { opacity: 0.6 } : {}}>
          <input type="file" accept="audio/*,.mp3" className="hidden" onChange={pick} disabled={uploading} />
          {uploading ? 'Enviando...' : 'Trocar música'}
        </label>
        {custom && !off && <button type="button" className="fw-btn-ghost" onClick={() => onChange({ musicUrl: '', musicName: '' })}>Voltar para a música padrão</button>}
        <button type="button" className="fw-btn-ghost" onClick={() => onChange({ musicOff: !off })}>{off ? 'Ligar música' : 'Desligar música do catálogo'}</button>

function CouponsTab({ sb }) {

  const [editingId, setEditingId] = useState(null);
  const [error, setError] = useState('');

    try {
      const { data, error } = await sb.from('coupons').select('*').eq('user_id', SHARED_STORE_ID).order('created_at', { ascending: false });
      if (error) throw error;
      setCoupons(data || []);
    } catch (e) {
      console.error('Erro ao carregar cupons:', e);
      setCoupons([]);
    }
  };

  useEffect(() => { load(); }, []);

  const startEdit = (c) => {
    setEditingId(c.id);
    setForm({
      code: c.code, discount_type: c.discount_type, discount_value: c.discount_value,
      valid_until: c.valid_until || '', max_uses: c.max_uses ?? '',
    });
  };
  const cancelEdit = () => { setEditingId(null); setForm(EMPTY_COUPON_FORM); };

  const submit = async (e) => {
    e.preventDefault();
    setError('');
    if (!form.code.trim() || form.discount_value === '') return;
    const payload = {
      code: form.code.trim().toUpperCase(),
      discount_type: form.discount_type,

        if (error) throw error;
      } else {
        const { error } = await sb.from('coupons').insert({ ...payload, user_id: SHARED_STORE_ID, active: true, current_uses: 0 });

            <select className="fw-input" value={form.discount_type} onChange={e => setForm(f => ({ ...f, discount_type: e.target.value }))}>
              <option value="percent">Percentual (%)</option>
              <option value="fixed">Valor fixo (R$)</option>
            </select>
          </Field>
          <Field label={form.discount_type === 'percent' ? 'Percentual de desconto' : 'Valor de desconto (R$)'}>
            <input type="number" step="0.01" className="fw-input" value={form.discount_value} onChange={e => setForm(f => ({ ...f, discount_value: e.target.value }))} />
          </Field>
          <Field label="Validade (opcional)"><input type="date" className="fw-input" value={form.valid_until} onChange={e => setForm(f => ({ ...f, valid_until: e.target.value }))} /></Field>
          <Field label="Quantidade máxima de usos (opcional)"><input type="number" min="1" className="fw-input" value={form.max_uses} onChange={e => setForm(f => ({ ...f, max_uses: e.target.value }))} placeholder="Deixe em branco para ilimitado" /></Field>

        </form>
      </Section>

      <div className="bg-white border border-slate-200 overflow-x-auto">
        <table className="w-full fw-table">
          <thead><tr><th>Cupom</th><th>Cadastro</th><th>Validade</th><th>Desconto</th><th>Usos</th><th>Status</th><th></th></tr></thead>

// Campo de quantidade fácil de digitar: teclado numérico, seleciona tudo ao tocar,
// aceita apagar e digitar de novo, salva ao sair do campo ou no Enter, e tem botões − / + grandes.
function QtyField({ value, onCommit, low = false, label }) {
  const [text, setText] = useState(String(value ?? 0));
  const [focused, setFocused] = useState(false);
  useEffect(() => { if (!focused) setText(String(value ?? 0)); }, [value, focused]);
  const commit = (raw) => {
    const n = Math.max(0, parseInt(String(raw).replace(/\D/g, ''), 10) || 0);
    setText(String(n));
    if (n !== Number(value)) onCommit(n);
  };
  const bump = (d) => { const n = Math.max(0, (parseInt(text, 10) || 0) + d); setText(String(n)); onCommit(n); };
  return (
    <div className={`qty-field ${low ? 'is-low' : ''} ${focused ? 'is-focused' : ''}`}>
      <button type="button" className="qty-step" onClick={() => bump(-1)} aria-label={`Diminuir ${label || ''}`} disabled={(parseInt(text, 10) || 0) <= 0}>−</button>
      <input
        className="qty-input" type="text" inputMode="numeric" pattern="[0-9]*" enterKeyHint="next"
        aria-label={label} value={text}
        onFocus={e => { setFocused(true); const t = e.target; setTimeout(() => t.select(), 0); }}
        onChange={e => setText(e.target.value.replace(/\D/g, '').slice(0, 5))}
        onBlur={() => { setFocused(false); commit(text); }}
        onKeyDown={e => {
          if (e.key === 'Enter') {
            e.preventDefault(); commit(text);
            const all = [...document.querySelectorAll('.qty-input')];
            const next = all[all.indexOf(e.target) + 1];
            if (next) next.focus(); else e.target.blur();
          } else if (e.key === 'ArrowUp') { e.preventDefault(); bump(1); }
          else if (e.key === 'ArrowDown') { e.preventDefault(); bump(-1); }
        }}
      />
      <button type="button" className="qty-step" onClick={() => bump(1)} aria-label={`Aumentar ${label || ''}`}>+</button>
    </div>
  );
}

function StockTab({ products, onSetStock, onUpdateProduct }) {
  const [query, setQuery] = useState('');
  const [onlyLow, setOnlyLow] = useState(false);
  const q = query.trim().toLowerCase();
  const isLow = (p, v) => v.stock <= (p.minStock ?? 3);
  const visible = products
    .map(p => ({
      p,
      variants: p.variants.filter(v =>
        (!onlyLow || isLow(p, v)) &&
        (!q || p.name.toLowerCase().includes(q) || String(v.color).toLowerCase().includes(q) || String(v.size).toLowerCase().includes(q))),
    }))
    .filter(x => x.variants.length > 0);
  const lowCount = products.reduce((n, p) => n + p.variants.filter(v => isLow(p, v)).length, 0);
  return (
    <div>
      <Section title="Controle de estoque">
        {products.length === 0 && <div className="text-slate-400 text-sm">Cadastre produtos primeiro na aba Produtos.</div>}
        {products.length > 0 && (
          <div className="flex flex-col sm:flex-row sm:items-center gap-2 mb-4">
            <input className="fw-input sm:max-w-xs" placeholder="Buscar produto ou aroma" value={query} onChange={e => setQuery(e.target.value)} />
            <button type="button" onClick={() => setOnlyLow(v => !v)} className="fw-btn-ghost" style={onlyLow ? { borderColor: '#DC2626', color: '#B91C1C', background: '#FEF2F2' } : {}}>
              {onlyLow ? '✓ ' : ''}Só estoque baixo ({lowCount})
            </button>
          </div>
        )}
        <p className="text-[12px] text-slate-500 mb-3">Toque no número para digitar, ou use − e +. Salva sozinho.<span className="hidden md:inline"> Enter passa para o próximo item.</span></p>
        {visible.length === 0 && products.length > 0 && <div className="text-slate-400 text-sm py-6 text-center">Nenhum item encontrado.</div>}
        {visible.map(({ p, variants }) => (
          <div key={p.id} className="bg-white border border-slate-200 rounded-xl mb-3 overflow-hidden">
            <div className="flex flex-wrap items-center justify-between gap-3 px-4 py-3" style={{ borderBottom: '1px solid #EFE6D2' }}>
              <div className="fw-display text-[20px] font-semibold leading-tight" style={{ color: '#1E1D1A' }}>{p.name}</div>
              <div className="flex items-center gap-2 text-[12px] text-slate-500">
                Estoque mínimo
                <QtyField value={p.minStock ?? 3} label={`estoque mínimo de ${p.name}`} onCommit={n => onUpdateProduct(p.id, { minStock: n })} />
              </div>
            </div>
            {variants.map(v => {
              const low = isLow(p, v);
              return (
                <div key={v.color + '|' + v.size} className="stock-row flex items-center justify-between gap-3 px-4 py-2.5">
                  <div className="min-w-0">
                    <div className="text-[14px] font-medium text-slate-800 truncate">{v.color}</div>
                    <div className="text-[12px] text-slate-500 flex items-center gap-2">
                      {v.size !== SINGLE_SIZE && <span>{v.size}</span>}
                      {low && <span className="fw-mono text-[10.5px] font-semibold px-1.5 py-0.5 rounded" style={{ background: '#FEF2F2', color: '#B91C1C' }}>{v.stock === 0 ? 'Esgotado' : 'Estoque baixo'}</span>}
                    </div>
                  </div>
                  <QtyField value={v.stock} low={low} label={`estoque de ${p.name} ${v.color} ${v.size}`} onCommit={n => onSetStock(p.id, v.color, v.size, n)} />
                </div>
              );
            })}
          </div>
        ))}
      </Section>
    </div>
  );
}

// ---------- Sales ----------
function SalesTab({ products, clients, sales, onRegister, onDelete }) {
  const [clientId, setClientId] = useState('');
  const [type, setType] = useState('varejo');
  const [date, setDate] = useState(todayISO());
  const [cart, setCart] = useState([]);
  const [pick, setPick] = useState({ productId: '', color: '', size: '', qty: 1 });

  const selectedProduct = products.find(p => p.id === pick.productId);
  const colorsAvail = selectedProduct ? [...new Set(selectedProduct.variants.map(v => v.color))] : [];
  const sizesAvail = selectedProduct && pick.color ? [...new Set(selectedProduct.variants.filter(v => v.color === pick.color).map(v => v.size))] : [];
  const variantAvail = selectedProduct && pick.color ? selectedProduct.variants.find(v => v.color === pick.color && v.size === pick.size) : null;

  const addToCart = () => {
    if (!selectedProduct || !pick.color || !pick.size || !pick.qty) return;
    const price = type === 'atacado' ? selectedProduct.wholesale : selectedProduct.retail;
    setCart(c => [...c, { productId: pick.productId, productName: selectedProduct.name, color: pick.color, size: pick.size, qty: Number(pick.qty), price }]);
    setPick({ productId: '', color: '', size: '', qty: 1 });
  };
  const removeFromCart = (i) => setCart(c => c.filter((_, idx) => idx !== i));
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);

  const submitSale = () => {
    if (cart.length === 0) return;
    const client = clients.find(c => c.id === clientId);
    onRegister({ date, clientId: clientId || null, clientName: client ? client.name : 'Consumidor final', type, items: cart });
    setCart([]);
  };

  return (
    <div>
      <Section title="Registrar venda">
        <div className="bg-white border border-slate-200 p-4 mb-4">
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
            <Field label="Data"><input type="date" className="fw-input" value={date} onChange={e => setDate(e.target.value)} /></Field>
            <Field label="Cliente">
              <select className="fw-input" value={clientId} onChange={e => setClientId(e.target.value)}>
                <option value="">Consumidor final</option>
                {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </Field>
            <Field label="Tipo de venda">
              <select className="fw-input" value={type} onChange={e => setType(e.target.value)}>
                <option value="varejo">Varejo</option><option value="atacado">Atacado</option>
              </select>
            </Field>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 items-end mb-3 border-t border-slate-200 pt-3">
            <Field label="Produto">
              <select className="fw-input" value={pick.productId} onChange={e => setPick({ productId: e.target.value, color: '', size: '', qty: 1 })}>
                <option value="">Selecione</option>
                {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </Field>
            <Field label="Aroma">
              <select className="fw-input" value={pick.color} onChange={e => { const color = e.target.value; const s = selectedProduct ? [...new Set(selectedProduct.variants.filter(v => v.color === color).map(v => v.size))] : []; setPick(p => ({ ...p, color, size: s.length === 1 ? s[0] : '' })); }} disabled={!selectedProduct}>
                <option value="">Selecione</option>
                {colorsAvail.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="Tamanho">
              <select className="fw-input" value={pick.size} onChange={e => setPick(p => ({ ...p, size: e.target.value }))} disabled={!pick.color}>
                <option value="">Selecione</option>
                {sizesAvail.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </Field>
            <Field label={`Qtd ${variantAvail ? `(disp: ${variantAvail.stock})` : ''}`}>
              <input type="number" min="1" className="fw-input" value={pick.qty} onChange={e => setPick(p => ({ ...p, qty: e.target.value }))} />
            </Field>
            <button onClick={addToCart} className="fw-btn justify-center"><Plus size={14} />Adicionar item</button>
          </div>

          {cart.length > 0 && (
            <div className="border-t border-slate-200 pt-3">
              <table className="w-full fw-table">
                <thead><tr><th>Produto</th><th>Aroma</th><th>Tam.</th><th>Qtd</th><th>Preço unit.</th><th>Subtotal</th><th></th></tr></thead>
                <tbody>
                  {cart.map((i, idx) => (
                    <tr key={idx}>
                      <td>{i.productName}</td><td>{i.color}</td><td>{i.size}</td><td>{i.qty}</td>
                      <td>{formatBRL(i.price)}</td><td>{formatBRL(i.price * i.qty)}</td>
                      <td><button onClick={() => removeFromCart(idx)} className="fw-btn-ghost"><X size={12} /></button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div className="flex items-center justify-between mt-3">
                <div className="fw-mono text-slate-900 font-semibold text-lg">Total: {formatBRL(total)}</div>
                <button onClick={submitSale} className="fw-btn"><Check size={14} />Finalizar venda</button>
              </div>
            </div>
          )}
        </div>
      </Section>

      <Section title="Histórico de vendas">
        <div className="bg-white border border-slate-200 overflow-x-auto">
          <table className="w-full fw-table">
            <thead><tr><th>Data</th><th>Cliente</th><th>Tipo</th><th>Total</th><th>Lucro</th><th></th></tr></thead>
            <tbody>
              {sales.length === 0 && <tr><td colSpan={6} className="text-slate-400 text-center py-6">Nenhuma venda registrada.</td></tr>}
              {[...sales].reverse().map(s => (
                <tr key={s.id}>
                  <td>{s.date}</td><td>{s.clientName}</td><td className="capitalize">{s.type}</td>
                  <td>{formatBRL(s.total)}</td>
                  <td className={s.profit >= 0 ? 'text-green-600' : 'text-red-600'}>{formatBRL(s.profit)}</td>
                  <td><button onClick={() => onDelete(s.id)} className="fw-btn-ghost"><Trash2 size={13} /></button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Section>
    </div>
  );
}

// ---------- Pricing calculator ----------
function PricingTab({ products, costs, margin, onAddCost, onDeleteCost, onSetMargin, onApplyPrice }) {
  const [productId, setProductId] = useState('');
  const [manualCost, setManualCost] = useState('');
  const [form, setForm] = useState({ name: '', type: 'fixo', value: '' });

  const product = products.find(p => p.id === productId);
  const baseCost = productId ? (manualCost !== '' ? Number(manualCost) : (product ? product.cost : 0)) : Number(manualCost) || 0;

  const fixedItems = costs.filter(c => c.type === 'fixo');
  const percentItems = costs.filter(c => c.type === 'percentual');
  const marginNum = Number(margin) || 0;

  const totalFixed = baseCost + fixedItems.reduce((s, c) => s + Number(c.value), 0);
  const totalPercent = percentItems.reduce((s, c) => s + Number(c.value), 0) + marginNum;
  const invalid = totalPercent >= 100;
  const suggestedPrice = invalid ? null : totalFixed / (1 - totalPercent / 100);

  const submitCost = (e) => {
    e.preventDefault();
    if (!form.name.trim() || form.value === '') return;
    onAddCost({ name: form.name, type: form.type, value: Number(form.value) });
    setForm({ name: '', type: 'fixo', value: '' });
  };

  return (
    <div>
      <Section title="Custos cadastrados">
        <form onSubmit={submitCost} className="bg-white border border-slate-200 p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
          <Field label="Nome do custo"><input className="fw-input" value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} placeholder="Frete, embalagem, taxa cartão..." /></Field>
          <Field label="Tipo">
            <select className="fw-input" value={form.type} onChange={e => setForm(f => ({ ...f, type: e.target.value }))}>
              <option value="fixo">Valor fixo (R$)</option>
              <option value="percentual">Percentual (%) do preço</option>
            </select>
          </Field>
          <Field label={form.type === 'fixo' ? 'Valor (R$)' : 'Percentual (%)'}>
            <input type="number" step="0.01" className="fw-input" value={form.value} onChange={e => setForm(f => ({ ...f, value: e.target.value }))} />
          </Field>
          <div className="flex items-end"><button className="fw-btn" type="submit"><Plus size={14} />Adicionar custo</button></div>
        </form>
        <div className="bg-white border border-slate-200 overflow-x-auto">
          <table className="w-full fw-table">
            <thead><tr><th>Custo</th><th>Tipo</th><th>Valor</th><th></th></tr></thead>
            <tbody>
              {costs.length === 0 && <tr><td colSpan={4} className="text-slate-400 text-center py-6">Nenhum custo cadastrado ainda.</td></tr>}
              {costs.map(c => (
                <tr key={c.id}>
                  <td className="text-slate-900">{c.name}</td>
                  <td>{c.type === 'fixo' ? 'Valor fixo' : 'Percentual do preço'}</td>
                  <td>{c.type === 'fixo' ? formatBRL(c.value) : `${c.value}%`}</td>
                  <td><button onClick={() => onDeleteCost(c.id)} className="fw-btn-ghost"><Trash2 size={13} /></button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Section>

      <Section title="Calcular preço de venda">
        <div className="bg-white border border-slate-200 p-4 mb-4">
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mb-4">
            <Field label="Produto (opcional — preenche o custo automaticamente)">
              <select className="fw-input" value={productId} onChange={e => { setProductId(e.target.value); setManualCost(''); }}>
                <option value="">Nenhum — inserir custo manualmente</option>
                {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </Field>
            <Field label="Custo do produto (R$)">
              <input type="number" step="0.01" className="fw-input"
                value={manualCost !== '' ? manualCost : (product ? product.cost : '')}
                onChange={e => setManualCost(e.target.value)} />
            </Field>
            <Field label="Margem de lucro desejada (%)">
              <input type="number" step="0.01" className="fw-input" value={margin} onChange={e => onSetMargin(e.target.value === '' ? '' : Number(e.target.value))} />
            </Field>
          </div>

          {invalid ? (
            <div className="text-[13px] text-red-700 bg-red-50 border border-red-200 rounded-lg p-3">
              ⚠ Os percentuais cadastrados (custos + margem) somam {totalPercent.toFixed(1)}%, que é igual ou maior que 100%.
              Não existe preço possível nessas condições — reduza a margem ou os custos percentuais.
            </div>
          ) : (
            <div>
              <div className="flex flex-wrap gap-4 mb-4">
                <StatCard label="Preço de venda sugerido" value={formatBRL(suggestedPrice)} />
                <StatCard label="Custos totais (R$)" value={formatBRL(totalFixed + percentItems.reduce((s, c) => s + suggestedPrice * (Number(c.value) / 100), 0))} />
                <StatCard label="Lucro líquido estimado" value={formatBRL(suggestedPrice * (marginNum / 100))} sub={`${marginNum}% do preço`} />
              </div>

              <div className="bg-white border border-slate-200 p-4 mb-4">
                <div className="text-sm font-semibold text-slate-700 mb-3">Como esse preço se decompõe</div>
                <table className="w-full fw-table">
                  <thead><tr><th>Item</th><th>Tipo</th><th>Valor em R$ no preço final</th></tr></thead>
                  <tbody>
                    <tr><td>Custo do produto + custos fixos</td><td>Fixo</td><td>{formatBRL(totalFixed)}</td></tr>
                    {percentItems.map(c => (
                      <tr key={c.id}><td>{c.name}</td><td>{c.value}%</td><td>{formatBRL(suggestedPrice * (Number(c.value) / 100))}</td></tr>
                    ))}
                    <tr><td className="font-semibold text-slate-900">Margem de lucro</td><td>{marginNum}%</td><td className="font-semibold text-slate-900">{formatBRL(suggestedPrice * (marginNum / 100))}</td></tr>
                  </tbody>
                </table>
              </div>

              {product && (
                <div className="flex gap-3">
                  <button onClick={() => onApplyPrice(product.id, 'retail', suggestedPrice)} className="fw-btn"><Check size={14} />Aplicar como preço de varejo</button>
                  <button onClick={() => onApplyPrice(product.id, 'wholesale', suggestedPrice)} className="fw-btn-ghost"><Check size={14} />Aplicar como preço de atacado</button>
                </div>
              )}
            </div>
          )}
        </div>
      </Section>
    </div>
  );
}

// ---------- Finance ----------
function FinanceTab({ finance, onAdd, onDelete, cashFlow }) {
  const [form, setForm] = useState({ date: todayISO(), type: 'entrada', category: '', desc: '', value: '' });

    e.preventDefault();
    if (!form.value || !form.desc.trim()) return;
    onAdd({ ...form, value: Number(form.value) });
    setForm({ date: todayISO(), type: 'entrada', category: '', desc: '', value: '' });
  };
  const balance = finance.reduce((s, f) => s + (f.type === 'entrada' ? f.value : -f.value), 0);
  const totalIn = finance.filter(f => f.type === 'entrada').reduce((s, f) => s + f.value, 0);
  const totalOut = finance.filter(f => f.type === 'saida').reduce((s, f) => s + f.value, 0);

  return (
    <div>
      <Section title="Entradas e saídas financeiras">
        <div className="flex flex-wrap gap-4 mb-4">
          <StatCard label="Total de entradas" value={formatBRL(totalIn)} />
          <StatCard label="Total de saídas" value={formatBRL(totalOut)} />
          <StatCard label="Saldo em caixa" value={formatBRL(balance)} alert={balance < 0} />
        </div>
        <form onSubmit={submit} className="bg-white border border-slate-200 p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 mb-4">
          <Field label="Data"><input type="date" className="fw-input" value={form.date} onChange={e => setForm(f => ({ ...f, date: e.target.value }))} /></Field>
          <Field label="Tipo">

          <Field label="Descrição"><input className="fw-input" value={form.desc} onChange={e => setForm(f => ({ ...f, desc: e.target.value }))} /></Field>

            <ResponsiveContainer width="100%" height="100%">
