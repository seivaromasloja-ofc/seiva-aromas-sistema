const MONTHS = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function uid(prefix = 'id') {
  return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
}
function formatBRL(v) {
  const n = Number(v) || 0;
  return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function monthKey(dateStr) { return (dateStr || '').slice(0, 7); }
function monthLabel(mk) {
  if (!mk) return '';
  const [y, m] = mk.split('-');
  return MONTHS[parseInt(m, 10) - 1] + '/' + y.slice(2);
}
function emptyData() {

const PIE_COLORS = ['#ffffff', '#525252'];

// ---------- App ----------
function App({ sb, session, onSignOut }) {
  const [data, setData] = useState(null);
  const [tab, setTab] = useState('dashboard');
  const [saveState, setSaveState] = useState('idle');
  const [publishState, setPublishState] = useState('idle');

  useEffect(() => {
    (async () => {
      try {
        const { data: row, error } = await sb
          .from('store_data')
          .select('data')
          .eq('user_id', SHARED_STORE_ID)
          .maybeSingle();
        if (error) throw error;
        setData(row && row.data && Object.keys(row.data).length ? { ...emptyData(), ...row.data } : emptyData());
      } catch (e) {
        console.error('Erro ao carregar dados:', e);
        setData(emptyData());
      }
    })();
  }, []);

  useEffect(() => {
    if (data === null) return;
    setSaveState('saving');
    const t = setTimeout(async () => {
      try {
        const { error } = await sb
          .from('store_data')
          .upsert({ user_id: SHARED_STORE_ID, data, updated_at: new Date().toISOString() });
        if (error) throw error;
        setSaveState('saved');
      } catch (e) {
        console.error('Erro ao salvar dados:', e);
        setSaveState('error');
      }
    }, 500);
    return () => clearTimeout(t);
  }, [data]);

  // ---- derived (must run on every render, even while data is still loading) ----
  const safeData = data || emptyData();
  const lowStock = useMemo(() => {
    const list = [];
    safeData.products.forEach(p => {
      p.variants.forEach(v => {
        if (v.stock <= (p.minStock ?? 3)) list.push({ product: p.name, color: v.color, size: v.size, stock: v.stock, min: p.minStock ?? 3, productId: p.id });
      });
    });
    return list;
  }, [safeData.products]);

  const thisMonth = monthKey(todayISO());
  const salesThisMonth = useMemo(() => safeData.sales.filter(s => monthKey(s.date) === thisMonth), [safeData.sales, thisMonth]);
  const revenueThisMonth = salesThisMonth.reduce((s, x) => s + x.total, 0);
  const profitThisMonth = salesThisMonth.reduce((s, x) => s + x.profit, 0);
  const pendingOrders = safeData.orders.filter(o => o.status === 'pendente').length;

  const revenueByMonth = useMemo(() => {
    const map = {};
    safeData.sales.forEach(s => { const mk = monthKey(s.date); map[mk] = (map[mk] || 0) + s.total; });
    return Object.entries(map).sort(([a], [b]) => a.localeCompare(b)).slice(-6).map(([mk, v]) => ({ month: monthLabel(mk), receita: Math.round(v * 100) / 100 }));
  }, [safeData.sales]);

  const salesByType = useMemo(() => {
    const varejo = safeData.sales.filter(s => s.type === 'varejo').reduce((s, x) => s + x.total, 0);
    const atacado = safeData.sales.filter(s => s.type === 'atacado').reduce((s, x) => s + x.total, 0);
    return [{ name: 'Varejo', value: varejo }, { name: 'Atacado', value: atacado }].filter(x => x.value > 0);
  }, [safeData.sales]);

  const cashFlow = useMemo(() => {
    const sorted = [...safeData.finance].sort((a, b) => a.date.localeCompare(b.date));
    let bal = 0;
    return sorted.map(f => { bal += f.type === 'entrada' ? f.value : -f.value; return { date: f.date.slice(5), saldo: Math.round(bal * 100) / 100 }; });
  }, [safeData.finance]);

  const prevMonthKey = (() => {
    const [y, m] = thisMonth.split('-').map(Number);
    const d = new Date(y, m - 2, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  })();
  const salesPrevMonth = useMemo(() => safeData.sales.filter(s => monthKey(s.date) === prevMonthKey), [safeData.sales, prevMonthKey]);
  const revenuePrevMonth = salesPrevMonth.reduce((s, x) => s + x.total, 0);
  const profitPrevMonth = salesPrevMonth.reduce((s, x) => s + x.profit, 0);
  const pctChange = (curr, prev) => (prev ? Math.round(((curr - prev) / Math.abs(prev)) * 100) : null);
  const revenueChangePct = pctChange(revenueThisMonth, revenuePrevMonth);
  const profitChangePct = pctChange(profitThisMonth, profitPrevMonth);

  const salesByCategory = useMemo(() => {
    const map = {};
    safeData.sales.forEach(sale => {
      (sale.items || []).forEach(item => {
        const product = safeData.products.find(p => p.id === item.productId);
        const cat = (product && product.category) || 'Outros';
        map[cat] = (map[cat] || 0) + item.price * item.qty;
      });
    });
    const total = Object.values(map).reduce((a, b) => a + b, 0);
    return Object.entries(map)
      .sort((a, b) => b[1] - a[1]).slice(0, 4)
      .map(([name, value]) => ({ name, value, pct: total ? Math.round((value / total) * 100) : 0 }));
  }, [safeData.sales, safeData.products]);

  const recentSales = useMemo(() => (
    [...safeData.sales].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 4)
  ), [safeData.sales]);

  if (data === null) {
    return (
      <div className="min-h-screen flex items-center justify-center fw-mono text-sm" style={{ backgroundColor: '#0F172A', color: '#94A3B8' }}>
        carregando sistema...
      </div>
    );
  }

  // ---- mutations ----
  const addProduct = (p) => setData(d => ({ ...d, products: [...d.products, p] }));
  const updateProduct = (id, patch) => setData(d => ({ ...d, products: d.products.map(p => p.id === id ? { ...p, ...patch } : p) }));
  const deleteProduct = (id) => setData(d => ({ ...d, products: d.products.filter(p => p.id !== id) }));
  const setVariantStock = (productId, color, size, stock) => setData(d => ({
    ...d,
    products: d.products.map(p => p.id !== productId ? p : {
      ...p, variants: p.variants.map(v => v.color === color && v.size === size ? { ...v, stock: Math.max(0, Number(stock) || 0) } : v)
    })
  }));

  const addClient = (c) => setData(d => ({ ...d, clients: [...d.clients, c] }));
  const deleteClient = (id) => setData(d => ({ ...d, clients: d.clients.filter(c => c.id !== id) }));

  const registerSale = (sale) => {
    setData(d => {
      const products = d.products.map(p => ({ ...p, variants: p.variants.map(v => ({ ...v })) }));
      let costTotal = 0;
      sale.items.forEach(item => {
        const prod = products.find(p => p.id === item.productId);
        if (prod) {
          const variant = prod.variants.find(v => v.color === item.color && v.size === item.size);
          if (variant) variant.stock = Math.max(0, variant.stock - item.qty);
          costTotal += (prod.cost || 0) * item.qty;
        }
      });
      const total = sale.items.reduce((s, i) => s + i.price * i.qty, 0);
      const financeId = uid('fin');
      const client = d.clients.find(c => c.id === sale.clientId);
      const newSale = { ...sale, id: uid('sale'), total, costTotal, profit: total - costTotal, financeId };
      const financeEntry = {
        id: financeId, date: sale.date, type: 'entrada', category: 'venda',
        desc: `Venda${client ? ' - ' + client.name : ''} (${sale.type})`, value: total, auto: true
      };
      return { ...d, products, sales: [...d.sales, newSale], finance: [...d.finance, financeEntry] };
    });
  };
  const deleteSale = (id) => setData(d => {
    const sale = d.sales.find(s => s.id === id);
    if (!sale) return d;
    const products = d.products.map(p => ({ ...p, variants: p.variants.map(v => ({ ...v })) }));
    sale.items.forEach(item => {
      const prod = products.find(p => p.id === item.productId);
      if (prod) {
        const variant = prod.variants.find(v => v.color === item.color && v.size === item.size);
        if (variant) variant.stock += item.qty;
      }
    });
    return { ...d, products, sales: d.sales.filter(s => s.id !== id), finance: d.finance.filter(f => f.id !== sale.financeId) };
  });

  const registerPurchase = (purchase) => {
    setData(d => {
      const products = d.products.map(p => ({ ...p, variants: p.variants.map(v => ({ ...v })) }));
      purchase.items.forEach(item => {
        const prod = products.find(p => p.id === item.productId);
        if (prod) {
          const variant = prod.variants.find(v => v.color === item.color && v.size === item.size);
          if (variant) variant.stock += item.qty;
        }
      });
      const total = purchase.items.reduce((s, i) => s + i.cost * i.qty, 0);
      const financeId = uid('fin');
      const newPurchase = { ...purchase, id: uid('purch'), total, financeId };
      const financeEntry = { id: financeId, date: purchase.date, type: 'saida', category: 'compra', desc: `Compra - ${purchase.supplier}`, value: total, auto: true };
      return { ...d, products, purchases: [...d.purchases, newPurchase], finance: [...d.finance, financeEntry] };
    });
  };
  const deletePurchase = (id) => setData(d => {
    const purchase = d.purchases.find(p => p.id === id);
    if (!purchase) return d;
    const products = d.products.map(p => ({ ...p, variants: p.variants.map(v => ({ ...v })) }));
    purchase.items.forEach(item => {
      const prod = products.find(p => p.id === item.productId);
      if (prod) {
        const variant = prod.variants.find(v => v.color === item.color && v.size === item.size);
        if (variant) variant.stock = Math.max(0, variant.stock - item.qty);
      }
    });
    return { ...d, products, purchases: d.purchases.filter(p => p.id !== id), finance: d.finance.filter(f => f.id !== purchase.financeId) };
  });

  const addFinance = (entry) => setData(d => ({ ...d, finance: [...d.finance, { ...entry, id: uid('fin'), auto: false }] }));
  const deleteFinance = (id) => setData(d => ({ ...d, finance: d.finance.filter(f => f.id !== id) }));

  const addOrder = (order) => setData(d => ({ ...d, orders: [...d.orders, { ...order, id: uid('order') }] }));
  const updateOrderStatus = (id, status) => setData(d => ({ ...d, orders: d.orders.map(o => o.id === id ? { ...o, status } : o) }));
  const deleteOrder = (id) => setData(d => ({ ...d, orders: d.orders.filter(o => o.id !== id) }));

  const addPricingCost = (cost) => setData(d => ({ ...d, pricingCosts: [...d.pricingCosts, { ...cost, id: uid('cost') }] }));
  const deletePricingCost = (id) => setData(d => ({ ...d, pricingCosts: d.pricingCosts.filter(c => c.id !== id) }));
  const setPricingMargin = (value) => setData(d => ({ ...d, pricingMargin: value }));
  const applyPrice = (productId, field, price) => updateProduct(productId, { [field]: Math.round(price * 100) / 100 });

  const updateCatalogSettings = (patch) => setData(d => ({ ...d, catalogSettings: { ...d.catalogSettings, ...patch } }));
  const publishCatalog = async () => {
    setPublishState('publishing');
    try {
      const snapshot = data.products.map(p => ({
        id: p.id, name: p.name, category: p.category,
        photos: p.photos || [], price: p.retail || 0,
        description: p.description || '', notes: p.notes || '',
        variants: (p.variants || []).map(v => ({ color: v.color, size: v.size, inStock: v.stock > 0 })),
      }));
      const { error } = await sb.from('catalog_public').upsert({
        user_id: SHARED_STORE_ID,
        whatsapp_number: (data.catalogSettings && data.catalogSettings.whatsappNumber) || '',
        store_name: (data.catalogSettings && data.catalogSettings.storeName) || 'Minha Loja',
        logo_url: (data.catalogSettings && data.catalogSettings.logoUrl) || '',
        tagline: (data.catalogSettings && data.catalogSettings.tagline) || '',
        welcome_message: (data.catalogSettings && data.catalogSettings.welcomeMessage) || '',
        products: snapshot,
        updated_at: new Date().toISOString(),
      });
      if (error) throw error;
      setPublishState('published');
    } catch (e) {
      console.error('Erro ao publicar cat\u00e1logo:', e);
      setPublishState('error');
    }
  };

  // ---- derived (moved above the loading-state early return, see top of App) ----

  return (
    <div className="min-h-screen fw-body flex" style={{ backgroundColor: '#F7F8FB' }}>
      <Fonts />
      {/* Sidebar */}
      <aside className="w-56 shrink-0 flex flex-col" style={{ backgroundColor: '#0F172A' }}>
        <div className="px-4 py-5 flex items-center gap-2">
          {data.catalogSettings && data.catalogSettings.logoUrl ? (
            <img src={data.catalogSettings.logoUrl} alt={data.catalogSettings.storeName || 'Logo'} className="h-7 w-auto" />
          ) : (
            <BrandMark variant="dark" height="h-6" fontSize={17} />
          )}
        </div>
        <nav className="flex-1 py-2 px-2.5 flex flex-col gap-0.5">
          {NAV.map(item => {
            const Icon = item.icon;
            const active = tab === item.key;
            return (
              <button
                key={item.key}
                onClick={() => setTab(item.key)}
                className="w-full flex items-center gap-2.5 px-2.5 py-2 text-[13px] rounded-lg transition-colors"
                style={active
                  ? { backgroundColor: '#6C5BFF', color: '#ffffff', fontWeight: 500 }
                  : { color: '#94A3B8' }}
              >
                <Icon size={15} />
                {item.label}
                {item.key === 'stock' && lowStock.length > 0 && !active && (
                  <span className="ml-auto fw-mono text-[10px] px-1.5 rounded-full font-semibold" style={{ backgroundColor: '#EF4444', color: '#fff' }}>{lowStock.length}</span>
                )}
                {item.key === 'orders' && pendingOrders > 0 && !active && (
                  <span className="ml-auto fw-mono text-[10px] px-1.5 rounded-full font-semibold" style={{ backgroundColor: '#EF4444', color: '#fff' }}>{pendingOrders}</span>
                )}
              </button>
            );
          })}
        </nav>
        <div className="px-3 py-3" style={{ borderTop: '1px solid rgba(255,255,255,0.08)' }}>
          <div className="fw-mono text-[10px] mb-2" style={{ color: '#475569' }}>
            {saveState === 'saving' ? 'salvando...' : saveState === 'error' ? 'erro ao salvar' : 'dados salvos'}
          </div>
          <div className="flex items-center gap-2">
            <div className="rounded-full flex items-center justify-center shrink-0" style={{ width: '26px', height: '26px', backgroundColor: '#6C5BFF', color: '#fff', fontSize: '11px', fontWeight: 600 }}>
              {(session.user.email || '?')[0].toUpperCase()}
            </div>
            <div className="min-w-0 flex-1">
              <div className="text-[11px] text-white truncate" title={session.user.email}>{session.user.email}</div>
              <button onClick={onSignOut} className="text-[10.5px] hover:text-slate-900" style={{ color: '#64748B' }}>Sair</button>
            </div>
          </div>
        </div>
      </aside>

      {/* Main */}
      <main className="flex-1 p-8 max-w-6xl">
        {tab === 'dashboard' && (
          <DashboardTab
            revenueThisMonth={revenueThisMonth} profitThisMonth={profitThisMonth}
            pendingOrders={pendingOrders} lowStock={lowStock}
            revenueByMonth={revenueByMonth} salesByType={salesByType}
            revenueChangePct={revenueChangePct} profitChangePct={profitChangePct}
            salesByCategory={salesByCategory} recentSales={recentSales}
            totalProducts={data.products.length}
          />
        )}
        {tab === 'products' && (
          <ProductsTab sb={sb} products={data.products} onAdd={addProduct} onUpdate={updateProduct} onDelete={deleteProduct} />
        )}
        {tab === 'clients' && (
          <ClientsTab clients={data.clients} onAdd={addClient} onDelete={deleteClient} />
        )}
        {tab === 'stock' && (
          <StockTab products={data.products} onSetStock={setVariantStock} onUpdateProduct={updateProduct} />
        )}
        {tab === 'sales' && (
          <SalesTab products={data.products} clients={data.clients} sales={data.sales} onRegister={registerSale} onDelete={deleteSale} />
        )}
        {tab === 'purchases' && (
          <PurchasesTab products={data.products} purchases={data.purchases} onRegister={registerPurchase} onDelete={deletePurchase} />
        )}
        {tab === 'pricing' && (
          <PricingTab
            products={data.products}
            costs={data.pricingCosts}
            margin={data.pricingMargin}
            onAddCost={addPricingCost}
            onDeleteCost={deletePricingCost}
            onSetMargin={setPricingMargin}
            onApplyPrice={applyPrice}
          />
        )}
        {tab === 'finance' && (
          <FinanceTab finance={data.finance} onAdd={addFinance} onDelete={deleteFinance} cashFlow={cashFlow} />
        )}
        {tab === 'expenses' && (
          <ExpensesTab finance={data.finance} sales={data.sales} onAdd={addFinance} onDelete={deleteFinance} />
        )}
        {tab === 'orders' && (
          <OrdersTab products={data.products} clients={data.clients} orders={data.orders} onAdd={addOrder} onUpdateStatus={updateOrderStatus} onDelete={deleteOrder} />
        )}
        {tab === 'catalog' && (
          <CatalogTab
            sb={sb}
            products={data.products}
            settings={data.catalogSettings}
            onSaveSettings={updateCatalogSettings}
            onPublish={publishCatalog}
            publishState={publishState}
          />
        )}
        {tab === 'coupons' && (
          <CouponsTab sb={sb} />
        )}
        {tab === 'reports' && (
          <ReportsTab sales={data.sales} purchases={data.purchases} finance={data.finance} products={data.products} />
        )}
      </main>
    </div>
  );
}

function PhotoUploader({ sb, value, onChange }) {
  const [uploading, setUploading] = useState(false);
  const [error, setError] = useState('');

  const handleFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setError('');
    setUploading(true);
    try {
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${uid('photo')}.${ext}`;
      const { error: upErr } = await sb.storage.from('product-photos').upload(path, file, { upsert: true, contentType: file.type });
      if (upErr) throw upErr;
      const { data } = sb.storage.from('product-photos').getPublicUrl(path);
      onChange(data.publicUrl);
    } catch (err) {
      setError('Erro ao enviar: ' + (err.message || 'tente novamente'));
    } finally {
      setUploading(false);
    }
  };

  return (
    <div className="flex flex-col gap-2">
      <div className="flex items-center gap-2">
        {value ? (
          <img src={value} alt="" className="w-10 h-10 object-cover rounded border border-slate-200" />
        ) : (
          <div className="w-10 h-10 rounded border border-slate-200 flex items-center justify-center text-slate-600"><ImageIcon size={16} /></div>
        )}
        <input type="file" accept="image/*" onChange={handleFile} className="text-[11px] text-slate-500 max-w-[160px]" />
        {uploading && <span className="text-[11px] text-slate-500">enviando...</span>}
      </div>
      <input className="fw-input" placeholder="ou cole o link de uma foto (https://...)" value={value || ''} onChange={e => onChange(e.target.value)} />
      {error && <span className="text-[11px] text-red-600">{error}</span>}
    </div>
  );
}

function MultiPhotoUploader({ sb, photos, onChange }) {
  const arr = photos || [];
  const setAt = (i, url) => {
    const next = [...arr];
    if (url) next[i] = url; else next.splice(i, 1);
    onChange(next.filter(Boolean));
  };
  return (
    <div className="flex flex-col gap-2">
      {arr.map((url, i) => (
        <div key={i} className="flex items-center gap-2">
          <div className="flex-1"><PhotoUploader sb={sb} value={url} onChange={u => setAt(i, u)} /></div>
          <button type="button" onClick={() => setAt(i, '')} className="fw-btn-ghost"><X size={12} /></button>
        </div>
      ))}
      {arr.length < 3 && (
        <PhotoUploader sb={sb} value="" onChange={u => onChange([...arr, u].filter(Boolean))} />
      )}
      <div className="text-[11px] text-slate-400">{arr.length}/3 fotos</div>
    </div>
  );
}

const EMPTY_PRODUCT_FORM = { name: '', category: '', cost: '', retail: '', wholesale: '', minStock: 3, colors: '', sizes: '', photos: [], description: '', notes: '' };

function ProductsTab({ sb, products, onAdd, onUpdate, onDelete }) {
  const [form, setForm] = useState(EMPTY_PRODUCT_FORM);
  const [editingId, setEditingId] = useState(null);

  const startEdit = (p) => {
    setEditingId(p.id);
    setForm({
      name: p.name, category: p.category, cost: p.cost, retail: p.retail, wholesale: p.wholesale,
      minStock: p.minStock, colors: [...new Set(p.variants.map(v => v.color))].join(', '),
      sizes: [...new Set(p.variants.map(v => v.size))].filter(s => s !== SINGLE_SIZE).join(', '),
      photos: p.photos || [], description: p.description || '', notes: p.notes || '',
    });
  };
  const cancelEdit = () => { setEditingId(null); setForm(EMPTY_PRODUCT_FORM); };


  const submit = (e) => {
    e.preventDefault();
    if (!form.name.trim()) return;
    const colors = form.colors.split(',').map(c => c.trim()).filter(Boolean);
    if (colors.length === 0) colors.push('Sem aroma');
    const sizes = [...new Set(String(form.sizes || '').split(',').map(s => s.trim()).filter(Boolean))];
    if (sizes.length === 0) sizes.push(SINGLE_SIZE);

    const patch = {
      name: form.name, category: form.category || 'Geral',
      cost: Number(form.cost) || 0, retail: Number(form.retail) || 0, wholesale: Number(form.wholesale) || 0,
      minStock: Number(form.minStock) || 3, photos: form.photos || [],
      description: form.description || '', notes: form.notes || '',
    };

    if (editingId) {
      // Preserva o estoque já lançado para aromas/tamanhos que continuam existindo;
      // só zera estoque para aromas/tamanhos novos adicionados na edição.
      const current = products.find(p => p.id === editingId);
      const existingVariants = (current && current.variants) || [];
      const variants = colors.flatMap(color => sizes.map(size => {
        const found = existingVariants.find(v => v.color === color && v.size === size);
        return found || { color, size, stock: 0 };
      }));
      onUpdate(editingId, { ...patch, variants });
      cancelEdit();
    } else {
      const variants = colors.flatMap(color => sizes.map(size => ({ color, size, stock: 0 })));
      onAdd({ id: uid('prod'), ...patch, variants });
      setForm(EMPTY_PRODUCT_FORM);
    }
  };

  return (
    <div>
      <Section title={editingId ? `Editando: ${form.name || 'produto'}` : 'Cadastro de produtos'}>
        {editingId && (
          <div className="text-[12px] text-green-700 bg-green-50 border border-green-200 rounded-lg p-2 mb-3">
            Editando um produto existente. O estoque já lançado para os aromas/tamanhos que continuarem aqui é preservado — só aromas/tamanhos novos começam com estoque zerado.
          </div>
        )}
        <form onSubmit={submit} className="bg-white border border-slate-200 p-4 grid grid-cols-3 gap-3 mb-4">
          <Field label="Nome do produto"><input className="fw-input" value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} placeholder="Vela Lavanda Francesa" /></Field>
          <Field label="Categoria"><input className="fw-input" value={form.category} onChange={e => setForm(f => ({ ...f, category: e.target.value }))} placeholder="Vela em pote, Vela massageadora, Home spray..." /></Field>
          <Field label="Aromas (separados por vírgula)"><input className="fw-input" value={form.colors} onChange={e => setForm(f => ({ ...f, colors: e.target.value }))} placeholder="Lavanda, Baunilha, Capim-limão" /></Field>

// ---------- Catalog (vitrine pública) ----------
function CatalogTab({ sb, products, settings, onSaveSettings, onPublish, publishState }) {
  const [waNumber, setWaNumber] = useState((settings && settings.whatsappNumber) || '');
  const [storeName, setStoreName] = useState((settings && settings.storeName) || '');
  const [logoUrl, setLogoUrl] = useState((settings && settings.logoUrl) || '');
  const [tagline, setTagline] = useState((settings && settings.tagline) || '');
  const [welcomeMessage, setWelcomeMessage] = useState((settings && settings.welcomeMessage) || 'Aproveite nosso catálogo com as últimas novidades.');
  const [copied, setCopied] = useState(false);

  const catalogUrl = (() => {
    try {
      const url = new URL(window.location.href);
      const parts = url.pathname.split('/');
      parts[parts.length - 1] = 'catalogo.html';
      url.pathname = parts.join('/');
      url.hash = ''; url.search = '';
      return url.toString();
    } catch (e) { return ''; }
  })();

  const save = () => onSaveSettings({ whatsappNumber: waNumber, storeName, logoUrl, tagline, welcomeMessage });

  const copyLink = async () => {
    try { await navigator.clipboard.writeText(catalogUrl); setCopied(true); setTimeout(() => setCopied(false), 2000); }
    catch (e) { /* ignore */ }
  };

  const withPhoto = products.filter(p => p.photos && p.photos.length > 0).length;

  return (
    <div>
      <Section title="Configurações do catálogo público">
        <div className="bg-white border border-slate-200 p-4 grid grid-cols-2 gap-3 mb-4">
          <Field label="Nome da loja (aparece no catálogo)"><input className="fw-input" value={storeName} onChange={e => setStoreName(e.target.value)} placeholder="Nome da sua loja" /></Field>
          <Field label="WhatsApp que recebe os pedidos (DDI+DDD+número, só dígitos)"><input className="fw-input" placeholder="5571999999999" value={waNumber} onChange={e => setWaNumber(e.target.value.replace(/[^0-9]/g, ''))} /></Field>
          <div className="col-span-2"><Field label="Logo da loja (opcional — se não enviar, o nome da loja aparece como texto)"><PhotoUploader sb={sb} value={logoUrl} onChange={setLogoUrl} /></Field></div>
          <Field label="Frase de efeito (opcional — aparece numa faixa animada no catálogo)"><input className="fw-input" value={tagline} onChange={e => setTagline(e.target.value)} placeholder="Ex: Aromas que acolhem." /></Field>
          <Field label="Mensagem de boas-vindas (aparece no primeiro acesso do cliente)">
            <textarea className="fw-input" rows={2} value={welcomeMessage} onChange={e => setWelcomeMessage(e.target.value)} />
          </Field>
          <div className="col-span-2 flex justify-end"><button onClick={save} className="fw-btn"><Check size={14} />Salvar configurações</button></div>
        </div>
      </Section>

      <Section title="Publicar catálogo">
        <div className="bg-white border border-slate-200 p-4">
          <div className="text-[13px] text-slate-600 mb-3">
            {products.length} produto(s) cadastrado(s), {withPhoto} com foto. Publicar atualiza a vitrine pública com fotos, descrição, aromas/tamanhos disponíveis e preço de varejo de cada produto.
          </div>
          <button onClick={onPublish} disabled={!waNumber || publishState === 'publishing'} className="fw-btn mb-4">
            <Check size={14} />{publishState === 'publishing' ? 'Publicando...' : 'Publicar catálogo agora'}
          </button>
          {!waNumber && <div className="text-[12px] text-red-700 bg-red-50 border border-red-200 rounded-lg p-2 mb-4">Preencha e salve o número de WhatsApp antes de publicar.</div>}
          {publishState === 'published' && <div className="text-[12px] text-green-700 bg-green-50 border border-green-200 rounded-lg p-2 mb-4">Catálogo publicado com sucesso.</div>}
          {publishState === 'error' && <div className="text-[12px] text-red-700 bg-red-50 border border-red-200 rounded-lg p-2 mb-4">Erro ao publicar. Confira se rodou o seiva-setup.sql no Supabase.</div>}

          {catalogUrl && (
            <div>
              <div className="text-[11px] text-slate-500 mb-1">Link público do catálogo (envie esse link para os clientes):</div>
              <div className="flex items-center gap-2">
                <input readOnly className="fw-input flex-1" value={catalogUrl} onClick={e => e.target.select()} />
                <button onClick={copyLink} className="fw-btn-ghost">{copied ? 'Copiado!' : 'Copiar link'}</button>
              </div>
            </div>
          )}
        </div>
      </Section>
    </div>
  );
}

// ---------- Coupons ----------
const EMPTY_COUPON_FORM = { code: '', discount_type: 'percent', discount_value: '', valid_until: '', max_uses: '' };

function CouponsTab({ sb }) {
  const [coupons, setCoupons] = useState(null);
  const [form, setForm] = useState(EMPTY_COUPON_FORM);
  const [editingId, setEditingId] = useState(null);
  const [error, setError] = useState('');

  const load = async () => {
    try {
      const { data, error } = await sb.from('coupons').select('*').eq('user_id', SHARED_STORE_ID).order('created_at', { ascending: false });
      if (error) throw error;
      setCoupons(data || []);
    } catch (e) {
      console.error('Erro ao carregar cupons:', e);
      setCoupons([]);
    }
  };

  useEffect(() => { load(); }, []);

  const startEdit = (c) => {
    setEditingId(c.id);
    setForm({
      code: c.code, discount_type: c.discount_type, discount_value: c.discount_value,
      valid_until: c.valid_until || '', max_uses: c.max_uses ?? '',
    });
  };
  const cancelEdit = () => { setEditingId(null); setForm(EMPTY_COUPON_FORM); };

  const submit = async (e) => {
    e.preventDefault();
    setError('');
    if (!form.code.trim() || form.discount_value === '') return;
    const payload = {
      code: form.code.trim().toUpperCase(),
      discount_type: form.discount_type,
      discount_value: Number(form.discount_value),
      valid_until: form.valid_until || null,
      max_uses: form.max_uses === '' ? null : Number(form.max_uses),
    };
    try {
      if (editingId) {
        const { error } = await sb.from('coupons').update(payload).eq('id', editingId);
        if (error) throw error;
      } else {
        const { error } = await sb.from('coupons').insert({ ...payload, user_id: SHARED_STORE_ID, active: true, current_uses: 0 });
        if (error) throw error;
      }
      cancelEdit();
      load();
    } catch (e) {
      setError('Erro ao salvar cupom: ' + (e.message || 'tente novamente'));
    }
  };

  const toggleActive = async (c) => {
    await sb.from('coupons').update({ active: !c.active }).eq('id', c.id);
    load();
  };

  const remove = async (id) => {
    await sb.from('coupons').delete().eq('id', id);
    load();
  };

  if (coupons === null) {
    return <div className="text-slate-400 text-sm">Carregando cupons...</div>;
  }

  return (
    <div>
      <Section title={editingId ? 'Editando cupom' : 'Cadastro de cupons'}>
        <form onSubmit={submit} className="bg-white border border-slate-200 p-4 grid grid-cols-3 gap-3 mb-4">
          <Field label="Código do cupom"><input className="fw-input" style={{ textTransform: 'uppercase' }} value={form.code} onChange={e => setForm(f => ({ ...f, code: e.target.value.toUpperCase().replace(/\s+/g, '') }))} placeholder="SEIVA10" /></Field>
          <Field label="Tipo de desconto">
            <select className="fw-input" value={form.discount_type} onChange={e => setForm(f => ({ ...f, discount_type: e.target.value }))}>
              <option value="percent">Percentual (%)</option>
              <option value="fixed">Valor fixo (R$)</option>
            </select>
          </Field>
          <Field label={form.discount_type === 'percent' ? 'Percentual de desconto' : 'Valor de desconto (R$)'}>
            <input type="number" step="0.01" className="fw-input" value={form.discount_value} onChange={e => setForm(f => ({ ...f, discount_value: e.target.value }))} />
          </Field>
          <Field label="Validade (opcional)"><input type="date" className="fw-input" value={form.valid_until} onChange={e => setForm(f => ({ ...f, valid_until: e.target.value }))} /></Field>
          <Field label="Quantidade máxima de usos (opcional)"><input type="number" min="1" className="fw-input" value={form.max_uses} onChange={e => setForm(f => ({ ...f, max_uses: e.target.value }))} placeholder="Deixe em branco para ilimitado" /></Field>
          <div className="flex items-end gap-3">
            {editingId && <button type="button" onClick={cancelEdit} className="fw-btn-ghost">Cancelar</button>}
            <button className="fw-btn" type="submit">
              {editingId ? <Check size={14} /> : <Plus size={14} />}
              {editingId ? 'Salvar' : 'Adicionar cupom'}
            </button>
          </div>
          {error && <div className="col-span-3 text-[12px] text-red-700 bg-red-50 border border-red-200 rounded-lg p-2">{error}</div>}
        </form>
      </Section>

      <div className="bg-white border border-slate-200 overflow-x-auto">
        <table className="w-full fw-table">
          <thead><tr><th>Cupom</th><th>Cadastro</th><th>Validade</th><th>Desconto</th><th>Usos</th><th>Status</th><th></th></tr></thead>
          <tbody>
            {coupons.length === 0 && <tr><td colSpan={7} className="text-slate-400 text-center py-6">Nenhum cupom cadastrado.</td></tr>}
            {coupons.map(c => (
              <tr key={c.id}>
                <td className="font-medium text-slate-900 fw-mono">{c.code}</td>
                <td>{(c.created_at || '').slice(0, 10)}</td>
                <td>{c.valid_until || 'sem validade'}</td>
                <td>{c.discount_type === 'percent' ? `${c.discount_value}%` : formatBRL(c.discount_value)}</td>
                <td>{c.current_uses}{c.max_uses != null ? ` / ${c.max_uses}` : ' / ∞'}</td>
                <td>
                  <button onClick={() => toggleActive(c)} className="fw-btn-ghost">
                    {c.active ? 'Ativo' : 'Inativo'}
                  </button>
                </td>
                <td className="flex gap-1">
                  <button onClick={() => startEdit(c)} className="fw-btn-ghost"><Pencil size={13} /></button>
                  <button onClick={() => remove(c.id)} className="fw-btn-ghost"><Trash2 size={13} /></button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ---------- Stock ----------
function StockTab({ products, onSetStock, onUpdateProduct }) {
  return (
    <div>
      <Section title="Controle de estoque por aroma e tamanho">
        {products.length === 0 && <div className="text-slate-400 text-sm">Cadastre produtos primeiro na aba Produtos.</div>}
        {products.map(p => {
          const colors = [...new Set(p.variants.map(v => v.color))];

          return (
            <div key={p.id} className="bg-white border border-slate-200 p-4 mb-4">
              <div className="flex items-center justify-between mb-3">
                <div className="font-semibold text-slate-900">{p.name}</div>
                <label className="flex items-center gap-2 text-xs text-slate-500">

                  <input type="number" className="fw-input w-16" value={p.minStock ?? 3} onChange={e => onUpdateProduct(p.id, { minStock: Number(e.target.value) })} />
                </label>
              </div>
              <table className="w-full fw-table">
                <thead><tr><th>Aroma</th>{sizes.map(s => <th key={s} className="text-center">{s}</th>)}</tr></thead>
                <tbody>
                  {colors.map(color => (
                    <tr key={color}>
                      <td className="font-medium">{color}</td>

                          <td key={size} className="text-center">

                              value={v ? v.stock : 0}
                              onChange={e => onSetStock(p.id, color, size, e.target.value)}
                            />
                          </td>
                        );
                      })}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          );
        })}

// ---------- Sales ----------
function SalesTab({ products, clients, sales, onRegister, onDelete }) {
  const [clientId, setClientId] = useState('');
  const [type, setType] = useState('varejo');
  const [date, setDate] = useState(todayISO());
  const [cart, setCart] = useState([]);
  const [pick, setPick] = useState({ productId: '', color: '', size: '', qty: 1 });

  const selectedProduct = products.find(p => p.id === pick.productId);
  const colorsAvail = selectedProduct ? [...new Set(selectedProduct.variants.map(v => v.color))] : [];
  const sizesAvail = selectedProduct && pick.color ? [...new Set(selectedProduct.variants.filter(v => v.color === pick.color).map(v => v.size))] : [];
  const variantAvail = selectedProduct && pick.color ? selectedProduct.variants.find(v => v.color === pick.color && v.size === pick.size) : null;

  const addToCart = () => {
    if (!selectedProduct || !pick.color || !pick.size || !pick.qty) return;
    const price = type === 'atacado' ? selectedProduct.wholesale : selectedProduct.retail;
    setCart(c => [...c, { productId: pick.productId, productName: selectedProduct.name, color: pick.color, size: pick.size, qty: Number(pick.qty), price }]);
    setPick({ productId: '', color: '', size: '', qty: 1 });
  };
  const removeFromCart = (i) => setCart(c => c.filter((_, idx) => idx !== i));
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);

  const submitSale = () => {
    if (cart.length === 0) return;
    const client = clients.find(c => c.id === clientId);
    onRegister({ date, clientId: clientId || null, clientName: client ? client.name : 'Consumidor final', type, items: cart });
    setCart([]);
  };

  return (
    <div>
      <Section title="Registrar venda">
        <div className="bg-white border border-slate-200 p-4 mb-4">
          <div className="grid grid-cols-4 gap-3 mb-4">
            <Field label="Data"><input type="date" className="fw-input" value={date} onChange={e => setDate(e.target.value)} /></Field>
            <Field label="Cliente">
              <select className="fw-input" value={clientId} onChange={e => setClientId(e.target.value)}>
                <option value="">Consumidor final</option>
                {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </Field>
            <Field label="Tipo de venda">
              <select className="fw-input" value={type} onChange={e => setType(e.target.value)}>
                <option value="varejo">Varejo</option><option value="atacado">Atacado</option>
              </select>
            </Field>
          </div>

          <div className="grid grid-cols-5 gap-3 items-end mb-3 border-t border-slate-200 pt-3">
            <Field label="Produto">
              <select className="fw-input" value={pick.productId} onChange={e => setPick({ productId: e.target.value, color: '', size: '', qty: 1 })}>
                <option value="">Selecione</option>
                {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </Field>
            <Field label="Aroma">
              <select className="fw-input" value={pick.color} onChange={e => { const color = e.target.value; const s = selectedProduct ? [...new Set(selectedProduct.variants.filter(v => v.color === color).map(v => v.size))] : []; setPick(p => ({ ...p, color, size: s.length === 1 ? s[0] : '' })); }} disabled={!selectedProduct}>
                <option value="">Selecione</option>
                {colorsAvail.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="Tamanho">
              <select className="fw-input" value={pick.size} onChange={e => setPick(p => ({ ...p, size: e.target.value }))} disabled={!pick.color}>
                <option value="">Selecione</option>
                {sizesAvail.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </Field>
            <Field label={`Qtd ${variantAvail ? `(disp: ${variantAvail.stock})` : ''}`}>
              <input type="number" min="1" className="fw-input" value={pick.qty} onChange={e => setPick(p => ({ ...p, qty: e.target.value }))} />
            </Field>
            <button onClick={addToCart} className="fw-btn justify-center"><Plus size={14} />Adicionar item</button>
          </div>

          {cart.length > 0 && (
            <div className="border-t border-slate-200 pt-3">
              <table className="w-full fw-table">
                <thead><tr><th>Produto</th><th>Aroma</th><th>Tam.</th><th>Qtd</th><th>Preço unit.</th><th>Subtotal</th><th></th></tr></thead>
                <tbody>
                  {cart.map((i, idx) => (
                    <tr key={idx}>
                      <td>{i.productName}</td><td>{i.color}</td><td>{i.size}</td><td>{i.qty}</td>
                      <td>{formatBRL(i.price)}</td><td>{formatBRL(i.price * i.qty)}</td>
                      <td><button onClick={() => removeFromCart(idx)} className="fw-btn-ghost"><X size={12} /></button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div className="flex items-center justify-between mt-3">
                <div className="fw-mono text-slate-900 font-semibold text-lg">Total: {formatBRL(total)}</div>
                <button onClick={submitSale} className="fw-btn"><Check size={14} />Finalizar venda</button>
              </div>
            </div>
          )}
        </div>
      </Section>

      <Section title="Histórico de vendas">
        <div className="bg-white border border-slate-200 overflow-x-auto">
          <table className="w-full fw-table">
            <thead><tr><th>Data</th><th>Cliente</th><th>Tipo</th><th>Total</th><th>Lucro</th><th></th></tr></thead>
            <tbody>
              {sales.length === 0 && <tr><td colSpan={6} className="text-slate-400 text-center py-6">Nenhuma venda registrada.</td></tr>}
              {[...sales].reverse().map(s => (
                <tr key={s.id}>
                  <td>{s.date}</td><td>{s.clientName}</td><td className="capitalize">{s.type}</td>
                  <td>{formatBRL(s.total)}</td>
                  <td className={s.profit >= 0 ? 'text-green-600' : 'text-red-600'}>{formatBRL(s.profit)}</td>
                  <td><button onClick={() => onDelete(s.id)} className="fw-btn-ghost"><Trash2 size={13} /></button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Section>
    </div>
  );
}

// ---------- Purchases ----------
function PurchasesTab({ products, purchases, onRegister, onDelete }) {
  const [supplier, setSupplier] = useState('');
  const [date, setDate] = useState(todayISO());
  const [cart, setCart] = useState([]);
  const [pick, setPick] = useState({ productId: '', color: '', size: '', qty: 1, cost: '' });

  const selectedProduct = products.find(p => p.id === pick.productId);
  const colorsAvail = selectedProduct ? [...new Set(selectedProduct.variants.map(v => v.color))] : [];
  const sizesAvail = selectedProduct && pick.color ? [...new Set(selectedProduct.variants.filter(v => v.color === pick.color).map(v => v.size))] : [];

  const addToCart = () => {
    if (!selectedProduct || !pick.color || !pick.size || !pick.qty) return;
    const cost = pick.cost !== '' ? Number(pick.cost) : selectedProduct.cost;
    setCart(c => [...c, { productId: pick.productId, productName: selectedProduct.name, color: pick.color, size: pick.size, qty: Number(pick.qty), cost }]);
    setPick({ productId: '', color: '', size: '', qty: 1, cost: '' });
  };
  const removeFromCart = (i) => setCart(c => c.filter((_, idx) => idx !== i));
  const total = cart.reduce((s, i) => s + i.cost * i.qty, 0);

  const submit = () => {
    if (cart.length === 0 || !supplier.trim()) return;
    onRegister({ date, supplier, items: cart });
    setCart([]); setSupplier('');
  };

  return (
    <div>
      <Section title="Registrar compra de fornecedor">
        <div className="bg-white border border-slate-200 p-4 mb-4">
          <div className="grid grid-cols-3 gap-3 mb-4">
            <Field label="Data"><input type="date" className="fw-input" value={date} onChange={e => setDate(e.target.value)} /></Field>
            <Field label="Fornecedor"><input className="fw-input" value={supplier} onChange={e => setSupplier(e.target.value)} placeholder="Nome do fornecedor" /></Field>
          </div>
          <div className="grid grid-cols-5 gap-3 items-end mb-3 border-t border-slate-200 pt-3">
            <Field label="Produto">
              <select className="fw-input" value={pick.productId} onChange={e => setPick({ productId: e.target.value, color: '', size: '', qty: 1, cost: '' })}>
                <option value="">Selecione</option>
                {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </Field>
            <Field label="Aroma">
              <select className="fw-input" value={pick.color} onChange={e => { const color = e.target.value; const s = selectedProduct ? [...new Set(selectedProduct.variants.filter(v => v.color === color).map(v => v.size))] : []; setPick(p => ({ ...p, color, size: s.length === 1 ? s[0] : '' })); }} disabled={!selectedProduct}>
                <option value="">Selecione</option>
                {colorsAvail.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="Tamanho">
              <select className="fw-input" value={pick.size} onChange={e => setPick(p => ({ ...p, size: e.target.value }))} disabled={!pick.color}>
                <option value="">Selecione</option>
                {sizesAvail.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </Field>
            <Field label="Qtd"><input type="number" min="1" className="fw-input" value={pick.qty} onChange={e => setPick(p => ({ ...p, qty: e.target.value }))} /></Field>
            <button onClick={addToCart} className="fw-btn justify-center"><Plus size={14} />Adicionar item</button>
          </div>
          {cart.length > 0 && (
            <div className="border-t border-slate-200 pt-3">
              <table className="w-full fw-table">
                <thead><tr><th>Produto</th><th>Aroma</th><th>Tam.</th><th>Qtd</th><th>Custo unit.</th><th>Subtotal</th><th></th></tr></thead>
                <tbody>
                  {cart.map((i, idx) => (
                    <tr key={idx}>
                      <td>{i.productName}</td><td>{i.color}</td><td>{i.size}</td><td>{i.qty}</td>
                      <td>{formatBRL(i.cost)}</td><td>{formatBRL(i.cost * i.qty)}</td>
                      <td><button onClick={() => removeFromCart(idx)} className="fw-btn-ghost"><X size={12} /></button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div className="flex items-center justify-between mt-3">
                <div className="fw-mono text-slate-900 font-bold text-lg">Total: {formatBRL(total)}</div>
                <button onClick={submit} className="fw-btn"><Check size={14} />Registrar compra</button>
              </div>
            </div>
          )}
        </div>
      </Section>

      <Section title="Histórico de compras">
        <div className="bg-white border border-slate-200 overflow-x-auto">
          <table className="w-full fw-table">
            <thead><tr><th>Data</th><th>Fornecedor</th><th>Itens</th><th>Total</th><th></th></tr></thead>
            <tbody>
              {purchases.length === 0 && <tr><td colSpan={5} className="text-slate-400 text-center py-6">Nenhuma compra registrada.</td></tr>}
              {[...purchases].reverse().map(p => (
                <tr key={p.id}>
                  <td>{p.date}</td><td>{p.supplier}</td><td>{p.items.length}</td><td>{formatBRL(p.total)}</td>
                  <td><button onClick={() => onDelete(p.id)} className="fw-btn-ghost"><Trash2 size={13} /></button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Section>
    </div>
  );
}

// ---------- Pricing calculator ----------
function PricingTab({ products, costs, margin, onAddCost, onDeleteCost, onSetMargin, onApplyPrice }) {
  const [productId, setProductId] = useState('');
  const [manualCost, setManualCost] = useState('');
  const [form, setForm] = useState({ name: '', type: 'fixo', value: '' });

  const product = products.find(p => p.id === productId);
  const baseCost = productId ? (manualCost !== '' ? Number(manualCost) : (product ? product.cost : 0)) : Number(manualCost) || 0;

  const fixedItems = costs.filter(c => c.type === 'fixo');
  const percentItems = costs.filter(c => c.type === 'percentual');
  const marginNum = Number(margin) || 0;

  const totalFixed = baseCost + fixedItems.reduce((s, c) => s + Number(c.value), 0);
  const totalPercent = percentItems.reduce((s, c) => s + Number(c.value), 0) + marginNum;
  const invalid = totalPercent >= 100;
  const suggestedPrice = invalid ? null : totalFixed / (1 - totalPercent / 100);

  const submitCost = (e) => {
    e.preventDefault();
    if (!form.name.trim() || form.value === '') return;
    onAddCost({ name: form.name, type: form.type, value: Number(form.value) });
    setForm({ name: '', type: 'fixo', value: '' });
  };

  return (
    <div>
      <Section title="Custos cadastrados">
        <form onSubmit={submitCost} className="bg-white border border-slate-200 p-4 grid grid-cols-4 gap-3 mb-4">
          <Field label="Nome do custo"><input className="fw-input" value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} placeholder="Frete, embalagem, taxa cartão..." /></Field>
          <Field label="Tipo">
            <select className="fw-input" value={form.type} onChange={e => setForm(f => ({ ...f, type: e.target.value }))}>
              <option value="fixo">Valor fixo (R$)</option>
              <option value="percentual">Percentual (%) do preço</option>
            </select>
          </Field>
          <Field label={form.type === 'fixo' ? 'Valor (R$)' : 'Percentual (%)'}>
            <input type="number" step="0.01" className="fw-input" value={form.value} onChange={e => setForm(f => ({ ...f, value: e.target.value }))} />
          </Field>
          <div className="flex items-end"><button className="fw-btn" type="submit"><Plus size={14} />Adicionar custo</button></div>
        </form>
        <div className="bg-white border border-slate-200 overflow-x-auto">
          <table className="w-full fw-table">
            <thead><tr><th>Custo</th><th>Tipo</th><th>Valor</th><th></th></tr></thead>
            <tbody>
              {costs.length === 0 && <tr><td colSpan={4} className="text-slate-400 text-center py-6">Nenhum custo cadastrado ainda.</td></tr>}
              {costs.map(c => (
                <tr key={c.id}>
                  <td className="text-slate-900">{c.name}</td>
                  <td>{c.type === 'fixo' ? 'Valor fixo' : 'Percentual do preço'}</td>
                  <td>{c.type === 'fixo' ? formatBRL(c.value) : `${c.value}%`}</td>
                  <td><button onClick={() => onDeleteCost(c.id)} className="fw-btn-ghost"><Trash2 size={13} /></button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Section>

      <Section title="Calcular preço de venda">
        <div className="bg-white border border-slate-200 p-4 mb-4">
          <div className="grid grid-cols-3 gap-3 mb-4">
            <Field label="Produto (opcional — preenche o custo automaticamente)">
              <select className="fw-input" value={productId} onChange={e => { setProductId(e.target.value); setManualCost(''); }}>
                <option value="">Nenhum — inserir custo manualmente</option>
                {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </Field>
            <Field label="Custo do produto (R$)">
              <input type="number" step="0.01" className="fw-input"
                value={manualCost !== '' ? manualCost : (product ? product.cost : '')}
                onChange={e => setManualCost(e.target.value)} />
            </Field>
            <Field label="Margem de lucro desejada (%)">
              <input type="number" step="0.01" className="fw-input" value={margin} onChange={e => onSetMargin(e.target.value === '' ? '' : Number(e.target.value))} />
            </Field>
          </div>

          {invalid ? (
            <div className="text-[13px] text-red-700 bg-red-50 border border-red-200 rounded-lg p-3">
              ⚠ Os percentuais cadastrados (custos + margem) somam {totalPercent.toFixed(1)}%, que é igual ou maior que 100%.
              Não existe preço possível nessas condições — reduza a margem ou os custos percentuais.
            </div>
          ) : (
            <div>
              <div className="flex flex-wrap gap-4 mb-4">
                <StatCard label="Preço de venda sugerido" value={formatBRL(suggestedPrice)} />
                <StatCard label="Custos totais (R$)" value={formatBRL(totalFixed + percentItems.reduce((s, c) => s + suggestedPrice * (Number(c.value) / 100), 0))} />
                <StatCard label="Lucro líquido estimado" value={formatBRL(suggestedPrice * (marginNum / 100))} sub={`${marginNum}% do preço`} />
              </div>

              <div className="bg-white border border-slate-200 p-4 mb-4">
                <div className="text-sm font-semibold text-slate-700 mb-3">Como esse preço se decompõe</div>
                <table className="w-full fw-table">
                  <thead><tr><th>Item</th><th>Tipo</th><th>Valor em R$ no preço final</th></tr></thead>
                  <tbody>
                    <tr><td>Custo do produto + custos fixos</td><td>Fixo</td><td>{formatBRL(totalFixed)}</td></tr>
                    {percentItems.map(c => (
                      <tr key={c.id}><td>{c.name}</td><td>{c.value}%</td><td>{formatBRL(suggestedPrice * (Number(c.value) / 100))}</td></tr>
                    ))}
                    <tr><td className="font-semibold text-slate-900">Margem de lucro</td><td>{marginNum}%</td><td className="font-semibold text-slate-900">{formatBRL(suggestedPrice * (marginNum / 100))}</td></tr>
                  </tbody>
                </table>
              </div>

              {product && (
                <div className="flex gap-3">
                  <button onClick={() => onApplyPrice(product.id, 'retail', suggestedPrice)} className="fw-btn"><Check size={14} />Aplicar como preço de varejo</button>
                  <button onClick={() => onApplyPrice(product.id, 'wholesale', suggestedPrice)} className="fw-btn-ghost"><Check size={14} />Aplicar como preço de atacado</button>
                </div>
              )}
            </div>
          )}
        </div>
      </Section>
    </div>
  );
}

// ---------- Finance ----------
function FinanceTab({ finance, onAdd, onDelete, cashFlow }) {

    e.preventDefault();
    if (!form.value || !form.desc.trim()) return;
    onAdd({ ...form, value: Number(form.value) });
    setForm({ date: todayISO(), type: 'entrada', category: '', desc: '', value: '' });
  };
  const balance = finance.reduce((s, f) => s + (f.type === 'entrada' ? f.value : -f.value), 0);
  const totalIn = finance.filter(f => f.type === 'entrada').reduce((s, f) => s + f.value, 0);

  return (
    <div>
      <Section title="Entradas e saídas financeiras">

              {finance.length === 0 && <tr><td colSpan={6} className="text-slate-400 text-center py-6">Nenhum lançamento.</td></tr>}

                  <td>{f.date}</td>

// ---------- Expenses (saídas) ----------
const EXPENSE_CATEGORIES = ['Entrega/Frete', 'Embalagem', 'Marketing', 'Aluguel', 'Taxas e impostos', 'Salários', 'Outros'];

function ExpensesTab({ finance, sales, onAdd, onDelete }) {
  const months = useMemo(() => {
    const set = new Set([...finance.map(f => monthKey(f.date)), ...sales.map(s => monthKey(s.date))]);
    set.add(monthKey(todayISO()));
    return [...set].sort().reverse();
  }, [finance, sales]);
  const [month, setMonth] = useState(monthKey(todayISO()));
  const mk = months.includes(month) ? month : months[0];

  const [form, setForm] = useState({ date: todayISO(), category: EXPENSE_CATEGORIES[0], desc: '', value: '' });

  const submit = (e) => {
    e.preventDefault();
    if (!form.value || !form.desc.trim()) return;
    onAdd({ date: form.date, type: 'saida', category: form.category, desc: form.desc, value: Number(form.value) });
    setForm({ date: todayISO(), category: EXPENSE_CATEGORIES[0], desc: '', value: '' });
  };

  const monthExpenses = finance.filter(f => f.type === 'saida' && monthKey(f.date) === mk);
  const monthSales = sales.filter(s => monthKey(s.date) === mk);
  const revenue = monthSales.reduce((s, x) => s + x.total, 0);
  const cogs = monthSales.reduce((s, x) => s + x.costTotal, 0);
  const totalExpenses = monthExpenses.reduce((s, x) => s + x.value, 0);
  const realProfit = revenue - cogs - totalExpenses;

  const byCategory = useMemo(() => {
    const map = {};
    monthExpenses.forEach(f => { const cat = f.category || 'Outros'; map[cat] = (map[cat] || 0) + f.value; });
    return Object.entries(map).sort(([, a], [, b]) => b - a);
  }, [monthExpenses]);

  return (
    <div>
      <Section title="Saídas — o que realmente sai do caixa" action={
        <select className="fw-input" value={mk} onChange={e => setMonth(e.target.value)}>
          {months.map(m => <option key={m} value={m}>{monthLabel(m)}</option>)}
        </select>
      }>
        <div className="flex flex-wrap gap-4 mb-6">
          <StatCard label="Faturamento bruto (vendas)" value={formatBRL(revenue)} />
          <StatCard label="Custo dos produtos vendidos" value={formatBRL(cogs)} />
          <StatCard label="Saídas registradas" value={formatBRL(totalExpenses)} alert={totalExpenses > 0} />
          <StatCard label="Lucro real do mês" value={formatBRL(realProfit)} alert={realProfit < 0} />
        </div>
        <div className="text-[11px] text-slate-500 mb-6 fw-mono">
          lucro real = faturamento bruto − custo dos produtos vendidos − saídas registradas (entrega, embalagem, despesas gerais etc.)
        </div>

        <form onSubmit={submit} className="bg-white border border-slate-200 p-4 grid grid-cols-5 gap-3 mb-6">
          <Field label="Data"><input type="date" className="fw-input" value={form.date} onChange={e => setForm(f => ({ ...f, date: e.target.value }))} /></Field>
          <Field label="Categoria">
            <select className="fw-input" value={form.category} onChange={e => setForm(f => ({ ...f, category: e.target.value }))}>
              {EXPENSE_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </Field>
          <Field label="Descrição"><input className="fw-input" value={form.desc} onChange={e => setForm(f => ({ ...f, desc: e.target.value }))} placeholder="Ex: entrega pedido #123" /></Field>
          <Field label="Valor"><input type="number" step="0.01" className="fw-input" value={form.value} onChange={e => setForm(f => ({ ...f, value: e.target.value }))} /></Field>
          <div className="flex items-end"><button className="fw-btn" type="submit"><Plus size={14} />Registrar saída</button></div>
        </form>

        <div className="grid grid-cols-2 gap-6">
          <div className="bg-white border border-slate-200 overflow-x-auto">
            <table className="w-full fw-table">
              <thead><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th>Valor</th><th></th></tr></thead>
              <tbody>
                {monthExpenses.length === 0 && <tr><td colSpan={5} className="text-slate-400 text-center py-6">Nenhuma saída registrada neste mês.</td></tr>}
                {[...monthExpenses].reverse().map(f => (
                  <tr key={f.id}>
                    <td>{f.date}</td>
                    <td>{f.category || '-'}</td>
                    <td>{f.desc}{f.auto && <span className="text-slate-400 text-[10px] ml-1">(auto)</span>}</td>
                    <td className="text-slate-900">{formatBRL(f.value)}</td>
                    <td>{!f.auto && <button onClick={() => onDelete(f.id)} className="fw-btn-ghost"><Trash2 size={13} /></button>}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="bg-white border border-slate-200 p-4">
            <div className="text-sm font-semibold text-slate-700 mb-3">Saídas por categoria neste mês</div>
            {byCategory.length === 0 ? <div className="text-slate-400 text-sm">Sem dados ainda.</div> : (
              <table className="w-full fw-table">
                <thead><tr><th>Categoria</th><th>Total</th></tr></thead>
                <tbody>{byCategory.map(([cat, val]) => <tr key={cat}><td>{cat}</td><td>{formatBRL(val)}</td></tr>)}</tbody>
              </table>
            )}
          </div>
        </div>
      </Section>
    </div>
  );
}

// ---------- Orders ----------
const ORDER_STATUS = ['pendente', 'enviado', 'entregue'];
function OrdersTab({ products, clients, orders, onAdd, onUpdateStatus, onDelete }) {
  const [clientId, setClientId] = useState('');
  const [date, setDate] = useState(todayISO());
  const [notes, setNotes] = useState('');
  const [cart, setCart] = useState([]);
  const [pick, setPick] = useState({ productId: '', color: '', size: '', qty: 1 });

  const selectedProduct = products.find(p => p.id === pick.productId);
  const colorsAvail = selectedProduct ? [...new Set(selectedProduct.variants.map(v => v.color))] : [];
  const sizesAvail = selectedProduct && pick.color ? [...new Set(selectedProduct.variants.filter(v => v.color === pick.color).map(v => v.size))] : [];

  const addToCart = () => {
    if (!selectedProduct || !pick.color || !pick.size || !pick.qty) return;
    setCart(c => [...c, { productId: pick.productId, productName: selectedProduct.name, color: pick.color, size: pick.size, qty: Number(pick.qty) }]);
    setPick({ productId: '', color: '', size: '', qty: 1 });
  };

  const submit = () => {
    if (cart.length === 0) return;
    const client = clients.find(c => c.id === clientId);
    onAdd({ date, clientId: clientId || null, clientName: client ? client.name : 'Consumidor final', items: cart, status: 'pendente', notes });
    setCart([]); setNotes('');
  };

  return (
    <div>
      <Section title="Novo pedido">
        <div className="bg-white border border-slate-200 p-4 mb-4">
          <div className="grid grid-cols-3 gap-3 mb-4">
            <Field label="Data"><input type="date" className="fw-input" value={date} onChange={e => setDate(e.target.value)} /></Field>
            <Field label="Cliente">
              <select className="fw-input" value={clientId} onChange={e => setClientId(e.target.value)}>
                <option value="">Consumidor final</option>
                {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </Field>
            <Field label="Observações"><input className="fw-input" value={notes} onChange={e => setNotes(e.target.value)} /></Field>
          </div>
          <div className="grid grid-cols-5 gap-3 items-end mb-3 border-t border-slate-200 pt-3">
            <Field label="Produto">
              <select className="fw-input" value={pick.productId} onChange={e => setPick({ productId: e.target.value, color: '', size: '', qty: 1 })}>
                <option value="">Selecione</option>
                {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </Field>
            <Field label="Aroma">
              <select className="fw-input" value={pick.color} onChange={e => { const color = e.target.value; const s = selectedProduct ? [...new Set(selectedProduct.variants.filter(v => v.color === color).map(v => v.size))] : []; setPick(p => ({ ...p, color, size: s.length === 1 ? s[0] : '' })); }} disabled={!selectedProduct}>
                <option value="">Selecione</option>
                {colorsAvail.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="Tamanho">
              <select className="fw-input" value={pick.size} onChange={e => setPick(p => ({ ...p, size: e.target.value }))} disabled={!pick.color}>
                <option value="">Selecione</option>
                {sizesAvail.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </Field>
            <Field label="Qtd"><input type="number" min="1" className="fw-input" value={pick.qty} onChange={e => setPick(p => ({ ...p, qty: e.target.value }))} /></Field>
            <button onClick={addToCart} className="fw-btn justify-center"><Plus size={14} />Adicionar item</button>
          </div>
          {cart.length > 0 && (
            <div className="border-t border-slate-200 pt-3">
              <table className="w-full fw-table">
                <thead><tr><th>Produto</th><th>Aroma</th><th>Tam.</th><th>Qtd</th></tr></thead>
                <tbody>{cart.map((i, idx) => <tr key={idx}><td>{i.productName}</td><td>{i.color}</td><td>{i.size}</td><td>{i.qty}</td></tr>)}</tbody>
              </table>
              <div className="flex justify-end mt-3"><button onClick={submit} className="fw-btn"><Check size={14} />Criar pedido</button></div>
            </div>
          )}
        </div>
      </Section>

      <Section title="Pedidos">
        <div className="bg-white border border-slate-200 overflow-x-auto">
          <table className="w-full fw-table">
            <thead><tr><th>Data</th><th>Cliente</th><th>Itens</th><th>Status</th><th></th></tr></thead>
            <tbody>
              {orders.length === 0 && <tr><td colSpan={5} className="text-slate-400 text-center py-6">Nenhum pedido registrado.</td></tr>}
              {[...orders].reverse().map(o => (
                <tr key={o.id}>
                  <td>{o.date}</td><td>{o.clientName}</td>
                  <td>{o.items.map(i => `${i.productName} (${variantLabel(i.color, i.size)} x${i.qty})`).join(', ')}</td>
                  <td>
                    <select className="fw-input" value={o.status} onChange={e => onUpdateStatus(o.id, e.target.value)}
                      style={{ color: '#ffffff', fontWeight: o.status === 'pendente' ? 700 : 400, fontStyle: o.status === 'enviado' ? 'italic' : 'normal', textDecoration: o.status === 'pendente' ? 'underline' : 'none' }}>
                      {ORDER_STATUS.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </td>
                  <td><button onClick={() => onDelete(o.id)} className="fw-btn-ghost"><Trash2 size={13} /></button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Section>
    </div>
  );
}

// ---------- Reports ----------
function ReportsTab({ sales, purchases, finance, products }) {
  const months = useMemo(() => {
    const set = new Set([...sales.map(s => monthKey(s.date)), ...purchases.map(p => monthKey(p.date)), ...finance.map(f => monthKey(f.date))]);
    return [...set].sort().reverse();
  }, [sales, purchases, finance]);
  const [selected, setSelected] = useState(months[0] || thisMk());
  function thisMk() { return monthKey(todayISO()); }
  const mk = months.includes(selected) ? selected : (months[0] || thisMk());

  const monthSales = sales.filter(s => monthKey(s.date) === mk);
  const monthPurchases = purchases.filter(p => monthKey(p.date) === mk);
  const monthExpenses = finance.filter(f => monthKey(f.date) === mk && f.type === 'saida' && !f.auto);
  const revenue = monthSales.reduce((s, x) => s + x.total, 0);
  const cost = monthSales.reduce((s, x) => s + x.costTotal, 0);
  const expenses = monthExpenses.reduce((s, x) => s + x.value, 0);
  const purchaseTotal = monthPurchases.reduce((s, x) => s + x.total, 0);
  const netProfit = revenue - cost - expenses;

  const topProducts = useMemo(() => {
    const map = {};
    monthSales.forEach(s => s.items.forEach(i => { map[i.productName] = (map[i.productName] || 0) + i.qty; }));
    return Object.entries(map).sort(([, a], [, b]) => b - a).slice(0, 5);
  }, [monthSales]);

  return (
    <div>
      <Section title="Relatório mensal" action={
        <select className="fw-input" value={mk} onChange={e => setSelected(e.target.value)}>
          {months.length === 0 && <option value={thisMk()}>{monthLabel(thisMk())}</option>}
          {months.map(m => <option key={m} value={m}>{monthLabel(m)}</option>)}
        </select>
      }>
        <div className="flex flex-wrap gap-4 mb-6">
          <StatCard label="Receita de vendas" value={formatBRL(revenue)} />
          <StatCard label="Custo dos produtos vendidos" value={formatBRL(cost)} tone="neutral" />
          <StatCard label="Compras de fornecedores" value={formatBRL(purchaseTotal)} tone="neutral" />
          <StatCard label="Despesas" value={formatBRL(expenses)} />
          <StatCard label="Lucro líquido" value={formatBRL(netProfit)} alert={netProfit < 0} />
        </div>

        <div className="bg-white border border-slate-200 p-4">
          <div className="text-sm font-semibold text-slate-700 mb-3">Produtos mais vendidos no mês</div>
          {topProducts.length === 0 ? <div className="text-slate-400 text-sm">Sem vendas neste mês.</div> : (
            <table className="w-full fw-table">
              <thead><tr><th>Produto</th><th>Unidades vendidas</th></tr></thead>
              <tbody>{topProducts.map(([name, qty]) => <tr key={name}><td>{name}</td><td>{qty}</td></tr>)}</tbody>
            </table>
          )}
        </div>
      </Section>
    </div>
  );
}

      <Fonts />
      <div className="w-full max-w-lg bg-white rounded-xl p-6">
        <div className="mb-6"><BrandMark variant="light" height="h-6" fontSize={17} /></div>

function LoginScreen({ sb }) {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [info, setInfo] = useState('');
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError(''); setInfo(''); setLoading(true);
    try {
      if (mode === 'login') {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        setInfo('Conta criada! Se a confirmação por e-mail estiver ativa no seu projeto, confira sua caixa de entrada antes de entrar.');
      }
    } catch (e) {
      setError(e.message || 'Algo deu errado. Tente novamente.');
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center fw-body px-4" style={{ backgroundColor: '#0F172A' }}>
      <Fonts />
      <div className="w-full max-w-sm">
        <div className="flex items-center justify-center mb-8"><BrandMark variant="dark" height="h-8" fontSize={24} /></div>
        <form onSubmit={submit} className="bg-white rounded-xl p-6 flex flex-col gap-3">
          <div className="flex mb-2 border border-slate-200 rounded-lg overflow-hidden">
            <button type="button" onClick={() => setMode('login')}
              className="flex-1 py-2 text-xs font-medium" style={mode === 'login' ? { backgroundColor: '#6C5BFF', color: '#fff' } : { color: '#64748B' }}>Entrar</button>
            <button type="button" onClick={() => setMode('signup')}
              className="flex-1 py-2 text-xs font-medium" style={mode === 'signup' ? { backgroundColor: '#6C5BFF', color: '#fff' } : { color: '#64748B' }}>Criar conta</button>
          </div>
          <Field label="E-mail">
            <input type="email" required className="fw-input" value={email} onChange={e => setEmail(e.target.value)} placeholder="voce@email.com" />
          </Field>
          <Field label="Senha">
            <input type="password" required minLength={6} className="fw-input" value={password} onChange={e => setPassword(e.target.value)} placeholder="mínimo 6 caracteres" />
          </Field>
          {error && <div className="text-[12px] rounded-lg p-2" style={{ color: '#991B1B', backgroundColor: '#FEE2E2' }}>{error}</div>}
          {info && <div className="text-[12px] rounded-lg p-2" style={{ color: '#475569', backgroundColor: '#F1F5F9' }}>{info}</div>}
          <button type="submit" disabled={loading} className="fw-btn justify-center mt-1">
            {loading ? 'aguarde...' : mode === 'login' ? 'Entrar' : 'Criar conta'}
          </button>
        </form>
        <div className="text-center text-[11px] mt-4 fw-mono" style={{ color: '#64748B' }}>
          seus dados ficam privados, vinculados só a este login
        </div>
      </div>
    </div>
  );
}

function AuthGate({ sb }) {
  const [session, setSession] = useState(undefined);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = sb.auth.onAuthStateChange((_event, newSession) => {
      setSession(newSession);
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  if (session === undefined) {
    return (
      <div className="min-h-screen flex items-center justify-center fw-mono text-sm" style={{ backgroundColor: '#0F172A', color: '#94A3B8' }}>
        verificando login...
      </div>
    );
  }

  if (!session) {
    return <LoginScreen sb={sb} />;
  }

  return <App sb={sb} session={session} onSignOut={() => sb.auth.signOut()} />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(CONFIG_OK ? <AuthGate sb={sb} /> : <ConfigNeeded />);
</script>
